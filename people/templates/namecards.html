<!doctype html>
<html lang="zh-Hans">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>侍天 TIANSIGHT · 名片</title>
<link rel="stylesheet" href="../brand/fonts.css">
<link rel="stylesheet" href="../brand/tokens.css">
<link rel="stylesheet" href="../brand/base.css">
<link rel="stylesheet" href="../brand/components.css">
<link rel="stylesheet" href="people.css">
</head>
<body>
<!-- Generated by scripts/build_people.py from people/templates/namecards.html and people/people.json. -->
<div class="shell-head ts-container" style="padding-block:var(--space-6)">
  <div class="ts-heading">
    <span class="ts-caption">Name cards · 名片 · 90 × 54 mm</span>
    <h1>创始人名片</h1>
    <p class="ts-sub">全员共用一个正面，每人一个背面。印刷页为 96 × 60 mm（四边各 3 mm 出血）；打开参考线可看裁切线与 4 mm 安全区。</p>
    <label class="guides-toggle"><input type="checkbox" id="guides"> 显示参考线（裁切线 · 安全区）</label>
  </div>
</div>
<main class="cards">
  {{block:namecards}}
</main>
<p class="spec-note ts-small ts-muted ts-container" style="padding-block:var(--space-6)">联系方式为占位，待本人确认后填入 people/people.json 的 cards。官网 tiansight.apuch.cn；地址行待定，定后在 .contact 中加一行 A。字体须自托管思源宋体后再交付印刷，并将文字转曲线。</p>
</body>
</html>
