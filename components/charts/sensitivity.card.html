<script type="text/babel">
const NS = window.TIANSIGHTDesignSystem_703ad4;
const { Tornado, Lorenz, ScoreCompass } = NS;
const rnd = (seed => () => { seed = (seed * 9301 + 49297) % 233280; return seed / 233280; })(21);
const vals = Array.from({length: 120}, (_, i) => Math.round(50000 * Math.exp(-i / 14) + rnd() * 1500));

  </div>;
}

</script></body></html>
