<script type="text/babel">
const NS = window.TIANSIGHTDesignSystem_e0a760;
const { Scatter } = NS;
const rnd = (seed => () => { seed = (seed * 9301 + 49297) % 233280; return seed / 233280; })(11);
const names = ["清炒河虾仁","蟹粉豆腐","狮子头","烫干丝","春笋步鱼","文思豆腐","软兜长鱼","大煮干丝","盐水鸭","桂花糖藕","三套鸭","扬州炒饭"];
const skus = names.map((n,i) => ({ label: n, x: 40 + rnd()*260, y: 42 + rnd()*36, r: 8000 + rnd()*40000 }));
const big = Array.from({length: 12000}, () => { const x = rnd()*300; return { x, y: 45 + x*0.06 + (rnd()-0.5)*22, tone: rnd() > .92 ? "seal" : undefined }; });
function Demo(){
  return <div style={{display:'grid',gridTemplateColumns:'1fr 1fr',gap:28}}>

    <div><div className="lbl">Scatter · canvas, 12,000 rows</div>
      <Scatter height={220} caption="逐单 · 价格 × 毛利率" xLabel="实收单价" yLabel="毛利率 %" trend points={big} grade="E1"/></div>
  </div>;
}
ReactDOM.createRoot(document.getElementById('root')).render(<Demo/>);
</script></body></html>
