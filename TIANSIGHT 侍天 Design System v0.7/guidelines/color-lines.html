<!-- @dsCard group="Colors" viewport="700x150" subtitle="derived hairlines, card border, watermark, scrim" name="Lines and surfaces" -->
<!doctype html><html lang="zh-Hans"><head><meta charset="utf-8"><link rel="stylesheet" href="../styles.css">
<style>body{margin:0;padding:20px 24px;background:var(--surface)} .row{display:flex;gap:12px;flex-wrap:wrap;align-items:flex-start} .sw{display:flex;flex-direction:column;gap:6px;flex:1;min-width:90px} .sw i{display:block;height:44px;border-radius:var(--radius);border:1px solid var(--line)} .sw b{font-family:var(--font-mono);font-size:11px;font-weight:400;color:var(--text-muted)} .sw span{font-size:13px}</style></head><body><div class="row"><div class="sw"><i style="background:rgba(23,19,13,.18)"></i><span>hairline</span><b>--line rgba(23,19,13,.18)</b></div><div class="sw"><i style="background:rgba(23,19,13,.34)"></i><span>hairline-strong</span><b>--line-strong rgba(23,19,13,.34)</b></div><div class="sw"><i style="background:rgba(118,85,31,.34)"></i><span>card border</span><b>--card-border rgba(118,85,31,.34)</b></div><div class="sw"><i style="background:rgba(118,85,31,.10)"></i><span>compass watermark</span><b>--watermark rgba(118,85,31,.10)</b></div><div class="sw"><i style="background:rgba(23,19,13,.55)"></i><span>scrim</span><b>--scrim rgba(23,19,13,.55)</b></div></div></body></html>
