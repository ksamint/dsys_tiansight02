<!doctype html><html lang="zh-Hans"><head><meta charset="utf-8"><link rel="stylesheet" href="../../styles.css"><style>body{margin:0;padding:20px 24px;background:var(--surface)} .row{display:flex;gap:16px;flex-wrap:wrap;align-items:center}</style></head><body>
<div style="display:grid;grid-template-columns:1fr 1fr 1fr;gap:12px"><div class="ts-notice"><span class="ts-icon">·</span><div><b>数据窗口</b>最近 6 个月。</div></div><div class="ts-notice ts-notice-key"><span class="ts-icon">·</span><div><b>推荐</b>增利版 12 个月起签。</div></div><div class="ts-notice ts-notice-warn"><span class="ts-icon">·</span><div><b>样本不足</b>该维度不出结论。</div></div></div>
<div class="ts-progress" style="margin-top:16px"><div class="track"><div class="fill key" style="width:36%"></div></div><div class="meta"><span>数字员工 · 现役</span><span>10 / 28</span></div></div>
<details class="ts-disclosure" open style="margin-top:12px"><summary>这个判断的边界条件是？<span class="ts-icon">⌄</span></summary><div class="body" style="font-size:14px">客单价与客流不变。</div></details>
<div class="row" style="margin-top:16px;align-items:flex-start"><span class="ts-tip" data-tip="E2 · 平台结算单" tabindex="0" style="font-size:14px;border-bottom:1px dotted var(--gold)">证据等级（hover）</span><div class="ts-dialog" style="max-width:320px;padding:20px"><h3 style="font-size:18px;margin:0 0 8px">确认提交</h3><p style="font-size:14px;margin:0">提交后 7 日内交付诊断。</p><div class="actions" style="margin-top:14px"><button class="ts-button ts-button-secondary ts-button-sm">取消</button><button class="ts-button ts-button-sm">提交</button></div></div></div></body></html>
