<!doctype html><html lang="zh"><head><meta charset="utf-8"><link rel="stylesheet" href="../styles.css"><style>html,body{margin:0}body{background:var(--surface-page);padding:18px 20px;font-family:var(--font-body)}.k{font-family:var(--font-mono);font-size:10px;color:var(--text-muted)}.row{display:flex;gap:10px}.sw{flex:1;height:54px;display:flex;flex-direction:column;justify-content:flex-end;padding:6px 8px;border:1px solid var(--line-hairline)}.sw b{font-family:var(--font-mono);font-size:10px;font-weight:500}.sw i{font-family:var(--font-mono);font-size:9px;font-style:normal;opacity:.7}.ramp{display:flex;margin-top:12px;gap:0}.ramp span{flex:1;height:14px}</style></head><body>
<div class="row">
<div class="sw" style="background:var(--gold-hi);color:var(--ink-900)"><b>key 明金</b><i>#D4A862 · series 1</i></div>
<div class="sw" style="background:var(--charcoal);color:var(--parchment-100)"><b>charcoal 玄墨</b><i>#17130D · series 2</i></div>
<div class="sw" style="background:var(--seal);color:var(--parchment-50)"><b>seal 朱红</b><i>#8C3228 · series 3 / loss</i></div>
<div class="sw" style="background:var(--growth-500);color:var(--parchment-100)"><b>growth 增长</b><i>#4E6B3F · report only</i></div>
<div class="sw" style="background:var(--caution-500);color:var(--ink-900)"><b>caution 关注</b><i>#B98B2A · report only</i></div>
<div class="sw" style="background:var(--datum-500);color:var(--parchment-100)"><b>datum 中性</b><i>#6E6355</i></div>
</div>
<div class="ramp"><span style="background:#F3E7CF"></span><span style="background:#D4A862"></span><span style="background:#A8842F"></span><span style="background:#76551F"></span><span style="background:#3F2D0F"></span><span style="width:16px;flex:none;background:transparent"></span><span style="background:#8C3228"></span><span style="background:#F4F0E7"></span><span style="background:#4E6B3F"></span></div>
<div class="k" style="margin-top:8px">SEQUENTIAL — single-hue gold ramp for quantity · DIVERGING — 朱红 ↔ 增长 around zero. Never a rainbow; never colour for precise reading.</div>
</body></html>
