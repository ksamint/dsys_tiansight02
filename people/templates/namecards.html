<!-- Generated by scripts/build_people.py from people/templates/namecards.html and people/people.json. -->
<div class="shell-head ts-container" style="padding-block:var(--space-6)">
  <div class="ts-heading">
    <span class="ts-caption">Name cards · 名片 · 90 × 54 mm</span>
    <h1>创始人名片</h1>
    <p class="ts-sub">每人三面：正面、肖像面、背面。打印或另存为 PDF 时每面一页，无出血；印刷版请在 people.css 的 @page 中加 3mm 出血。</p>
  </div>
</div>
<main class="cards">
  {{block:namecards}}
</main>
<p class="spec-note ts-small ts-muted ts-container" style="padding-block:var(--space-6)">联系方式为占位。字体须自托管思源宋体后再交付印刷，并将文字转曲线。</p>
