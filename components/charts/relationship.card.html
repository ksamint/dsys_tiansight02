<!-- @dsCard group="Charts" viewport="700x300" name="Scatter · quadrants · canvas" subtitle="关系 — two quantities on position; 10k points paint to canvas in one frame" -->
<!doctype html><html lang="zh"><head><meta charset="utf-8"><link rel="stylesheet" href="../../styles.css">
<script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
<script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
<script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>
<script src="https://unpkg.com/d3@7.9.0/dist/d3.min.js"></script>
<script src="../../_ds_bundle.js"></script>
<style>html,body{margin:0}body{background:var(--surface-page);padding:20px;font-family:var(--font-body)}.lbl{font-size:11px;letter-spacing:.16em;text-transform:uppercase;color:var(--text-muted);margin-bottom:10px}</style></head><body><div id="root"></div>
<script type="text/babel">
const NS = window.TIANSIGHTDesignSystem_703ad4;
const { Scatter } = NS;
const rnd = (seed => () => { seed = (seed * 9301 + 49297) % 233280; return seed / 233280; })(11);
const names = ["清炒河虾仁","蟹粉豆腐","狮子头","烫干丝","春笋步鱼","文思豆腐","软兜长鱼","大煮干丝","盐水鸭","桂花糖藕","三套鸭","扬州炒饭"];
const skus = names.map((n,i) => ({ label: n, x: 40 + rnd()*260, y: 42 + rnd()*36, r: 8000 + rnd()*40000 }));
const big = Array.from({length: 12000}, () => { const x = rnd()*300; return { x, y: 45 + x*0.06 + (rnd()-0.5)*22, tone: rnd() > .92 ? "seal" : undefined }; });
function Demo(){
  return <div style={{display:'grid',gridTemplateColumns:'1fr 1fr',gap:28}}>
    <div><div className="lbl">Scatter · SVG, 12 SKU, quadrants</div>
      <Scatter height={220} caption="千单点击 × 毛利率" xLabel="千单点击" yLabel="毛利率 %" quadrants quadrantLabels={["高利低点","明星","问题","高点低利"]}
        emphasis={["清炒河虾仁","春笋步鱼"]} points={skus} grade="E1" scope="03–08 月，堂食"/></div>
    <div><div className="lbl">Scatter · canvas, 12,000 rows</div>
      <Scatter height={220} caption="逐单 · 价格 × 毛利率" xLabel="实收单价" yLabel="毛利率 %" trend points={big} grade="E1"/></div>
  </div>;
}
ReactDOM.createRoot(document.getElementById('root')).render(<Demo/>);
</script></body></html>
