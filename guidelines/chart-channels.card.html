<!-- @dsCard group="Charts" viewport="700x170" name="Encoding channels" subtitle="Cleveland–McGill precision — the important number goes on position or length" -->
<!doctype html><html lang="zh"><head><meta charset="utf-8"><link rel="stylesheet" href="../styles.css"><style>html,body{margin:0}body{background:var(--surface-page);padding:18px 20px;font-family:var(--font-body)}.k{font-family:var(--font-mono);font-size:10px;color:var(--text-muted)}.r{display:flex;align-items:center;gap:14px;border-bottom:1px solid var(--line-hairline);padding:5px 0}.r em{font-family:var(--font-mono);font-style:normal;font-size:10px;color:var(--gold-deep);width:22px}.r b{font-size:12.5px;font-weight:500;color:var(--text-display);width:150px}.r i{font-style:normal;font-size:11px;color:var(--text-muted);flex:1}.bar{height:8px;background:var(--gold-hi)}</style></head><body>
<div class="r"><em>1</em><b>共同尺度上的位置</b><div class="bar" style="width:220px"></div><i>散点 x/y · 对齐的条形 — 最重要的定量变量</i></div>
<div class="r"><em>3</em><b>长度</b><div class="bar" style="width:170px"></div><i>条形、柱状；基线必须从 0 起</i></div>
<div class="r"><em>4</em><b>角度 / 斜率</b><div class="bar" style="width:110px"></div><i>斜率图；饼图超过 5 项必输</i></div>
<div class="r"><em>5</em><b>面积</b><div class="bar" style="width:70px;background:var(--gold-400)"></div><i>气泡、Treemap — 判读误差 2–3 倍，标出数值</i></div>
<div class="r"><em>7</em><b>明度 / 饱和度</b><div class="bar" style="width:40px;background:var(--gold)"></div><i>热力图强弱 — 只分定序，不读精确值</i></div>
<div class="r"><em>8</em><b>色相</b><div class="bar" style="width:22px;background:var(--seal)"></div><i>只分类，不计量。体积 / 3D：不用</i></div>
</body></html>
