  fm:[[4,0],[5,0],[6,0],[7,0],[8,0],[9,2],[10,3],[11,1],[12,6],[13,4],[0,7],[1,4],[2,8],[3,5],[14,9],[15,8],[16,7],[11,10],[9,10]],
  mv:[[0,0],[1,1],[2,9],[3,0],[4,1],[4,2],[5,4],[5,5],[6,5],[7,6],[8,7],[9,8],[10,10]]
};
function drawMap(){
  const W=980,rowH=19,H=Math.max(MAPDATA.fields.length*rowH+70,MAPDATA.metrics.length*26+70);
  const {g,iw,ih}=canvas("#c-map",W,H,{t:30,r:10,b:16,l:10});
  const colX=[0,iw*0.27,iw*0.545,iw*0.83],colW=[iw*0.22,iw*0.21,iw*0.245,iw*0.17];
  const place=(arr,ci,h)=>{const step=(ih-10)/arr.length;return arr.map((d,i)=>({d,x:colX[ci],w:colW[ci],y:8+i*step,h:Math.min(step-4,h)}));};
  const A=place(MAPDATA.sheets,0,30),B=place(MAPDATA.fields,1,rowH-3),
        Cc=place(MAPDATA.metrics,2,24),E=place(MAPDATA.views,3,20);
  const curve=(a,b)=>{const x0=a.x+a.w,y0=a.y+a.h/2,x1=b.x,y1=b.y+b.h/2,cx=(x0+x1)/2;
    return `M${x0},${y0}C${cx},${y0} ${cx},${y1} ${x1},${y1}`;};
  const L=g.append("g");
  MAPDATA.links.forEach(([si,fs])=>fs.forEach(fi=>L.append("path").attr("d",curve(A[si],B[fi]))
    .attr("fill","none").attr("stroke",si===0?C.c1:C.rule).attr("stroke-width",si===0?.9:.7).attr("opacity",si===0?.4:.55)));
  MAPDATA.fm.forEach(([fi,mi])=>L.append("path").attr("d",curve(B[fi],Cc[mi])).attr("fill","none")
    .attr("stroke",C.c4).attr("stroke-width",.8).attr("opacity",.35));
  MAPDATA.mv.forEach(([mi,vi])=>L.append("path").attr("d",curve(Cc[mi],E[vi])).attr("fill","none")
    .attr("stroke",C.c2).attr("stroke-width",.9).attr("opacity",.45));
  const box=(arr,fill,txt,sub)=>{const gg=g.selectAll(null).data(arr).join("g");
    gg.append("rect").attr("x",d=>d.x).attr("y",d=>d.y).attr("width",d=>d.w).attr("height",d=>d.h)
      .attr("fill",fill).attr("stroke",C.rule).attr("rx",2);
    gg.append("text").attr("x",d=>d.x+7).attr("y",d=>d.y+(sub?13:d.h/2+4)).style("font-size","11px").attr("fill",C.ink).text(txt);
    if(sub)gg.append("text").attr("x",d=>d.x+7).attr("y",d=>d.y+25).style("font-size","10px").attr("fill",C.ink3).text(sub);
    return gg;};
  box(A,C.c1w,d=>d.d[0],d=>d.d[1]);
  box(B,C.panel,d=>d.d[0]);
  box(Cc,C.panel2,d=>d.d[0],d=>d.d[1]);
  box(E,C.c2w,d=>d.d);
  ["① 原始工作表","② 字段（17 列）","③ 派生指标","④ 看板"].forEach((t,i)=>
    g.append("text").attr("x",colX[i]).attr("y",-13).style("font-size","11px").attr("fill",C.ink3).text(t));
  [[C.c1,"明细表 → 字段"],[C.rule,"计划表 → 属性字段"],[C.c4,"字段 → 指标"],[C.c2,"指标 → 看板"]].forEach((d,i)=>
    g.append("g").attr("transform",`translate(${i*150},${ih+2})`).call(gg=>{
      gg.append("line").attr("x1",0).attr("x2",16).attr("y1",-4).attr("y2",-4).attr("stroke",d[0]).attr("stroke-width",1.4);
      gg.append("text").attr("x",21).attr("y",-1).style("font-size","10px").attr("fill",C.ink3).text(d[1]);}));
  d3.select("#f-map").html(tagLine([TAG.m,
    "四张分区计划表与汇总表的 16 组小计已逐项与明细表核对，差值全部为 0",
    "面团、计划售价、上架备注三个属性只存在于计划表，已按（区域, 单品名）左连接回明细"]));
}
function drawDict(){
  const rows=[["区域","所在区域","GZ/SZ/SH/BJ 四区，对外呈现为华南·广州区等"],
    ["门店","门店编号","默认脱敏为「区域-序号」，可一键切回原始编号"],
    ["日期（日）","营业日","2025-04-01 至 04-06，其中 4/4–4/6 为清明假期"],
    ["分类","供货来源","厨房烘焙＝店内现烤；美心厂＝中央工厂；采购/FMCG＝外购；杂项＝卡券"],
    ["类别","商品大类","个包、法包、家庭装面包、三文治、鲜饼类等 13 类"],
    ["早上库存","开店时的货","昨日结转，短保商品应接近 0"],["收货","当天出炉或到货","现烤即当日排产量"],
    ["交流","门店之间调拨","有正有负，全网合计接近 0"],["调整","盘点差异修正",""],
    ["客退货","顾客退货","不进入平衡式，原表已在销售数内轧差"],
    ["退厂","当天报废","对客户口径写作「当日报废」，不写「退厂」"],
    ["日结库存","打烊剩余","短保商品的剩余会在次日转为报废"],
    ["销售","卖出件数",""],["销售价","当日售价","同一单品跨区可能不同价"],["销售额","销售 × 售价","已 100% 复核"]];
  d3.select("#c-dict").html(`<table><thead><tr><th>原表字段</th><th style="text-align:left">对客户的说法</th><th style="text-align:left">口径说明</th></tr></thead><tbody>`+
    rows.map(r=>`<tr><td>${r[0]}</td><td style="text-align:left">${r[1]}</td><td style="text-align:left;white-space:normal;color:var(--ink2)">${r[2]}</td></tr>`).join("")+`</tbody></table>`);
}
</script>

<script>
/* ==================== 经营总览 ==================== */
function drawKPI(){
  const v=view(),a=agg(v),days=a.days||1,st=a.stores||1;
  const bake=agg(v.filter(d=>D.chans[d.ch]==="厨房烘焙"));
  const oth=agg(v.filter(d=>D.chans[d.ch]!=="厨房烘焙"));
  const K=[
    {k:"销售额（含假期）",raw:a.rev,fmt:F.money,u:"元",d:`日均 ${F.yuan(a.rev/days)} · 店均日 ${F.yuan(a.rev/days/st)}`,acc:1,drill:{}},
    {k:"卖出件数",raw:a.sales,fmt:F.n0,u:"件",d:`店均日 ${F.n1(a.sales/days/st)} 件 · 售罄率 ${F.p1(sr(a))}`,acc:1,drill:{}},
    {k:"当日报废件率",raw:wr(a)*100,fmt:v2=>F.n1(v2)+"%",u:"",d:`行业健康区间 5–10%，当前${wr(a)>0.10?"高于上沿":wr(a)<0.05?"低于下沿":"在区间内"}`,acc:3,drill:{},pred:d=>d.w>0},
    {k:"报废金额（按售价）",raw:a.wval,fmt:F.money,u:"元",d:`占销售额 ${F.p1(a.rev?a.wval/a.rev:0)}`,acc:3,drill:{},pred:d=>d.w>0},
    {k:"现烤线报废件率",raw:wr(bake)*100,fmt:v2=>F.n1(v2)+"%",u:"",d:`工厂与外购线合计仅 ${F.p1(wr(oth))}`,acc:2,
     drill:{chans:D.chans.map((c,i)=>c==="厨房烘焙"?i:-1).filter(i=>i>=0)}},
    {k:"在售单品数",raw:a.skus,fmt:F.n0,u:"个",d:`${a.stores} 家店 · ${days} 天 · ${F.n(a.n)} 条记录`,acc:4,drill:{}}];
  const sel=d3.select("#c-kpi").selectAll("div.kpi").data(K,d=>d.k);
  sel.join(en=>{const n=en.append("div").attr("tabindex",0);
      n.append("div").attr("class","k");n.append("div").attr("class","v");n.append("div").attr("class","d");return n;})
    .attr("class",d=>"kpi acc-"+d.acc)
    .each(function(d){this.__d=d;})
    .call(s=>{s.select(".k").text(d=>d.k);s.select(".d").text(d=>d.d);
      s.select(".v").each(function(d){
        const prev=this.__v,cur=d.raw;this.__v=cur;
        const paint=t=>{this.innerHTML=d.fmt(t)+(d.u?`<small>${d.u}</small>`:"");};
        if(!MOTION||prev===undefined||!isFinite(prev)){paint(cur);return;}
        const i=d3.interpolateNumber(prev,cur);
        d3.select(this).transition(T(620)).tween("v",()=>t=>paint(i(t)));});})
    .on("click",(e,d)=>openDrill({kick:"指标穿透",title:d.k,keys:d.drill,pred:d.pred,note:"构成这个指标的全部原始记录"}))
    .on("keydown",(e,d)=>{if(e.key==="Enter")openDrill({kick:"指标穿透",title:d.k,keys:d.drill,pred:d.pred});});
}
function drawTrend(){
  const v=view(),by=d3.rollup(v,g=>agg(g),d=>d.d);
  const arr=d3.range(D.days).filter(i=>by.has(i)).map(i=>({i,...by.get(i)}));
  if(!arr.length){blank("#c-trend");return;}
  const W=600,H=286,st=stage("#c-trend",W,H,{t:20,r:48,b:74,l:62}),{g,iw,ih}=st;
  const x=d3.scaleBand().domain(arr.map(d=>d.i)).range([0,iw]).padding(.3);
  const y=d3.scaleLinear().domain([0,d3.max(arr,d=>d.rev)*1.16]).nice().range([ih,0]);
  const y2=d3.scaleLinear().domain([0,Math.max(d3.max(arr,d=>wr(d))*1.5,0.13)]).nice().range([ih,0]);
  /* 假期底纹 */
  st.layer("bg").selectAll("rect.h").data(arr.filter(d=>HOLIDAY.includes(d.i)),d=>d.i)
    .join(en=>en.append("rect").attr("class","h").attr("fill",C.c2w).attr("opacity",0),up=>up,
      ex=>ex.transition(T(240)).attr("opacity",0).remove())
    .transition(T()).attr("x",d=>x(d.i)-x.step()*.15).attr("y",0).attr("width",x.step()).attr("height",ih).attr("opacity",1);
  gridG(st,y);
  axisG(st,"xax",`translate(0,${ih})`,d3.axisBottom(x).tickFormat(d=>dlabel(d)).tickSize(4));
  axisG(st,"yax",null,d3.axisLeft(y).ticks(5).tickSize(4).tickFormat(F.money));
  axisG(st,"y2ax",`translate(${iw},0)`,d3.axisRight(y2).ticks(4).tickFormat(F.p0));
  st.wipe("ref");
  refBand(st.layer("ref"),iw,y2(0.05),y2(0.10),C.c2,"");
  refLine(st.layer("ref"),iw,y2(0.10),"行业均值 10%",C.c2d,{labelX:iw-4,dy:-3});
  refLine(st.layer("ref"),iw,y2(0.05),"健康区间下沿 5%",C.c2d,{labelX:iw-4,dy:11});
  st.layer("ref").append("text").attr("class","axt").attr("x",0).attr("y",-8).text("销售额（元）");
  st.layer("ref").append("text").attr("class","axt").attr("x",iw).attr("y",-8).attr("text-anchor","end").text("报废件率");
  /* 柱：keyed join 补间 */
  const bars=st.layer("mark").selectAll("rect.b").data(arr,d=>d.i).join(
    en=>en.append("rect").attr("class","b m mark").attr("y",ih).attr("height",0).attr("rx",2).attr("fill",SEM.sales).attr("opacity",.9),
    up=>up,ex=>ex.transition(T(280)).attr("y",ih).attr("height",0).remove());
  bars.attr("data-hl",d=>"d"+d.i)
    .call(s=>hov(s,d=>tipHTML(dlabel(d.i)+(HOLIDAY.includes(d.i)?"（清明假期）":""),
      [["销售额",F.yuan(d.rev)],["卖出",F.n(d.sales)+" 件"],["报废",F.n(d.waste)+" 件"],
       ["报废率",F.p1(wr(d))],["售罄率",F.p1(sr(d))]])))
    .on("mouseenter.hl",(e,d)=>setHL("d"+d.i)).on("mouseleave.hl",()=>setHL(null));
  drillable(bars,d=>({kick:"按日期下钻",title:dlabel(d.i)+" 全部记录",keys:{days:[d.i]}}));
  bars.transition(T()).delay((d,i)=>stagger(i,26))
    .attr("x",d=>x(d.i)).attr("width",x.bandwidth()).attr("y",d=>y(d.rev)).attr("height",d=>ih-y(d.rev));
  /* 折线与点 */
  const line=d3.line().x(d=>x(d.i)+x.bandwidth()/2).y(d=>y2(wr(d)));
  const path=st.layer("mark").selectAll("path.wl").data([arr]).join(
    en=>en.append("path").attr("class","wl").attr("fill","none").attr("stroke",SEM.waste).attr("stroke-width",2)
      .attr("stroke-linecap","round").attr("d",line));
  if(MOTION){const n=path.node();const prev=n.__d0;const nd=line(arr);
    if(prev&&prev.split(",").length===nd.split(",").length)path.transition(T()).attr("d",nd);else path.attr("d",nd);n.__d0=nd;}
  else path.attr("d",line(arr));
  st.layer("mark").selectAll("circle.p").data(arr,d=>d.i).join(
    en=>en.append("circle").attr("class","p").attr("r",0).attr("fill",SEM.waste).attr("stroke","#fff").attr("stroke-width",1)
      .attr("cx",d=>x(d.i)+x.bandwidth()/2).attr("cy",d=>y2(wr(d))),
    up=>up,ex=>ex.transition(T(240)).attr("r",0).remove())
    .transition(T()).attr("cx",d=>x(d.i)+x.bandwidth()/2).attr("cy",d=>y2(wr(d))).attr("r",3.4);
  /* 数值标签 */
  const lab=st.layer("lab");
  lab.selectAll("text.v1").data(arr,d=>d.i).join(
    en=>en.append("text").attr("class","v1 vlab").attr("text-anchor","middle").attr("fill",C.c1d).attr("opacity",0),
    up=>up,ex=>ex.remove())
    .text(d=>F.money(d.rev)).transition(T()).attr("x",d=>x(d.i)+x.bandwidth()/2).attr("y",d=>y(d.rev)-6).attr("opacity",1);
  lab.selectAll("text.v2").data(arr,d=>d.i).join(
    en=>en.append("text").attr("class","v2 vlab").attr("text-anchor","middle").attr("fill",C.c3d).attr("opacity",0),
    up=>up,ex=>ex.remove())
    .text(d=>F.p1(wr(d))).transition(T()).attr("x",d=>x(d.i)+x.bandwidth()/2).attr("y",d=>y2(wr(d))-9).attr("opacity",1);
  /* 日期滑选轨：拖动即筛选 */
  buildDateRail(st,x,ih+40);
  legend("#l-trend",[{c:SEM.sales,t:"当日销售额（左轴）"},{c:SEM.waste,shape:"line",t:"当日报废件率（右轴）"},
    {c:C.c2l,t:"清明假期"},{c:C.c2d,shape:"dash",t:"行业基准 5–10%"}],"点击柱子下钻，或在下方轨道上拖选日期区间");
  const hol=arr.filter(d=>HOLIDAY.includes(d.i)),wk=arr.filter(d=>!HOLIDAY.includes(d.i)),tot=d3.sum(arr,d=>d.rev);
  d3.select("#f-trend").html(tagLine([TAG.m,TAG.e,
    `假期 ${hol.length} 天销售额 ${F.yuan(d3.sum(hol,d=>d.rev))}，占窗口 <b>${F.p1(d3.sum(hol,d=>d.rev)/Math.max(tot,1))}</b>`,
    hol.length&&wk.length?`假期日均是平日的 <b>${(d3.sum(hol,d=>d.rev)/hol.length/(d3.sum(wk,d=>d.rev)/wk.length)).toFixed(2)} 倍</b>`:null,
    `外推月度请用「平日日均 × 平日天数 + 假日日均 × 假日天数」，直接乘 30 会高估`].filter(Boolean)));
}
/* 日期轨：brushX 拖选，松手即写回全局筛选 */
function buildDateRail(st,x,railY){
  const g=st.layer("fg");
  let rail=g.select("g.brushrail");
  if(rail.empty()){rail=g.append("g").attr("class","brushrail");
    rail.append("rect").attr("class","track").attr("rx",2);
    rail.append("g").attr("class","bx");
    rail.append("text").attr("class","railhint");}
  rail.attr("transform",`translate(0,${railY})`);
  rail.select("rect.track").attr("width",st.iw).attr("height",16);
  rail.select("text.railhint").attr("x",0).attr("y",29)
    .text(S.days.size?`已选 ${S.days.size} 天，双击轨道清除`:"在轨道上拖动可框选日期区间");
  const days=x.domain();
  const brush=d3.brushX().extent([[0,0],[st.iw,16]])
    .on("end",ev=>{
      if(!ev.sourceEvent)return;
      if(!ev.selection){if(S.days.size){ANIM_NEXT=true;S.days.clear();render();}return;}
      const [a,b]=ev.selection;
      const picked=days.filter(d=>{const c=x(d)+x.bandwidth()/2;return c>=a-2&&c<=b+2;});
      ANIM_NEXT=true;S.days=new Set(picked);render();});
  rail.select("g.bx").call(brush);
  if(S.days.size){const ds=days.filter(d=>S.days.has(d));
    if(ds.length)rail.select("g.bx").call(brush.move,[x(d3.min(ds))-2,x(d3.max(ds))+x.bandwidth()+2]);}
  else rail.select("g.bx").call(brush.move,null);
}
function drawRegion(){
  const v=view(),by=d3.rollup(v,g=>({...agg(g),st:new Set(g.map(d=>d.s)).size,dy:new Set(g.map(d=>d.d)).size}),d=>d.r);
  const arr=Array.from(by,([r,a])=>({r,...a,per:a.rev/Math.max(a.st,1)/Math.max(a.dy,1)})).sort((a,b)=>b.per-a.per);
  if(!arr.length){blank("#c-region");return;}
  const W=380,H=286,st=stage("#c-region",W,H,{t:16,r:96,b:70,l:84}),{iw,ih}=st;
  const y=d3.scaleBand().domain(arr.map(d=>d.r)).range([0,ih]).padding(.32);
  const x=d3.scaleLinear().domain([0,d3.max(arr,d=>d.per)*1.02]).range([0,iw]);
  axisG(st,"yax",null,d3.axisLeft(y).tickSize(0).tickFormat(r=>regName(r)));
  axisG(st,"xax",`translate(0,${ih})`,d3.axisBottom(x).ticks(4).tickFormat(F.money));
  st.wipe("ref");
  st.layer("ref").append("text").attr("class","axt").attr("x",iw).attr("y",ih+34).attr("text-anchor","end").text("店均日销售额（元）");
  const all=agg(v),allPer=all.rev/Math.max(all.stores,1)/Math.max(all.days,1);
  st.layer("ref").append("line").attr("class","refl").attr("x1",x(allPer)).attr("x2",x(allPer)).attr("y1",-4).attr("y2",ih).attr("stroke",C.ink3);
  st.layer("ref").append("text").attr("class","reft").attr("x",x(allPer)).attr("y",-7).attr("text-anchor","middle")
    .attr("fill",C.ink3).text("全网 "+F.money(allPer));
  const bars=st.layer("mark").selectAll("rect.b").data(arr,d=>d.r).join(
    en=>en.append("rect").attr("class","b m mark").attr("width",0).attr("rx",2).attr("opacity",.9)
      .attr("y",d=>y(d.r)).attr("height",y.bandwidth()),
    up=>up,ex=>ex.transition(T(260)).attr("width",0).remove());
  bars.attr("fill",d=>regColor(d.r)).attr("data-hl",d=>"r"+d.r)
    .call(s=>hov(s,d=>tipHTML(regName(d.r),[["门店数",d.st+" 家"],["店均日销售额",F.yuan(d.per)],
      ["报废率",F.p1(wr(d))],["售罄率",F.p1(sr(d))],["在售单品",d.skus+" 个"]])))
    .on("mouseenter.hl",(e,d)=>setHL("r"+d.r)).on("mouseleave.hl",()=>setHL(null));
  drillable(bars,d=>({kick:"按区域下钻",title:regName(d.r),keys:{regions:[d.r]}}));
  bars.transition(T()).delay((d,i)=>stagger(i,40)).attr("y",d=>y(d.r)).attr("height",y.bandwidth()).attr("width",d=>x(d.per));
  const lab=st.layer("lab");
  lab.selectAll("text.v").data(arr,d=>d.r).join(en=>en.append("text").attr("class","v").style("font-size","11px").attr("fill",C.ink),
    up=>up,ex=>ex.remove()).text(d=>F.yuan(d.per))
    .transition(T()).attr("x",d=>x(d.per)+6).attr("y",d=>y(d.r)+y.bandwidth()/2-1);
  lab.selectAll("text.v2").data(arr,d=>d.r).join(en=>en.append("text").attr("class","v2").style("font-size","10px").attr("fill",C.ink3),
    up=>up,ex=>ex.remove()).text(d=>d.st+" 店 · 报废 "+F.p1(wr(d)))
    .transition(T()).attr("x",d=>x(d.per)+6).attr("y",d=>y(d.r)+y.bandwidth()/2+11);
  legend("#l-region",arr.map(d=>({c:regColor(d.r),t:regName(d.r),hl:"r"+d.r})).concat([{c:C.ink3,shape:"dash",t:"全网店均线"}]),
    "点击色条下钻到该区域");
  if(arr.length>1) d3.select("#f-region").html(tagLine([TAG.m,
    `店均日销售额 = 区域销售额 ÷ 门店数 ÷ 天数`,

function drawMekko(){

    .transition(T()).attr("x",d=>d.x+6).attr("y",d=>d.y+d.h/2+4).attr("opacity",1);

      n.append("text").attr("class","a").attr("text-anchor","middle").style("font-size","11px").attr("fill",C.ink2).attr("y",ih+16);
      n.append("text").attr("class","b").attr("text-anchor","middle").style("font-size","10.5px").attr("fill",C.ink3).attr("y",ih+30);
      return n;},up=>up,ex=>ex.remove());
  hd.select("text.n").text(function(d){

    "点击任一色块下钻；把鼠标放到图注上可高亮同一品类");
  const topc=Array.from(d3.rollup(v,g2=>sum(g2,d=>d.rev),d=>d.c)).sort((a,b)=>b[1]-a[1])[0];
  const shares=regs.map(R=>{const byc=d3.rollup(R.rows,gg=>sum(gg,d=>d.rev),d=>d.c);return (byc.get(topc[0])||0)/R.rev;});

function storeStats(){

    const a=agg(g),dy=new Set(g.map(d=>d.d)).size||1;

}

function corr(a,b){const ma=d3.mean(a),mb=d3.mean(b);
  const num=d3.sum(a.map((v,i)=>(v-ma)*(b[i]-mb)));
  const den=Math.sqrt(d3.sum(a.map(v=>(v-ma)**2))*d3.sum(b.map(v=>(v-mb)**2)));
  return den?num/den:0;}

      ["报废金额",F.yuan(d.d.wval)],["报废额 ÷ 销售额",F.p1(d.d.rev?d.d.wval/d.d.rev:0)],
      ["报废件率",F.p1(d.d.avail?d.d.waste/d.d.avail:0)]])))
    .on("mouseenter.hl",(e,d)=>setHL("c"+d.c)).on("mouseleave.hl",()=>setHL(null));
  drillable(rects,d=>({kick:"按品类下钻",title:D.cats[d.c],keys:{cats:[d.c]}}));
  rects.transition(T()).delay((d,i)=>stagger(i,10))
    .attr("x",d=>d.x0).attr("y",d=>d.y0).attr("width",d=>d.x1-d.x0).attr("height",d=>d.y1-d.y0)
    .attr("fill",d=>col(d.d.rev?d.d.wval/d.d.rev:0)).attr("opacity",1);
  const dark=d=>d.d.wval/d.d.rev>0.10;
  const tg=st.layer("lab").selectAll("g.tl").data(leaves,d=>d.c).join(
    en=>{const n=en.append("g").attr("class","tl").attr("pointer-events","none");
      n.append("text").attr("class","a").style("font-size","12px").attr("x",6).attr("y",16);
      n.append("text").attr("class","b").style("font-size","10.5px").attr("x",6).attr("y",31);
      n.append("text").attr("class","c").style("font-size","10px").attr("x",6).attr("y",45);
      return n;},up=>up,ex=>ex.remove());
  tg.select("text.a").attr("fill",d=>dark(d)?"#fff":C.ink).text(d=>(d.x1-d.x0>62&&d.y1-d.y0>26)?D.cats[d.c]:"");
  tg.select("text.b").attr("fill",d=>dark(d)?C.c1w:C.ink3).text(d=>(d.x1-d.x0>62&&d.y1-d.y0>40)?F.yuan(d.d.rev):"");
  tg.select("text.c").attr("fill",d=>dark(d)?C.c1w:C.ink3)
    .text(d=>(d.x1-d.x0>72&&d.y1-d.y0>56)?"报废占比 "+F.p1(d.d.rev?d.d.wval/d.d.rev:0):"");
  tg.transition(T()).attr("transform",d=>`translate(${d.x0},${d.y0})`);
  legend("#l-treemap",[{ramp:[C.c1w,C.c3],t:"报废额 ÷ 销售额",lo:"0%",hi:"22%+"},{c:C.ink4,t:"面积 ∝ 销售额"}],
    "点击色块下钻到该品类");
  const bake=v.filter(d=>D.chans[d.ch]==="厨房烘焙"),ab=agg(bake),av=agg(v);
  d3.select("#f-treemap").html(tagLine([TAG.m,"面积 = 销售额；色深 = 报废额 ÷ 该品类销售额（0 至 22%）",
    `现烤线占销售额 <b>${F.p1(av.rev?ab.rev/av.rev:0)}</b>，占报废额 <b>${F.p1(av.wval?ab.wval/av.wval:0)}</b>`]));
}
function drawChannel(){
  const v=view();
  const arr=Array.from(d3.rollup(v,g=>({rev:sum(g,d=>d.rev),wval:sum(g,d=>d.wval),waste:sum(g,d=>d.w),avail:sum(g,d=>d.avail)}),d=>d.ch),
    ([ch,o])=>({ch,...o,wrr:o.avail?o.waste/o.avail:0})).sort((a,b)=>b.rev-a.rev);
  if(!arr.length){blank("#c-channel");return;}
  const W=470,H=310,st=stage("#c-channel",W,H,{t:16,r:76,b:50,l:88}),{iw,ih}=st;
  const y=d3.scaleBand().domain(arr.map(d=>d.ch)).range([0,ih]).padding(.32);
  const x=d3.scaleLinear().domain([0,d3.max(arr,d=>d.rev)||1]).range([0,iw]);
  const CH={"厨房烘焙":"店内现烤","美心厂":"中央工厂配送","采购":"外部采购","FMCG":"包装快消","杂项":"卡券等"};
  axisG(st,"yax",null,d3.axisLeft(y).tickSize(0).tickFormat(c=>CH[D.chans[c]]||D.chans[c]));
  axisG(st,"xax",`translate(0,${ih})`,d3.axisBottom(x).ticks(4).tickFormat(F.money));
  st.wipe("ref");
  st.layer("ref").append("text").attr("class","axt").attr("x",iw).attr("y",ih+34).attr("text-anchor","end").text("销售额（元）");
  const col=t=>d3.interpolateRgb(C.c1m,C.c3)(Math.min(t/0.12,1));
  const bars=st.layer("mark").selectAll("rect.b").data(arr,d=>d.ch).join(
    en=>en.append("rect").attr("class","b m mark").attr("width",0).attr("rx",2).attr("y",d=>y(d.ch)).attr("height",y.bandwidth()),
    up=>up,ex=>ex.transition(T(240)).attr("width",0).remove());
  bars.attr("fill",d=>col(d.wrr)).attr("data-hl",d=>"ch"+d.ch)
    .call(s=>hov(s,d=>tipHTML(CH[D.chans[d.ch]]||D.chans[d.ch],[["销售额",F.yuan(d.rev)],
      ["报废件率",F.p1(d.wrr)],["报废金额",F.yuan(d.wval)],["可动用件数",F.n(d.avail)]])));
  drillable(bars,d=>({kick:"按供货渠道下钻",title:CH[D.chans[d.ch]]||D.chans[d.ch],keys:{chans:[d.ch]}}));
  bars.transition(T()).delay((d,i)=>stagger(i,40)).attr("y",d=>y(d.ch)).attr("height",y.bandwidth()).attr("width",d=>x(d.rev));
  st.layer("lab").selectAll("text.v").data(arr,d=>d.ch).join(
    en=>en.append("text").attr("class","v").style("font-size","11px").attr("fill",C.ink2).attr("pointer-events","none"),
    up=>up,ex=>ex.remove()).text(d=>"报废 "+F.p1(d.wrr))
    .transition(T()).attr("x",d=>x(d.rev)+6).attr("y",d=>y(d.ch)+y.bandwidth()/2+4);
  legend("#l-channel",[{ramp:[C.c1m,C.c3],t:"柱色 = 报废件率",lo:"0%",hi:"12%+"}],"点击柱子下钻到该渠道");
  const bk=arr.find(d=>D.chans[d.ch]==="厨房烘焙"),ot=arr.filter(d=>D.chans[d.ch]!=="厨房烘焙");
  const otr=d3.sum(ot,d=>d.waste)/Math.max(d3.sum(ot,d=>d.avail),1);
  d3.select("#f-channel").html(tagLine([TAG.m,"报废件率 = 报废件数 ÷ 可动用件数",
    bk?`现烤线报废率 <b>${F.p1(bk.wrr)}</b>，其余渠道合计 <b>${F.p1(otr)}</b>，减损动作应全部投向排产与订货`:null].filter(Boolean)));
}
</script>

<script>
/* ============================ 7. 单品聚合 ============================ */
function skuStats(rows){
  if(!rows&&_skuCache)return _skuCache;
  const _r=skuStatsRaw(rows);if(!rows)_skuCache=_r;return _r;
}
function skuStatsRaw(rows){
  rows=rows||view();
  const nd=new Set(rows.map(d=>d.d)).size||1, ns=new Set(rows.map(d=>d.s)).size||1;
  const arr=Array.from(d3.group(rows,d=>d.k),([k,g])=>{
    const a=agg(g),stores=new Set(g.map(d=>d.s)).size,dys=new Set(g.map(d=>d.d)).size||1;
    const price=a.sales?a.rev/a.sales:D.sku[k].p;
    const cost=price*costRate(k), cm=price-cost;
    return {k,name:D.sku[k].n,cat:D.sku[k].c,dough:D.sku[k].d,ch:D.sku[k].ch,
      qty:a.sales,rev:a.rev,waste:a.waste,wval:a.wval,avail:a.avail,close:a.close,
      wrr:wr(a),srr:sr(a),stores,dys,price,cm,cmTot:cm*a.sales,
      perStoreDay:a.sales/Math.max(stores*dys,1), rows:g.length};}).filter(d=>d.avail>0);
  return arr;
}
/* ---- 帕累托 ---- */
function drawPareto(){
  const arr=skuStats().sort((a,b)=>b.rev-a.rev),tot=d3.sum(arr,d=>d.rev)||1;
  let c=0;arr.forEach(d=>{c+=d.rev;d.cum=c/tot;});
  const top=arr.slice(0,60);
  const rot=42,labPx=62;                      // 旋转角与标签最大像素宽
  const bPad=Math.ceil(labPx*Math.sin(rot*Math.PI/180))+30;
  const W=980,H=250+bPad,{g,iw,ih}=canvas("#c-pareto",W,H,{t:16,r:44,b:bPad,l:60});
  const x=d3.scaleBand().domain(top.map(d=>d.k)).range([0,iw]).padding(.18);
  const y=d3.scaleLinear().domain([0,d3.max(top,d=>d.rev)]).nice().range([ih,0]);
  const y2=d3.scaleLinear().domain([0,1]).range([ih,0]);
  const pfmt=k=>clipToWidth(D.sku[k].n,labPx,10);
  g.append("g").attr("class","ax").attr("transform",`translate(0,${ih})`)
    .call(thinBand(d3.axisBottom(x).tickSize(3),x,pfmt,10,-rot))
    .call(gg=>rotTicks(gg,-rot,10))
    .selectAll("text").attr("transform","rotate(-52)").style("text-anchor","end").attr("dx","-4").attr("dy","3").style("font-size","9.5px");
  g.append("g").attr("class","ax").call(d3.axisLeft(y).ticks(5).tickFormat(F.money));
  g.append("g").attr("class","ax").attr("transform",`translate(${iw},0)`).call(d3.axisRight(y2).ticks(5).tickFormat(F.p0));
  const bars=g.selectAll("rect.b").data(top).join("rect").attr("class","b").attr("x",d=>x(d.k)).attr("y",d=>y(d.rev))
    .attr("width",x.bandwidth()).attr("height",d=>ih-y(d.rev)).attr("fill",d=>CATCOLOR(D.cats[d.cat])).attr("rx",1)
    .call(s=>hov(s,d=>skuTip(d)));
  drillable(bars,d=>({kick:"按单品下钻",title:d.name,keys:{skus:[d.k]}}));
  g.append("path").datum(top).attr("d",d3.line().x(d=>x(d.k)+x.bandwidth()/2).y(d=>y2(d.cum)))
    .attr("fill","none").attr("stroke",C.ink).attr("stroke-width",1.6);
  g.append("text").attr("class","axt").attr("x",iw).attr("y",-8).attr("text-anchor","end").text("累计销售额占比（右轴）");
  g.append("text").attr("class","axt").attr("x",0).attr("y",-8).text("单品销售额（左轴）");
  [0.5,0.8].forEach(t=>{const i=top.findIndex(d=>d.cum>=t);
    if(i>=0){g.append("line").attr("x1",x(top[i].k)).attr("x2",x(top[i].k)).attr("y1",0).attr("y2",ih)
      .attr("stroke",C.c2).attr("stroke-dasharray","4 3");
    g.append("circle").attr("cx",x(top[i].k)+x.bandwidth()/2).attr("cy",y2(top[i].cum)).attr("r",4)
      .attr("fill",C.c2).attr("stroke","#fff");
    g.append("text").attr("x",x(top[i].k)+6).attr("y",y2(t)-6).style("font-size","10.5px").attr("fill",C.c2d)
      .text(`前 ${i+1} 个单品 = ${F.p0(t)} 销售额`);}});
  /* 前 5 名直接标在柱顶，其余靠悬停 */
  top.slice(0,5).forEach(d=>g.append("text").attr("x",x(d.k)+x.bandwidth()/2).attr("y",y(d.rev)-6)
    .attr("text-anchor","middle").style("font-size","10px").attr("fill",C.ink2)
    .attr("pointer-events","none").text(clipToWidth(d.name,72,10)));
  legend("#l-pareto",Array.from(new Set(top.map(d=>d.cat))).slice(0,8).map(c=>({c:CATCOLOR(D.cats[c]),t:D.cats[c]}))
    .concat([{c:C.ink,shape:"line",t:"累计占比"},{c:C.c2,shape:"dash",t:"50% / 80% 分界"}]),"点击柱子下钻到该单品");
  const cross=g.append("line").attr("class","crosshair").attr("y1",0).attr("y2",ih).attr("opacity",0);
  const halo=g.append("rect").attr("fill","none").attr("stroke",C.ink).attr("stroke-width",1.5).attr("opacity",0).attr("rx",1);
  pointerNearest({g,iw,ih},top,d=>x(d.k)+x.bandwidth()/2,d=>y(d.rev),{maxDist:9999,
    move:(ev,d)=>{const cx=x(d.k)+x.bandwidth()/2;
      cross.attr("x1",cx).attr("x2",cx).attr("opacity",1).raise();
      halo.attr("x",x(d.k)-1).attr("y",y(d.rev)-1).attr("width",x.bandwidth()+2).attr("height",ih-y(d.rev)+2).attr("opacity",1).raise();
      showTip(ev,skuTip(d));},
    leave:()=>{cross.attr("opacity",0);halo.attr("opacity",0);},
    click:d=>openDrill({kick:"按单品下钻",title:d.name,keys:{skus:[d.k]}})});
  const n80=arr.findIndex(d=>d.cum>=0.8)+1,tail=arr.filter(d=>d.perStoreDay<1);
  d3.select("#f-pareto").html(tagLine([TAG.m,`共 ${arr.length} 个单品`,
    `<b>${n80}</b> 个单品（${F.p1(n80/arr.length)}）贡献 80% 销售额`,
    `日均每店不足 1 件的有 <b>${tail.length}</b> 个，合计仅 ${F.p1(d3.sum(tail,d=>d.rev)/tot)} 销售额，却占用 ${F.p1(tail.length/arr.length)} 的货架与备料位`]));
  d3.select("#t-par").text(`${n80} 个单品贡献 80% 的销售额，另外 ${tail.length} 个单品的日均销量不足每店 1 件`);
}
function skuTip(d){
  return tipHTML(d.name,[["品类 / 面团",D.cats[d.cat]+" · "+d.dough],["销量",F.n(d.qty)+" 件"],["销售额",F.yuan(d.rev)],
    ["售价",F.n1(d.price)+" 元"],["铺货",d.stores+" 店 · 店日均 "+F.n1(d.perStoreDay)+" 件"],
    ["售罄率 / 报废率",F.p1(d.srr)+" / "+F.p1(d.wrr)],["报废金额",F.yuan(d.wval)]]);
}
/* ---- ABC ---- */
function drawABC(){
  const arr=skuStats().sort((a,b)=>b.rev-a.rev),tot=d3.sum(arr,d=>d.rev)||1;
  let c=0;arr.forEach(d=>{c+=d.rev;d.cum=c/tot;d.grade=d.cum<=S.abcA?"A":d.cum<=S.abcB?"B":"C";});
  const act=d=>{
    if(d.grade==="A"&&d.wrr>0.12)return["保 · 但要控损","该单品是收入支柱，报废率却高于全线，优先做分时段出炉"];
    if(d.grade==="A")return["保 · 优先保供","缺货的机会成本最高，可上调安全库存"];
    if(d.grade==="B"&&d.wrr>0.15)return["改 · 降备货","销量中等而报废偏高，先砍订货再看是否砍品"];
    if(d.grade==="B")return["改 · 观察","维持现状，进入月度复盘名单"];
    if(d.stores<=2)return["并 · 区域限定","仅个别门店在售，考虑并入邻近口味或转为预订"];
    return["汰 · 候选下架","销量与销售额双低，下架释放的备料与出炉位可给 A 级单品"];
  };
  const cnt=d3.rollup(arr,g=>({n:g.length,rev:d3.sum(g,d=>d.rev)}),d=>d.grade);
  d3.select("#c-abc").html(`<table><thead><tr><th>单品</th><th>级</th><th>品类</th><th>销量</th><th>销售额</th><th>累计占比</th><th>铺货店</th><th>店日均</th><th>售罄率</th><th>报废率</th><th style="text-align:left">处置方向</th></tr></thead><tbody>`+
    arr.slice(0,140).map(d=>{const A=act(d);return `<tr class="drillable" data-k="${d.k}"><td title="${d.name}">${clip(d.name,16)}</td>
    <td><span class="pill ${d.grade==="A"?"a":d.grade==="B"?"b":"c"}">${d.grade}</span></td>
    <td>${D.cats[d.cat]}</td><td>${F.n(d.qty)}</td><td>${F.money(d.rev)}</td><td>${F.p1(d.cum)}</td>
    <td>${d.stores}</td><td>${F.n1(d.perStoreDay)}</td><td>${F.p1(d.srr)}</td>
    <td class="${d.wrr>0.15?'bad':d.wrr<0.06?'good':''}">${F.p1(d.wrr)}</td>
    <td style="text-align:left" title="${A[1]}">${A[0]}</td></tr>`;}).join("")+`</tbody></table>`);
  d3.selectAll("#c-abc tr[data-k]").on("click",function(){openDrill({kick:"按单品下钻",title:skuName(+this.dataset.k),keys:{skus:[+this.dataset.k]}});});
  const gA=cnt.get("A")||{n:0,rev:0},gC=cnt.get("C")||{n:0,rev:0};
  d3.select("#f-abc").html(tagLine([TAG.m,TAG.d.replace("设计值","分级线为设计值"),
    `A 级 ${gA.n} 个单品占销售额 ${F.p1(gA.rev/tot)}；C 级 ${gC.n} 个单品仅占 ${F.p1(gC.rev/tot)}`,
    `处置方向由「级别 + 报废率 + 铺货店数」三条规则生成，非人工判断`,`表格仅显示前 140 行`]));
}
/* ---- 菜单工程矩阵 ---- */
function drawMatrix(){
  const arr=skuStats().filter(d=>d.qty>0);
  const byCat=d3.group(arr,d=>d.cat);
  arr.forEach(d=>{const g=byCat.get(d.cat);d.share=d.qty/Math.max(d3.sum(g,x=>x.qty),1);d.nCat=g.length;
    d.popT=S.popT/d.nCat;d.cmAvg=d3.sum(g,x=>x.cmTot)/Math.max(d3.sum(g,x=>x.qty),1);
    d.hiPop=d.share>=d.popT;d.hiCm=d.cm>=d.cmAvg;
    d.quad=d.hiPop&&d.hiCm?"明星":d.hiPop?"引流":d.hiCm?"潜力":"淘汰候选";});
  const W=980,H=420,{g,iw,ih}=canvas("#c-matrix",W,H,{t:18,r:22,b:48,l:64});
  const x=d3.scaleLog().domain([Math.max(d3.min(arr,d=>d.share)||0.0005,0.0003),d3.max(arr,d=>d.share)]).range([0,iw]);
  const y=d3.scaleLinear().domain([0,d3.max(arr,d=>d.cm)*1.06]).nice().range([ih,0]);
  const r=d3.scaleSqrt().domain([0,d3.max(arr,d=>d.cmTot)]).range([2,20]);
  axes(g,x,y,iw,ih,{xAxis:d3.axisBottom(x).ticks(6,".1%"),yf:v=>v.toFixed(0)+"元"});
  const QC={"明星":C.c1,"引流":C.c4,"潜力":C.c2,"淘汰候选":C.c3};
  const xm=d3.mean(arr,d=>d.popT),ym=d3.mean(arr,d=>d.cmAvg);
  g.append("rect").attr("x",x(xm)).attr("y",0).attr("width",iw-x(xm)).attr("height",y(ym)).attr("fill",C.c1w).attr("opacity",.55);
  g.append("rect").attr("x",0).attr("y",y(ym)).attr("width",x(xm)).attr("height",ih-y(ym)).attr("fill",C.c3w).attr("opacity",.4);
  g.append("line").attr("class","refl").attr("x1",x(xm)).attr("x2",x(xm)).attr("y1",0).attr("y2",ih).attr("stroke",C.ink4);
  g.append("line").attr("class","refl").attr("x1",0).attr("x2",iw).attr("y1",y(ym)).attr("y2",y(ym)).attr("stroke",C.ink4);
  g.append("text").attr("class","reft").attr("x",x(xm)+4).attr("y",12).attr("fill",C.ink4).text("人气阈值（品类内 "+F.p0(S.popT)+" 均分）");
  g.append("text").attr("class","reft").attr("x",2).attr("y",y(ym)-4).attr("fill",C.ink4).text("品类平均单件毛利");
  [["明星","end",iw-6,14],["引流","start",6,14],["潜力","end",iw-6,ih-8],["淘汰候选","start",6,ih-8]].forEach(q=>
    g.append("text").attr("x",q[2]).attr("y",q[3]).attr("text-anchor",q[1]).style("font-size","11px")
      .attr("fill",QC[q[0]]).attr("opacity",.8).text(q[0]));
  const dots=g.selectAll("circle.m").data(arr).join("circle").attr("class","m").attr("cx",d=>x(Math.max(d.share,0.0003))).attr("cy",d=>y(d.cm))
    .attr("r",d=>r(d.cmTot)).attr("fill",d=>QC[d.quad]).attr("opacity",.62).attr("stroke","#fff").attr("stroke-width",.8)
    .call(s=>hov(s,d=>tipHTML(d.name+" · "+d.quad,[["品类",D.cats[d.cat]],
      ["人气份额",F.p1(d.share)+"（阈值 "+F.p1(d.popT)+"）"],["单件毛利",F.n1(d.cm)+" 元（品类均值 "+F.n1(d.cmAvg)+"）"],
      ["毛利总额",F.yuan(d.cmTot)],["售价",F.n1(d.price)+" 元"],["报废率 / 铺货",F.p1(d.wrr)+" / "+d.stores+" 店"]])));
  drillable(dots,d=>({kick:"按单品下钻",title:d.name,keys:{skus:[d.k]}}));
  const ring=g.append("circle").attr("class","focusdot").attr("fill","none").attr("stroke",C.ink)
    .attr("stroke-width",1.5).attr("opacity",0);
  pointerNearest({g,iw,ih},arr,d=>x(Math.max(d.share,0.0003)),d=>y(d.cm),{maxDist:46,
    move:(ev,d)=>{ring.attr("cx",x(Math.max(d.share,0.0003))).attr("cy",y(d.cm)).attr("r",r(d.cmTot)+4).attr("opacity",1).raise();
      showTip(ev,tipHTML(d.name+" · "+d.quad,[["品类",D.cats[d.cat]],
        ["人气份额",F.p1(d.share)+"（阈值 "+F.p1(d.popT)+"）"],["单件毛利",F.n1(d.cm)+" 元（品类均值 "+F.n1(d.cmAvg)+"）"],

/* ============================ 8. 铺货一致性 ============================ */
function drawHeat(){
  const v=view().filter(d=>S.asCat==="全部"||D.cats[d.c]===S.asCat);
  let arr=skuStats(v).filter(d=>d.stores>=S.asMin);
  arr=arr.sort(S.asSort?(a,b)=>b.qty-a.qty:(a,b)=>b.stores-a.stores).slice(0,70);
  const stores=d3.range(D.stores.length).filter(s=>S.store===null||s===S.store)
    .filter(s=>!S.regions.size||S.regions.has(D.storeRegion[s]));
  const cell=Object.fromEntries(arr.map(d=>[d.k,{}]));
  const dys=new Set(v.map(d=>d.d)).size||1;
  v.forEach(d=>{if(cell[d.k]){cell[d.k][d.s]=cell[d.k][d.s]||{q:0,w:0,a:0};
    cell[d.k][d.s].q+=d.sl;cell[d.k][d.s].w+=d.w;cell[d.k][d.s].a+=d.avail;}});
  const cw=Math.max(30,Math.min(46,760/Math.max(stores.length,1))),rh=16;
  /* 左侧留白按最长单品名算，行标不再被裁掉半个字 */
  const lw=Math.min(240,Math.max(140,(d3.max(arr,d=>estW(clipToWidth(d.name,220,10.5),10.5))||140)+16));
  const topPad=Math.min(74,Math.max(46,(d3.max(stores,s=>estW(storeName(s),10))||40)*0.86+16));
  const W=lw+stores.length*cw+128,H=arr.length*rh+topPad+8;
  const {g}=canvas("#c-heat",W,H,{t:topPad,r:8,b:6,l:lw},{fixed:true});
  const mx=d3.max(arr,d=>d3.max(Object.values(cell[d.k]||{}),c=>c.q/dys)||0)||1;
  const col=d3.scaleSequential(t=>d3.interpolateRgb(C.c1w,C.c1d)(t)).domain([0,mx]);
  stores.forEach((s,i)=>{g.append("text").attr("x",i*cw+cw/2).attr("y",-7).attr("text-anchor","start")
    .attr("transform",`rotate(-50,${i*cw+cw/2},-7)`).style("font-size","10px").attr("fill",C.ink2).text(storeName(s));});
  const cells=[];
  arr.forEach((d,j)=>stores.forEach((s,i)=>cells.push({k:d.k,s,i,j,name:d.name,c:(cell[d.k]||{})[s]})));
  g.append("g").selectAll("text.rl").data(arr,d=>d.k).join("text").attr("class","rl")
    .attr("x",-6).attr("y",(d,j)=>j*rh+11).attr("text-anchor","end").style("font-size","10.5px")
    .attr("fill",C.ink).text(d=>clipToWidth(d.name,lw-12,10.5)).append("title").text(d=>d.name);
  const cellG=g.append("g").attr("class","cellg");
  cellG.selectAll("rect.cl").data(cells,d=>d.k+"_"+d.s).join("rect").attr("class","cl m mark")
    .attr("x",d=>d.i*cw+1).attr("y",d=>d.j*rh+1).attr("width",cw-2).attr("height",rh-2)
    .attr("fill",d=>d.c?col(d.c.q/dys):C.panel2)
    .attr("stroke",d=>d.c?"none":C.rule2).attr("stroke-dasharray","2 2")
    .style("cursor",d=>d.c?"pointer":"default");
  /* 1000+ 格子用事件委托，避免逐格挂监听 */
  const cellOf=ev=>{const t=ev.target;return (t&&t.__data__&&t.__data__.k!==undefined)?t.__data__:null;};
  cellG.on("mousemove",ev=>{const d=cellOf(ev);if(!d){hideTip();return;}
      showTip(ev,d.c?tipHTML(d.name+" · "+storeName(d.s),[["日均",F.n1(d.c.q/dys)+" 件"],
        ["合计",F.n(d.c.q)+" 件"],["报废",F.n(d.c.w)+" 件"],["报废率",F.p1(d.c.a?d.c.w/d.c.a:0)]])
        :tipHTML(d.name+" · "+storeName(d.s),[["状态","该店未铺此单品"]],false));})
    .on("mouseleave",hideTip)
    .on("click",ev=>{const d=cellOf(ev);if(d&&d.c)openDrill({kick:"按门店 × 单品下钻",
      title:d.name+" · "+storeName(d.s),keys:{skus:[d.k],stores:[d.s]}});});
  g.append("g").selectAll("text.rr").data(arr,d=>d.k).join("text").attr("class","rr")
    .attr("x",stores.length*cw+8).attr("y",(d,j)=>j*rh+11).style("font-size","10px").attr("fill",C.ink3)
    .text(d=>`${d.stores}/${stores.length} 店 · ${F.money(d.rev)}`);
  legend("#l-heat",[{ramp:[C.c1w,C.c1d],t:"日均销量",lo:"0",hi:F.n1(mx)+" 件"},
    {c:C.panel2,t:"该店未铺此单品（虚线空格）"}],"点击格子下钻到该店该单品的逐日记录");
  const all=skuStats(v),full=all.filter(d=>d.stores===D.stores.length).length,one=all.filter(d=>d.stores===1).length;
  d3.select("#f-heat").html(tagLine([TAG.m,"格子色深 = 该店该单品的日均销量；虚线空格 = 该店当期没有这个单品",
    `当前口径下共 ${all.length} 个单品，铺满 ${D.stores.length} 店的 <b>${full}</b> 个，只在 1 家店的 <b>${one}</b> 个`,
    "最多显示 70 行"]));
}

function drawPriceDiff(){

  const byName=d3.rollup(v,g=>d3.median(g,d=>d.pr),d=>d.k,d=>d.r);
  const arr=[];
  byName.forEach((m,k)=>{if(m.size<2)return;
    const vals=Array.from(m,([r,p])=>({r,p}));

    if(mx>mn)arr.push({k,name:D.sku[k].n,mn,mx,spread:mx-mn,pct:(mx-mn)/mn,vals,cat:D.sku[k].c});});
  arr.sort((a,b)=>b.pct-a.pct);

    arr.slice(0,40).map(d=>{const lo=d.vals.find(x=>x.p===d.mn),hi=d.vals.find(x=>x.p===d.mx);

      <td>${regShort(lo.r)} ${F.n1(d.mn)}</td><td>${regShort(hi.r)} ${F.n1(d.mx)}</td><td>${F.n1(d.spread)} 元</td>
      <td class="${d.pct>0.2?'bad':''}">${F.p1(d.pct)}</td></tr>`;}).join("")+`</tbody></table>`);

    "计划稿在上海与北京两页写过「单价对比 GZ，过高」，这里给出逐个单品的量化差额"]));

/* ---- 货盘瘦身三方案 ---- */
function drawSkuOpt(){
  const arr=skuStats(),tot=d3.sum(arr,d=>d.rev)||1;
  const tail=arr.filter(d=>d.perStoreDay<1), single=arr.filter(d=>d.stores<=2);
  const hiw=arr.filter(d=>d.wrr>0.18&&d.qty>0);
  const A=`<div class="opt pick"><div class="lab">路线 A · 按动销砍</div><h4>砍掉 ${tail.length} 个日均不足 1 件的单品，让出 ${F.p1(tail.length/arr.length)} 的货盘位</h4>
    <ul><li>规则清晰，店长可自行执行，无需总部逐个拍板</li><li>损失销售额 ${F.p1(d3.sum(tail,d=>d.rev)/tot)}，直接省下报废 ${F.yuan(d3.sum(tail,d=>d.wval))}</li><li>释放的出炉位优先给 A 级单品补量</li></ul>
    <div class="tradeoff">代价：动销低不等于没价值，其中含新品试销期与区域特供款，一刀切会误伤刚上市的单品。执行前需先剔除上市不足 4 周的单品。</div></div>`;
  const B=`<div class="opt"><div class="lab">路线 B · 按报废砍</div><h4>先动 ${hiw.length} 个报废率高于 18% 的单品，合计报废 ${F.yuan(d3.sum(hiw,d=>d.wval))}</h4>
    <ul><li>先降订货量观察两周，仍不达标再下架，属于可逆动作</li><li>其中不乏销量不低的单品，降量比下架更划算</li><li>与订货推演页的建议出炉量直接衔接</li></ul>
    <div class="tradeoff">代价：见效慢，需要两轮观察期；且高报废常来自出炉时段而非单品本身，砍错对象会白白损失销量。</div></div>`;
  const C=`<div class="opt"><div class="lab">路线 C · 按面团线砍</div><h4>合并只挂 1–2 个单品的面团线，减少小批量打面与备料切换</h4>
    <ul><li>解决的是产能与人工，不只是货架</li><li>单品数不必大幅下降，改的是配方归属</li><li>对四张分区计划表反复提到的产能问题正面回应</li></ul>
    <div class="tradeoff">代价：涉及配方改造与研发排期，落地周期最长；口味会有细微变化，需先做小范围口感盲测。</div></div>`;
  d3.select("#c-skuopt").html(`<div class="opts">${A}${B}${C}</div>
    <div class="formula">${tagLine([TAG.m,"三条路线的单品数与金额均为当前筛选口径下的实测值，随顶栏筛选变化",
      "阈值（1 件/店日、18% 报废率、1–2 个单品/面团线）为<b>设计值</b>，可按客户的货架数与产能重新设定"])}</div>`);
}
/* ---- 价格带三方案 ---- */
function drawPriceOpt(){
  const v=view().filter(d=>d.pr>0&&D.cats[d.c]==="个包");
  const lo=v.filter(d=>d.pr<=15),hi=v.filter(d=>d.pr>20);
  const totRev=sum(v,d=>d.rev)||1,totQty=sum(v,d=>d.sl)||1;
  const uplift=q=>sum(v,d=>d.sl)*q;
  const A=`<div class="opt"><div class="lab">走法 A · 补低价位（原表方案）</div><h4>把 3 款单品调到 15 元以内，低价位单品占比从 ${F.p1(new Set(lo.map(d=>d.k)).size/new Set(v.map(d=>d.k)).size)} 提升</h4>
    <ul><li>降低首次进店的尝试门槛，对新客与到店频次有利</li><li>原表计划稿已写明这一动作，落地阻力最小</li><li>15 元以内单品当前贡献销量 ${F.p1(sum(lo,d=>d.sl)/totQty)}、销售额 ${F.p1(sum(lo,d=>d.rev)/totRev)}</li></ul>
    <div class="tradeoff">代价：件单价被拉低，若连带率没同步提升，客单价会下滑；低价单品的报废绝对金额虽小，件数损耗往往更高。</div></div>`;
  const B=`<div class="opt pick"><div class="lab">走法 B · 抬中价位</div><h4>把 15–20 元带做厚，这一带的销售额占比高于销量占比，是当前效率最高的价格段</h4>
    <ul><li>不动两端，只把中价位的单品数补齐</li><li>对现有面团线的改动最小，多为配方与配料升级</li><li>客单价与毛利同时受益</li></ul>
    <div class="tradeoff">代价：中价位是竞争最密集的价格段，同质化风险高；需要配方差异撑住，否则只是换个价签。</div></div>`;
  const C=`<div class="opt"><div class="lab">走法 C · 拉平跨区价差</div><h4>${F.n(new Set(hi.map(d=>d.k)).size)} 个 20 元以上单品中，多个在不同区域执行不同价格</h4>
    <ul><li>统一定价降低顾客比价投诉与门店解释成本</li><li>为全国性会员与联名活动扫清价格障碍</li><li>可先统一同名同规格的商品，保留区域专供款的独立定价</li></ul>
    <div class="tradeoff">代价：向下统一会直接损失高价区的毛利，向上统一会压低低价区的销量；两者都需要一轮弹性测试而非直接拍板。</div></div>`;
  d3.select("#c-priceopt").html(`<div class="opts">${A}${B}${C}</div>
    <div class="formula">${tagLine([TAG.m,"仅统计「个包」品类，与原表计划稿的价格带口径一致",
      "三种走法互不排斥，但同一季度内建议只推一种，否则无法归因"])}</div>`);
}

<script>
/* ============================ 9. 价格带 ============================ */
const BANDS=[{k:"≤15 元",lo:0,hi:15,c:C.c1m},{k:"15–20 元",lo:15,hi:20,c:C.c1},
  {k:"20–25 元",lo:20,hi:25,c:C.c2m},{k:"25–32 元",lo:25,hi:32,c:C.c2d},{k:">32 元",lo:32,hi:1e9,c:C.c3}];
const bandOf=p=>BANDS.findIndex(b=>p>b.lo&&p<=b.hi)>=0?BANDS.findIndex(b=>p>b.lo&&p<=b.hi):0;
function drawBand(){
  const v=view().filter(d=>d.pr>0&&["个包","法包","家庭装面包","三文治"].includes(D.cats[d.c]));
  const key=d=>D.regions[d.r]+"｜"+D.cats[d.c];

    const rr=D.regions.indexOf(Sk.kk.split("｜")[0]),cc=D.cats.indexOf(Sk.kk.split("｜")[1]);
    drillable(rc,()=>({kick:"按价格带下钻",title:Sk.kk+" · "+BANDS[i].k,keys:{regions:[rr],cats:[cc]},

      .attr("text-anchor","middle").style("font-size","10px").attr("fill","#fff").text(n);
    acc+=n;});});
  g.append("text").attr("class","axt").attr("x",0).attr("y",-6).text("在售单品数");
  legend("#l-band",BANDS.map(b=>({c:b.c,t:b.k})),"点击任一色块下钻到该组该价格带的原始记录");
  const hi=(r)=>{const it=items.filter(d=>d.r===r);return it.length?it.filter(d=>d.pr>20).length/it.length:0;};
  const rs=d3.range(D.regions.length).filter(r=>items.some(d=>d.r===r));
  const sorted=rs.map(r=>({r,v:hi(r)})).sort((a,b)=>b.v-a.v);

  d3.select("#f-band").html(tagLine([TAG.m,"按「区域 × 品类 × 单品」去重后计数，同一单品在不同区按各自售价分别归带",
    "分档沿用原表计划稿的切法（20 元、25 元），并补充 15 元与 32 元两条线以覆盖个包与吐司"]));
}

function doughStats(){
  const v=view().filter(d=>D.chans[d.ch]==="厨房烘焙");
  const dys=new Set(v.map(d=>d.d)).size||1;
  return Array.from(d3.group(v,d=>D.sku[d.k].d),([dg,g])=>{
    const a=agg(g);return {dg,...a,skus:new Set(g.map(d=>d.k)).size,perDay:a.sales/dys,
      wrr:wr(a),srr:sr(a),stores:new Set(g.map(d=>d.s)).size};}).sort((a,b)=>b.sales-a.sales);
}

/* ============================ 11. 报废诊断 ============================ */
function drawWaterfall(){
  const a=agg(view());
  const steps=[{k:"按售价计的可动用货值",v:a.avval||sum(view(),d=>d.avval),t:"base"},
    {k:"当天报废",v:-a.wval,t:"neg"},{k:"留到隔天",v:-a.clval,t:"neg"},{k:"实际销售额",v:a.rev,t:"end"}];
  const W=980,H=250,{g,iw,ih}=canvas("#c-waterfall",W,H,{t:20,r:14,b:44,l:70});
  const x=d3.scaleBand().domain(steps.map(d=>d.k)).range([0,iw]).padding(.34);
  const mxv=steps[0].v;
  const y=d3.scaleLinear().domain([0,mxv*1.06]).nice().range([ih,0]);
  axes(g,x,y,iw,ih,{xAxis:d3.axisBottom(x).tickSize(3),yf:F.money});
  let run=0;
  steps.forEach((s,i)=>{
    let y0,y1,col;
    if(s.t==="base"){y0=0;y1=s.v;run=s.v;col=SEM.avail;}
    else if(s.t==="neg"){y1=run;run+=s.v;y0=run;col=s.k.includes("报废")?SEM.waste:SEM.left;}
    else {y0=0;y1=s.v;col=SEM.sales;}
    const rc=g.append("rect").attr("x",x(s.k)).attr("y",y(y1)).attr("width",x.bandwidth()).attr("height",Math.max(y(y0)-y(y1),1))
      .attr("fill",col).attr("rx",2)
      .on("mousemove",e=>showTip(e,tipHTML(s.k,[["金额",F.yuan(Math.abs(s.v))],["占可动用货值",F.p1(Math.abs(s.v)/mxv)]]))).on("mouseleave",hideTip);
    drillable(rc,()=>({kick:"按去向下钻",title:s.k,keys:{},
      pred:s.k.includes("报废")?(o=>o.w>0):s.k.includes("隔天")?(o=>o.cl>0):s.k.includes("销售额")?(o=>o.sl>0):null}));
    g.append("text").attr("x",x(s.k)+x.bandwidth()/2).attr("y",y(Math.max(y0,y1))-7).attr("text-anchor","middle")
      .style("font-size","11.5px").attr("fill",C.ink2).text((s.t==="neg"?"−":"")+F.yuan(Math.abs(s.v)));
    g.append("text").attr("x",x(s.k)+x.bandwidth()/2).attr("y",y(Math.max(y0,y1))+14).attr("text-anchor","middle")
      .style("font-size","10px").attr("fill","#fff").text(F.p1(Math.abs(s.v)/mxv));
    if(i<steps.length-1)g.append("line").attr("x1",x(s.k)+x.bandwidth()).attr("x2",x(steps[i+1].k))
      .attr("y1",y(s.t==="base"?s.v:run)).attr("y2",y(s.t==="base"?s.v:run)).attr("stroke",C.rule).attr("stroke-dasharray","3 2");
  });
  legend("#l-waterfall",[{c:SEM.avail,t:"按售价计的可动用货值"},{c:SEM.waste,t:"当天报废"},
    {c:SEM.left,t:"留到隔天"},{c:SEM.sales,t:"实际销售额"}],"柱内百分比为占可动用货值的比重 · 点击柱子下钻");
  d3.select("#f-waterfall").html(tagLine([TAG.m,
    `可动用货值 = Σ(可动用件数 × 当日售价)；这是「如果全部按原价卖光」的上限，不是收入预算`,
    `报废吃掉 <b>${F.p1(a.wval/(a.avval||sum(view(),d=>d.avval)))}</b>，隔夜库存占 <b>${F.p1(a.clval/(a.avval||sum(view(),d=>d.avval)))}</b>`,
    `隔夜部分含家庭装等长保商品，不能全额记为损失`]));
}
function drawWasteSku(){

  d3.select("#f-wastesku").html(tagLine([TAG.m,"柱长 = 报废件数 × 当日售价；色深 = 报废率（0 至 30%）",

}
function drawWasteHeat(){
  const v=view(),stores=Array.from(new Set(v.map(d=>d.s))).sort((a,b)=>a-b);
  const days=Array.from(new Set(v.map(d=>d.d))).sort((a,b)=>a-b);
  const m=d3.rollup(v,g=>({w:sum(g,d=>d.w),a:sum(g,d=>d.avail),wv:sum(g,d=>d.wval)}),d=>d.s,d=>d.d);
  const cw=Math.max(36,Math.min(70,380/Math.max(days.length,1))),rh=19;
  const W=110+days.length*cw+70,H=stores.length*rh+52;
  const {g}=canvas("#c-wasteheat",W,H,{t:34,r:8,b:8,l:104},{fixed:true});
  const vals=[];stores.forEach(s=>days.forEach(d=>{const o=(m.get(s)||new Map()).get(d);if(o&&o.a)vals.push(o.w/o.a);}));
  const col=d3.scaleSequential(t=>d3.interpolateRgb(C.c3w,C.c3d)(t)).domain([0,d3.max(vals)||.2]);
  days.forEach((d,i)=>g.append("text").attr("x",104+i*cw-104+cw/2).attr("y",-8).attr("text-anchor","middle")
    .style("font-size","10.5px").attr("fill",C.ink2).text(dlabel(d)));
  stores.forEach((s,j)=>{
    g.append("text").attr("x",-6).attr("y",j*rh+13).attr("text-anchor","end").style("font-size","10.5px").attr("fill",C.ink).text(storeName(s));
    let tw=0,ta=0;
    days.forEach((d,i)=>{const o=(m.get(s)||new Map()).get(d);
      const rr=o&&o.a?o.w/o.a:null;if(o){tw+=o.w;ta+=o.a;}
      const rc=g.append("rect").attr("x",i*cw+1).attr("y",j*rh+1).attr("width",cw-2).attr("height",rh-2)
        .attr("fill",rr===null?C.panel2:col(rr)).attr("rx",1)
        .on("mousemove",e=>showTip(e,rr===null?tipHTML("无记录",[],false):tipHTML(storeName(s)+" "+dlabel(d),
          [["报废率",F.p1(rr)],["报废件数",F.n(o.w)+" 件"],["可动用",F.n(o.a)+" 件"],["报废金额",F.yuan(o.wv)]]))).on("mouseleave",hideTip);
      if(rr!==null)drillable(rc,()=>({kick:"按门店 × 日期下钻",title:storeName(s)+" · "+dlabel(d),keys:{stores:[s],days:[d]}}));
      if(rr!==null&&cw>44)g.append("text").attr("x",i*cw+cw/2).attr("y",j*rh+13).attr("text-anchor","middle")
        .style("font-size","9.5px").attr("pointer-events","none")
        .attr("fill",rr>((d3.max(vals)||.2)*0.55)?"#fff":C.ink2).text(F.p0(rr));});
    g.append("text").attr("x",days.length*cw+8).attr("y",j*rh+13).style("font-size","10px")
      .attr("fill",ta&&tw/ta>0.10?C.c3d:C.ink3).text(ta?F.p1(tw/ta):"");});
  legend("#l-wasteheat",[{ramp:[C.c3w,C.c3d],t:"当日报废率",lo:"0%",hi:F.p0(d3.max(vals)||.2)},
    {c:C.panel2,t:"无记录"}],"右侧一列为该店窗口合计报废率 · 点击格子下钻");
  d3.select("#f-wasteheat").html(tagLine([TAG.m,"格子 = 当店当日报废件数 ÷ 当日可动用件数；右侧为该店 6 天合计",
    "同一列整体偏深说明是当天的排产问题，同一行整体偏深说明是这家店的订货问题"]));
}
function drawWasteOpt(){
  const a=agg(view()),arr=skuStats();
  const hiW=arr.filter(d=>d.wrr>0.15&&d.wval>2000);
  const tail=arr.filter(d=>d.perStoreDay<1);
  const cutW=d3.sum(hiW,d=>d.wval*0.35), cutT=d3.sum(tail,d=>d.wval);
  const optA=`<div class="opt pick"><div class="lab">方案 A · 只动订货，不动货盘</div><h4>把报废率压到 7%，6 天可省约 ${F.yuan(Math.max(a.wval-a.avail*0.07*(a.wval/Math.max(a.waste,1)),0))}</h4>
    <ul><li>对报废率 &gt;15% 的 ${hiW.length} 个单品，按报童模型下调末轮出炉量</li><li>货盘、售价、陈列全部不变，两周内可见效</li><li>不需要总部审批，店长层面即可执行</li></ul>
    <div class="tradeoff">代价：售罄提前会牺牲一部分晚市销售，缺货率上升；须同时监控「零剩余零报废」的店–日–单品数。</div></div>`;
  const optB=`<div class="opt"><div class="lab">方案 B · 砍长尾，集中产能</div><h4>下架 ${tail.length} 个日均不足 1 件的单品，直接消除 ${F.yuan(cutT)} 报废</h4>
    <ul><li>释放出的备料与出炉批次转给 A 级单品，可同时降低缺货</li><li>面团线从 ${new Set(arr.map(d=>d.dough)).size} 条压缩，减少小批量打面</li><li>货架空出的位置留给新品测试</li></ul>
    <div class="tradeoff">代价：损失 ${F.p1(d3.sum(tail,d=>d.rev)/Math.max(a.rev,1))} 销售额，且部分长尾是区域特供，砍掉会影响当地客群与门店差异化。</div></div>`;
  const optC=`<div class="opt"><div class="lab">方案 C · 引入折扣时段</div><h4>把打烊前剩余转成折扣销售，回收率按 50% 测算可挽回约 ${F.yuan(a.wval*0.5)}</h4>
    <ul><li>对短保现烤单品设定固定折扣时点与折扣率</li><li>报废从「全损」变成「减价收入」，同时降低食物浪费口径的合规风险</li><li>折扣数据反过来可校准次日订货</li></ul>
    <div class="tradeoff">代价：会训练出「等折扣」的顾客，侵蚀正价销售；高端定位品牌需评估品牌折损，且需要单独的折扣核算口径。</div></div>`;
  d3.select("#c-wasteopt").html(`<div class="opts">${optA}${optB}${optC}</div>
    <div class="formula">${tagLine([TAG.m+TAG.d,
      "方案 A 的节省额 = 当前报废金额 − 目标报废率下的报废金额，目标 7% 取自行业健康区间下沿（外部基准）",
      "方案 B 的金额 = 长尾单品的实测报废金额合计；销售额损失同为实测值",
      "方案 C 的 50% 回收率为<b>设计值</b>，需用一轮实测折扣数据替换后再决策"])}</div>`);
}
</script>

<script>
/* ============================ 12. 订货推演（报童模型） ============================ */
function nvCritical(){
  const p=1,c=S.nvCost,s=S.nvSalv*c,m=S.nvMargin;
  const cu=m, co=Math.max(c-s,0.0001);
  return {cu,co,cr:cu/(cu+co)};
}
function drawNvCurve(){
  const {cu,co,cr}=nvCritical();
  const W=980,H=250,{g,iw,ih}=canvas("#c-nvcurve",W,H,{t:16,r:150,b:44,l:60});
  const x=d3.scaleLinear().domain([0,1]).range([0,iw]);
  const y=d3.scaleLinear().domain([0,1]).range([ih,0]);
  axes(g,x,y,iw,ih,{xf:F.p0,yf:F.p0});
  const ms=d3.range(0.3,0.91,0.02);
  [0,0.3,0.6].forEach((sv,i)=>{
    const pts=ms.map(m=>({m,v:m/(m+Math.max(S.nvCost-sv*S.nvCost,0.0001))}));
    g.append("path").datum(pts).attr("d",d3.line().x(d=>x(d.m)).y(d=>y(Math.min(d.v,1))))
      .attr("fill","none").attr("stroke",[C.c1,C.c2,C.c4][i]).attr("stroke-width",i===0?2.2:1.3)
      .attr("stroke-dasharray",i===0?null:"4 3");
    g.append("text").attr("x",iw+8).attr("y",y(Math.min(pts[pts.length-1].v,1))+4).style("font-size","11px")
      .attr("fill",[C.c1,C.c2,C.c4][i]).text(`残值率 ${F.p0(sv)}`);});
  g.append("line").attr("class","refl").attr("x1",x(S.nvMargin)).attr("x2",x(S.nvMargin)).attr("y1",y(Math.min(cr,1)))
    .attr("y2",ih).attr("stroke",C.c3);
  g.append("line").attr("class","refl").attr("x1",0).attr("x2",x(S.nvMargin)).attr("y1",y(Math.min(cr,1)))
    .attr("y2",y(Math.min(cr,1))).attr("stroke",C.c3);
  g.append("circle").attr("cx",x(S.nvMargin)).attr("cy",y(Math.min(cr,1))).attr("r",6).attr("fill",C.c3).attr("stroke","#fff");
  g.append("text").attr("x",x(S.nvMargin)).attr("y",y(Math.min(cr,1))-12).attr("text-anchor","middle")
    .style("font-size","12px").attr("fill",C.c3d).text(`当前取值 ${F.p1(Math.min(cr,1))}`);
  g.append("text").attr("class","axt").attr("x",iw).attr("y",ih+34).attr("text-anchor","end").text("毛利率（= 少卖一件的损失）");
  g.append("text").attr("class","axt").attr("x",0).attr("y",-6).text("临界分位数 = 应达到的不缺货概率");
  legend("#l-nvcurve",[{c:C.c1,shape:"line",t:"残值率 0%（当前成本率 "+F.p0(S.nvCost)+"）"},
    {c:C.c2,shape:"dash",t:"残值率 30%"},{c:C.c4,shape:"dash",t:"残值率 60%"},
    {c:C.c3,shape:"dot",t:"当前参数取值"}],"三条曲线均为设计值推演，不含实测数据");
  d3.select("#nv-cr").html(`临界分位数 = ${F.p1(Math.min(cr,1))}，即订货量应覆盖历史需求的第 ${(Math.min(cr,1)*100).toFixed(0)} 百分位`);
  d3.select("#f-nvcurve").html(tagLine([TAG.d,
    `报童模型：<code>临界分位 = 缺货成本 ÷ (缺货成本 + 过量成本)</code>`,
    `缺货成本 = 少卖一件损失的毛利 = ${F.p0(S.nvMargin)}；过量成本 = 成本 − 残值 = ${F.p0(S.nvCost)} × (1 − ${F.p0(S.nvSalv)}) = ${(co).toFixed(3)}`,
    `毛利率、成本率、残值率三个参数均为<b>设计值</b>，原表无成本数据，须由客户财务口径确认后替换`]));
}
function drawNvTbl(){
  const {cr}=nvCritical();
  const v=view().filter(d=>D.chans[d.ch]==="厨房烘焙");
  const byK=d3.group(v,d=>d.k);
  const arr=[];
  byK.forEach((g,k)=>{
    const per=Array.from(d3.rollup(g,gg=>({sl:sum(gg,d=>d.sl),av:sum(gg,d=>d.avail),w:sum(gg,d=>d.w),cl:sum(gg,d=>d.cl)}),d=>d.s+"|"+d.d).values());
    if(per.length<4)return;
    // 需求：售罄（零剩余零报废）当日的销量是右截断观测，用 Kaplan–Meier 还原分布
    const dem=per.map(o=>o.sl), cens=per.filter(o=>o.cl<=0&&o.w===0).length;
    const sorted=dem.slice().sort(d3.ascending);
    const p=Math.min(cr,0.99);
    const qRaw=d3.quantileSorted(sorted,p);
    const km=(typeof kmFit==="function")?kmFit(per.map(o=>({v:o.sl,cens:o.cl<=0&&o.w===0&&o.sl>0}))):null;
    const q=(S.censorOn&&km)?Math.max(km.q(p),qRaw):qRaw;
    const cur=d3.mean(per,o=>o.av);
    const a=agg(g);
    arr.push({k,name:D.sku[k].n,cat:D.sku[k].c,n:per.length,mean:d3.mean(dem),med:d3.median(dem),
      p90:d3.quantileSorted(sorted,.9),rec:q,recRaw:qRaw,cur,delta:q-cur,cens:cens/per.length,
      wrr:wr(a),srr:sr(a),rev:a.rev,wval:a.wval,price:a.sales?a.rev/a.sales:D.sku[k].p});});
  arr.sort((a,b)=>b.rev-a.rev);
  const cut=arr.filter(d=>d.delta<-0.5),add=arr.filter(d=>d.delta>0.5);
  d3.select("#c-nvtbl").html(`<table><thead><tr><th>单品</th><th>品类</th><th>店日样本</th><th>日销均值</th><th>日销中位</th><th>当前出炉量</th><th>建议出炉量</th><th>校正贡献</th><th>调整</th><th>可能缺货占比</th><th>报废率</th><th style="text-align:left">方向</th></tr></thead><tbody>`+
    arr.slice(0,120).map(d=>`<tr class="drillable" data-k="${d.k}"><td title="${d.name}">${clip(d.name,15)}</td><td>${D.cats[d.cat]}</td>
    <td>${d.n}</td><td>${F.n1(d.mean)}</td><td>${F.n1(d.med)}</td><td>${F.n1(d.cur)}</td><td><b>${F.n1(d.rec)}</b></td>
    <td class="${d.rec-d.recRaw>0.05?'warnc':'muted'}">${d.rec-d.recRaw>0.05?"+"+F.n1(d.rec-d.recRaw):"—"}</td>
    <td class="${d.delta<0?'bad':'good'}">${d.delta>0?"+":""}${F.n1(d.delta)}</td>
    <td class="${d.cens>0.4?'warnc':''}">${F.p0(d.cens)}</td><td class="${d.wrr>0.15?'bad':''}">${F.p1(d.wrr)}</td>
    <td style="text-align:left">${d.delta<-0.5?"减产":d.delta>0.5?"加产":"维持"}</td></tr>`).join("")+`</tbody></table>`);
  const totCut=d3.sum(cut,d=>-d.delta*d.price*d.n);
  d3.selectAll("#c-nvtbl tr[data-k]").on("click",function(){
    openDrill({kick:"按单品下钻",title:skuName(+this.dataset.k),keys:{skus:[+this.dataset.k]},
      note:"建议出炉量由这些「店 × 日」观测点的经验分布算出"});});
  d3.select("#f-nvtbl").html(tagLine([TAG.m+TAG.d,
    `以「店 × 日」为一个观测点，取该单品全部观测点销量的经验分位数（不假设正态）`,
    S.censorOn?`已启用<b>缺货截断校正</b>：售罄日视为右截断观测，用 Kaplan–Meier 乘积极限还原需求分布后再取分位，全表建议出炉量合计上调 ${F.n1(d3.sum(arr,d=>Math.max(d.rec-d.recRaw,0)))} 件/店日（可在推演逻辑页关闭）`
      :`<b>未启用</b>缺货截断校正：售罄日的销量被当作真实需求，会系统性低估建议出炉量`,
    `建议减产 <b>${cut.length}</b> 个单品、加产 <b>${add.length}</b> 个单品`,
    `样本仅 ${new Set(v.map(d=>d.d)).size} 天且含假期，分位数估计不稳；正式排产需至少 8 周数据并按星期分层`,
    `"可能缺货占比" = 打烊时零剩余且零报废的观测点占比，是需求被截断的信号，会让分位数低估真实需求`]));
  const cens=v.filter(d=>d.cl<=0&&d.w===0&&d.sl>0);
  d3.select("#t-or").text(`${F.p1(cens.length/Math.max(v.length,1))} 的店–日–单品在打烊时零剩余零报废，缺货损失和报废损失同样值钱`);
}
/* ============================ 13. 新品追踪 ============================ */
const NEWSKU=["黑牛角（榛子巧克力牛角）","“100%哆啦A梦”黑牛角"];
function drawNewCurve(){
  const v=ROWS.filter(d=>NEWSKU.includes(D.sku[d.k].n));
  if(!v.length){d3.select("#c-newcurve").html("<div class='psub'>当前数据中没有可识别的新品</div>");return;}
  const W=980,H=250,{g,iw,ih}=canvas("#c-newcurve",W,H,{t:16,r:56,b:44,l:56});
  const x=d3.scalePoint().domain(d3.range(D.days)).range([26,iw-26]);
  const series=NEWSKU.map(n=>({n,pts:d3.range(D.days).map(i=>{
    const r=v.filter(d=>D.sku[d.k].n===n&&d.d===i);
    return {i,sl:sum(r,d=>d.sl),w:sum(r,d=>d.w),av:sum(r,d=>d.avail),rev:sum(r,d=>d.rev)};})}));
  const y=d3.scaleLinear().domain([0,d3.max(series,s=>d3.max(s.pts,p=>p.sl))*1.15]).nice().range([ih,0]);
  const y2=d3.scaleLinear().domain([0,0.3]).range([ih,0]);
  axes(g,x,y,iw,ih,{xAxis:d3.axisBottom(x).tickFormat(dlabel),yf:F.n});
  g.append("g").attr("class","ax").attr("transform",`translate(${iw},0)`).call(d3.axisRight(y2).ticks(4).tickFormat(F.p0));
  series.forEach((s,i)=>{
    const c=[C.c1,C.c4][i];
    g.append("path").datum(s.pts).attr("d",d3.line().x(p=>x(p.i)).y(p=>y(p.sl))).attr("fill","none").attr("stroke",c).attr("stroke-width",2.2);
    g.selectAll("circle.n"+i).data(s.pts).join("circle").attr("class","n"+i).attr("cx",p=>x(p.i)).attr("cy",p=>y(p.sl)).attr("r",4).attr("fill",c)
      .call(sel=>hov(sel,p=>tipHTML(s.n+" · "+dlabel(p.i),[["销量",F.n(p.sl)+" 件"],["销售额",F.yuan(p.rev)],
        ["报废",F.n(p.w)+" 件"],["报废率",F.p1(p.av?p.w/p.av:0)]])))
      .call(sel=>drillable(sel,p=>({kick:"按新品 × 日期下钻",title:s.n+" · "+dlabel(p.i),global:false,
        keys:{skus:D.sku.map((x,ii)=>x.n===s.n?ii:-1).filter(ii=>ii>=0),days:[p.i]}})));
    g.append("path").datum(s.pts).attr("d",d3.line().x(p=>x(p.i)).y(p=>y2(p.av?p.w/p.av:0)))
      .attr("fill","none").attr("stroke",c).attr("stroke-width",1.2).attr("stroke-dasharray","4 3").attr("opacity",.8);
    g.append("text").attr("x",x(D.days-1)+6).attr("y",y(s.pts[D.days-1].sl)+4).style("font-size","11px").attr("fill",c)
      .text(clipToWidth(s.n,48,11)).append("title").text(s.n);});
  const flat=[];series.forEach((s2,i)=>s2.pts.forEach(p=>flat.push({...p,n:s2.n,ci:i})));
  const ringN=g.append("circle").attr("class","focusdot").attr("fill","none").attr("stroke",C.ink)
    .attr("stroke-width",1.5).attr("r",7).attr("opacity",0);
  pointerNearest({g,iw,ih},flat,p=>x(p.i),p=>y(p.sl),{maxDist:70,
    move:(ev,p)=>{ringN.attr("cx",x(p.i)).attr("cy",y(p.sl)).attr("opacity",1).raise();
      showTip(ev,tipHTML(p.n+" · "+dlabel(p.i),[["销量",F.n(p.sl)+" 件"],["销售额",F.yuan(p.rev)],
        ["报废",F.n(p.w)+" 件"],["报废率",F.p1(p.av?p.w/p.av:0)]]));},
    leave:()=>ringN.attr("opacity",0),
    click:p=>openDrill({kick:"按新品 × 日期下钻",title:p.n+" · "+dlabel(p.i),global:false,
      keys:{skus:D.sku.map((z,ii)=>z.n===p.n?ii:-1).filter(ii=>ii>=0),days:[p.i]}})});
  const allW=wr(agg(ROWS));
  g.append("line").attr("class","refl").attr("x1",0).attr("x2",iw).attr("y1",y2(allW)).attr("y2",y2(allW)).attr("stroke",C.c3);
  g.append("text").attr("class","reft").attr("x",iw).attr("y",y2(allW)-4).attr("text-anchor","end").attr("fill",C.c3d)
    .text("全线平均报废率 "+F.p1(allW));
  g.append("text").attr("class","axt").attr("x",0).attr("y",-6).text("日销量（左轴）");
  g.append("text").attr("class","axt").attr("x",iw).attr("y",-6).attr("text-anchor","end").text("当日报废率（右轴）");
  legend("#l-newcurve",series.map((s2,i)=>({c:[C.c1,C.c4][i],shape:"line",t:s2.n}))
    .concat([{c:C.ink3,shape:"dash",t:"同色虚线：该单品当日报废率"},{c:C.c3,shape:"dash",t:"全线平均报废率"}]),
    "点击圆点下钻到该新品当天的原始记录（不受顶栏筛选影响）");
  const main=v.filter(d=>D.sku[d.k].n===NEWSKU[0]),am=agg(main);
  d3.select("#t-nw").text(`新黑牛角 6 天卖出 ${F.n(am.sales)} 件、${F.money(am.rev)}元，报废率 ${F.p1(wr(am))} 高于全线 ${((wr(am)-wr(agg(ROWS)))*100).toFixed(1)} 个百分点`);
  d3.select("#f-newcurve").html(tagLine([TAG.m,
    `黑牛角 6 天累计：销量 ${F.n(am.sales)} 件、销售额 ${F.yuan(am.rev)}、报废 ${F.n(am.waste)} 件（${F.p1(wr(am))}）`,
    `销量爬坡的同时报废率同步上行，说明加产快于需求验证；新品前两周应固定小批量、按售罄率而非销量决定加产`]));
}
function drawPlanTbl(){
  const skipSec=n=>/^(法包|个包|家庭装面包|三文治|吐司)/.test(n);
  const never=d3.group(D.plan.filter(p=>!p.liveAny&&p.name&&!skipSec(p.name)),d=>d.name);
  const part=d3.group(D.plan.filter(p=>p.liveAny&&!p.live&&p.name&&!skipSec(p.name)),d=>d.name);
  const tbl=(m,head)=>`<div style="font-family:var(--serif);font-size:13.5px;margin:10px 0 5px">${head}</div>
    <table><thead><tr><th>计划稿单品</th><th>涉及区域</th><th>计划售价</th><th>面团</th><th style="text-align:left">计划稿备注</th></tr></thead><tbody>`+
    Array.from(m,([n,g])=>`<tr><td title="${n}">${n.length>17?n.slice(0,17)+"…":n}</td>
    <td>${g.map(d=>d.reg).join("/")}</td><td>${g[0].price??"—"}</td><td>${g[0].dough||"—"}</td>
    <td style="text-align:left;white-space:normal">${Array.from(new Set(g.map(d=>d.note).filter(Boolean))).join("；")||"—"}</td></tr>`).join("")+`</tbody></table>`;
  d3.select("#c-plantbl").html(tbl(never,`全网都查不到销售记录：${never.size} 个，属于真正的待上市单品`)+
    tbl(part,`只在部分区域查不到记录：${part.size} 个，计划稿里却填了销量，数字疑似从其他区域复制`));
  d3.select("#f-plantbl").html(tagLine([TAG.m,
    "判定规则：以（区域, 单品名）在明细表中检索销售记录；全网无记录 = 待上市，部分区域无记录 = 该区未铺货但计划稿已填数",
    "三款丹麦碱水结（原味 16 元、肉桂糖 18 元、开心果 28 元）四个区都已定价、均无销售记录，是本次上市主角",
    "第二组要特别注意：这些行的月累计销量与另一区域完全相同，直接引用会高估该区的基数"]));
}
function drawNewSim(){
  const price=[16,18,28],names=["原味丹麦碱水结","肉桂糖丹麦碱水结","开心果丹麦碱水结"];
  const v=ROWS.filter(d=>D.cats[d.c]==="个包"&&D.chans[d.ch]==="厨房烘焙"&&d.pr>0);
  const dys=D.days;
  const bench=price.map(p=>{
    const near=v.filter(d=>Math.abs(d.pr-p)<=2);
    const byK=d3.rollup(near,g=>({sl:sum(g,d=>d.sl),ns:new Set(g.map(d=>d.s)).size}),d=>d.k);
    const rates=Array.from(byK.values()).filter(o=>o.ns>0).map(o=>o.sl/o.ns/dys).sort(d3.ascending);
    return {p,n:rates.length,p25:d3.quantileSorted(rates,.25)||0,med:d3.median(rates)||0,p75:d3.quantileSorted(rates,.75)||0};});
  const W=470,H=250,{g,iw,ih}=canvas("#c-newsim",W,H,{t:20,r:16,b:50,l:52});
  const x=d3.scaleBand().domain(names).range([0,iw]).padding(.36);
  const y=d3.scaleLinear().domain([0,d3.max(bench,d=>d.p75)*1.2]).nice().range([ih,0]);
  axes(g,x,y,iw,ih,{xAxis:d3.axisBottom(x).tickSize(3),yf:F.n1});
  bench.forEach((b,i)=>{const cx=x(names[i])+x.bandwidth()/2;
    g.append("line").attr("x1",cx).attr("x2",cx).attr("y1",y(b.p25)).attr("y2",y(b.p75)).attr("stroke",C.c1l).attr("stroke-width",12).attr("opacity",.75);
    const dot=g.append("circle").attr("cx",cx).attr("cy",y(b.med)).attr("r",5).attr("fill",C.c1).attr("stroke","#fff")
      .on("mousemove",e=>showTip(e,tipHTML(names[i]+" · 定价 "+b.p+" 元",[["对标单品",b.n+" 个同价位带在售"],
        ["店日销中位",F.n1(b.med)+" 件"],["四分位区间",F.n1(b.p25)+" – "+F.n1(b.p75)+" 件"],
        ["首周总需求",F.n0(b.med*S.newStores*7)+" 件（按 "+S.newStores+" 店）"]]))).on("mouseleave",hideTip);
    drillable(dot,()=>({kick:"对标口径下钻",title:"定价 "+b.p+" 元 ±2 元的同价位个包",global:false,
      keys:{},pred:o=>D.cats[o.c]==="个包"&&D.chans[o.ch]==="厨房烘焙"&&o.pr>0&&Math.abs(o.pr-b.p)<=2,
      note:"这一档基准值由这些记录算出"}));
    g.append("text").attr("x",cx).attr("y",y(b.p75)-8).attr("text-anchor","middle").style("font-size","10.5px").attr("fill",C.ink2)
      .text(F.n1(b.p25)+"–"+F.n1(b.p75));
    g.append("text").attr("x",cx).attr("y",y(b.med)+4).attr("text-anchor","start").attr("dx",9)
      .style("font-size","10.5px").attr("fill",C.c1d).text(F.n1(b.med));});
  g.append("text").attr("class","axt").attr("x",0).attr("y",-6).text("店日销量（件）");
  g.append("text").attr("class","axt").attr("x",iw).attr("y",ih+38).attr("text-anchor","end").text("待上市单品（定价 16 / 18 / 28 元）");
  legend("#l-newsim",[{c:C.c1,shape:"dot",t:"基准：同价位带店日销中位数"},
    {c:C.c1l,t:"保守–乐观区间（四分位）"}],"点击圆点下钻到构成该基准的原始记录");
  const rows=bench.map((b,i)=>`<tr><td>${names[i]}</td><td>${b.p} 元</td><td>${F.n1(b.p25)}</td><td>${F.n1(b.med)}</td><td>${F.n1(b.p75)}</td>
    <td>${F.n(Math.round(b.p25*S.newStores*7))}–${F.n(Math.round(b.p75*S.newStores*7))}</td></tr>`).join("");
  d3.select("#c-newsim").append("table").html(`<thead><tr><th>单品</th><th>定价</th><th>保守</th><th>基准</th><th>乐观</th><th>首周总量区间</th></tr></thead><tbody>${rows}</tbody>`);
  d3.select("#f-newsim").html(tagLine([TAG.m+TAG.d,
    "基准 = 同价位带（±2 元）现有个包单品的店日销中位数，保守/乐观取四分位数",
    `首周总量 = 店日销 × ${S.newStores} 店 × 7 天，未计新品上市初期的尝鲜溢价与货架位加权`,
    "碱水结在中国市场的接受度无历史数据，建议先用 3–5 家店试销两周再全网铺开"]));
}
/* ============================ 14. 数据质量 ============================ */
function drawQuality(){
  const v=ROWS;
  const checks=[
    {t:"打烊剩余为负",rule:"日结库存 < 0",rows:v.filter(d=>d.cl<0),
     why:"负库存意味着卖出量超过账面可动用量，通常来自漏记出炉或跨店串货未过账。它会同时高估售罄率、低估报废率。"},
    {t:"开店库存为负",rule:"早上库存 < 0",rows:v.filter(d=>d.o<0),why:"上一日的负结存被结转，属同一问题的次日体现。"},
    {t:"售价记为 0",rule:"销售价 = 0",rows:v.filter(d=>d.pr===0),
     why:"多为整条装、赠品与叫货单，销售额恒为 0。做金额分析时须剔除，做件数分析时应保留。"},
    {t:"有销售无价格且有报废",rule:"销售价 = 0 且 报废 > 0",rows:v.filter(d=>d.pr===0&&d.w>0),
     why:"这些行的报废件数无法折算金额，会让报废金额被系统性低估。"},
    {t:"平衡式不成立",rule:"早上+收货+调拨+调整−报废−销售 ≠ 日结",rows:v.filter(d=>d.o+d.rc+d.x+d.a-d.w-d.sl-d.cl!==0),
     why:"若出现，说明存在未入账的损耗类型。本次数据为 0 行，口径干净。"},
    {t:"销售为负",rule:"销售 < 0",rows:v.filter(d=>d.sl<0),why:"退货冲销未与原单抵消，件数与金额都会偏低。"},
    {t:"计划稿与明细口径差",rule:"分区计划表列出但明细表无销售记录",rows:[],n:D.plan.filter(p=>!p.live).length,
     why:"计划稿包含尚未上市与已下架的单品；直接用计划稿的 SKU 数做结构分析会与实际货盘不符。"}
  ];
  const html=checks.map(c=>{const n=c.n!==undefined?c.n:c.rows.length;
    const pct=c.rows.length?F.p1(c.rows.length/v.length):"—";
    const sev=n===0?"good":n>500?"bad":"warnc";
    const sample=c.rows.slice(0,6).map(d=>`<tr><td>${storeName(d.s)}</td><td>${dlabel(d.d)}</td><td style="text-align:left">${D.sku[d.k].n}</td>
      <td>${d.o}</td><td>${d.rc}</td><td>${d.x}</td><td>${d.a}</td><td>${d.w}</td><td>${d.sl}</td><td>${d.cl}</td><td>${d.pr}</td></tr>`).join("");
    return `<div style="border-bottom:1px solid var(--rule2);padding:11px 0">
      <div style="display:flex;gap:12px;align-items:baseline;flex-wrap:wrap"><b style="font-family:var(--serif);font-size:14px">${c.t}</b>
      <span class="${sev}" style="font-weight:600">${F.n(n)} 行${c.rows.length?"（占 "+pct+"）":""}</span>
      <code style="font-size:11px;background:var(--panel2);padding:1px 5px;border-radius:2px">${c.rule}</code>
      ${c.rows.length?`<button class="chip tiny" data-q="${c.t}">查看这 ${F.n(c.rows.length)} 行原始记录</button>`:""}</div>
      <div style="font-size:12.5px;color:var(--ink2);margin-top:5px;max-width:82ch">${c.why}</div>
      ${sample?`<details><summary>快速预览 6 行</summary><table style="margin-top:8px"><thead><tr><th>门店</th><th>日期</th><th style="text-align:left">单品</th><th>早上</th><th>收货</th><th>调拨</th><th>调整</th><th>报废</th><th>销售</th><th>日结</th><th>售价</th></tr></thead><tbody>${sample}</tbody></table></details>`:""}
      </div>`;}).join("");
  d3.select("#c-quality").html(html);
  d3.selectAll("#c-quality [data-q]").on("click",function(){
    const c=checks.find(z=>z.t===this.dataset.q);if(!c)return;
    const ids=new Set(c.rows.map(r=>r.i));
    openDrill({kick:"数据质量下钻",title:c.t,keys:{},pred:o=>ids.has(o.i),global:false,
      note:"判定规则："+c.rule+"（在全部原始记录上执行，不受顶栏筛选影响）"});});
  const bad=checks.filter(c=>(c.n!==undefined?c.n:c.rows.length)>0).length;
  d3.select("#t-dq").text(`${bad} 类口径问题会直接影响结论，其中 ${F.n(v.filter(d=>d.cl<0).length)} 条记录出现了负库存`);
  d3.select("#f-quality").html(tagLine([TAG.m,"全部判定在原始 8,220 行上执行，不受页面筛选影响",
    "负库存行未做剔除，因为剔除会破坏平衡式；建议在源系统修正后重跑"]));
}

<script>
/* ==================== 历史时间轴 ==================== */
function dayAgg(){
  const v=view();
  const by=d3.rollup(v,g=>agg(g),d=>d.d);
  return d3.range(D.days).filter(i=>by.has(i)).map(i=>({i,...by.get(i),
    neg:v.filter(d=>d.d===i&&(d.cl<0||d.o<0)).length}));
}
function drawHistLine(){
  const arr=dayAgg();
  if(!arr.length){blank("#c-histline");return;}
  const W=980,H=300,st=stage("#c-histline",W,H,{t:34,r:56,b:58,l:64}),{iw,ih}=st;
  const x=d3.scaleBand().domain(arr.map(d=>d.i)).range([0,iw]).padding(.34);
  const y=d3.scaleLinear().domain([0,d3.max(arr,d=>d.rev)*1.18]).nice().range([ih,0]);
  const y2=d3.scaleLinear().domain([0,1]).range([ih,0]);
  st.layer("bg").selectAll("rect.evtband").data(arr.filter(d=>HOLIDAY.includes(d.i)),d=>d.i)
    .join("rect").attr("class","evtband").attr("x",d=>x(d.i)-x.step()*.17).attr("y",-26)
    .attr("width",x.step()).attr("height",ih+26);
  gridG(st,y);
  axisG(st,"xax",`translate(0,${ih})`,d3.axisBottom(x).tickFormat(d=>dlabel(d)).tickSize(4));
  axisG(st,"yax",null,d3.axisLeft(y).ticks(5).tickSize(4).tickFormat(F.money));
  axisG(st,"y2ax",`translate(${iw},0)`,d3.axisRight(y2).ticks(5).tickFormat(F.p0));
  st.wipe("ref");
  const R=st.layer("ref");
  R.append("text").attr("class","axt").attr("x",0).attr("y",-30).text("销售额（元）");
  R.append("text").attr("class","axt").attr("x",iw).attr("y",-30).attr("text-anchor","end").text("比率");
  /* 事件轨 */
  const evts=[];
  const hol=arr.filter(d=>HOLIDAY.includes(d.i));
  if(hol.length)evts.push({a:hol[0].i,b:hol[hol.length-1].i,t:"清明假期"});
  const nk=D.sku.map((z,i)=>/黑牛角/.test(z.n)?i:-1).filter(i=>i>=0);
  const nd=view().filter(d=>nk.includes(d.k)&&d.sl>0).map(d=>d.d);
  if(nd.length)evts.push({a:d3.min(nd),b:d3.max(nd),t:"新品黑牛角在架"});
  const badDay=arr.filter(d=>d.neg>0);
  if(badDay.length)evts.push({a:badDay[0].i,b:badDay[badDay.length-1].i,t:"出现负库存记录"});
  const eg=st.layer("fg").selectAll("g.evt").data(evts).join(
    en=>{const n=en.append("g").attr("class","evt");
      n.append("line");n.append("text");return n;},up=>up,ex=>ex.remove());
  eg.each(function(d,i){
    const g2=d3.select(this),y0=-8-i*11;
    g2.select("line").attr("x1",x(d.a)-x.step()*.14).attr("x2",x(d.b)+x.bandwidth()+x.step()*.14)
      .attr("y1",y0).attr("y2",y0).attr("stroke",[C.c2,C.c1,C.c3][i%3]).attr("stroke-dasharray",null).attr("stroke-width",2);
    g2.select("text").attr("x",x(d.a)-x.step()*.14).attr("y",y0-3).attr("fill",[C.c2d,C.c1d,C.c3d][i%3]).text(d.t);});
  const bars=st.layer("mark").selectAll("rect.b").data(arr,d=>d.i).join(
    en=>en.append("rect").attr("class","b m mark").attr("y",ih).attr("height",0).attr("rx",2),
    up=>up,ex=>ex.transition(T(240)).attr("height",0).attr("y",ih).remove());
  bars.attr("fill",SEM.sales).attr("opacity",.88)
    .call(s=>hov(s,d=>tipHTML(dlabel(d.i)+(HOLIDAY.includes(d.i)?"（假期）":""),
      [["销售额",F.yuan(d.rev)],["售罄率",F.p1(sr(d))],["报废率",F.p1(wr(d))],
       ["剩余率",F.p1(cr_(d))],["负库存记录",d.neg+" 条"]])));
  drillable(bars,d=>({kick:"按日期下钻",title:dlabel(d.i),keys:{days:[d.i]}}));
  bars.transition(T()).delay((d,i)=>stagger(i,26)).attr("x",d=>x(d.i)).attr("width",x.bandwidth())
    .attr("y",d=>y(d.rev)).attr("height",d=>ih-y(d.rev));
  const mk=(cls,acc,col,dash)=>{

/* ==================== 未来时间轴：推演模型 ==================== */
function blendedCost(){
  const v=view(),bk=sum(v.filter(d=>D.chans[d.ch]==="厨房烘焙"),d=>d.rev),tot=sum(v,d=>d.rev)||1;
  return (bk*S.costBake+(tot-bk)*S.costBuy)/tot;
}
function fcBase(){
  const v=view(),a=agg(v);
  const sp=splitWH(v);
  const stores=a.stores||1;
  const mw=sp.wk.length?SS.mean(sp.wk):(a.rev/Math.max(a.stores*a.days,1));
  const mh=sp.hd.length?SS.mean(sp.hd):mw*S.fcWeekend;
  const wRatio=a.rev?a.wval/a.rev:0;              // 报废货值 ÷ 销售额
  const wrNow=wr(a);                               // 报废件率
  const cost=blendedCost();
  const cal=futureCalendar(S.fcWeeks*7,S.fcHolidays);
  const rnd=rng(880525);
  const bw=SS.boot(sp.wk.length?sp.wk:[mw],160,rnd), bh=SS.boot(sp.hd.length?sp.hd:[mh],160,rnd);
  const dayMu=d=>d.holiday?mh:(d.weekend?mw*S.fcWeekend:mw);
  const storesAt=w=>stores+S.fcStores*Math.min(1,(w+1)/Math.max(S.fcWeeks,1));
  const weeks=d3.range(S.fcWeeks).map(w=>{
    const ds=cal.filter(d=>d.wk===w);
    const g=Math.pow(1+S.fcGrowth,w+1);
    const base=d3.sum(ds,d=>dayMu(d))*storesAt(w)*g;
    const q=p=>{const iw2=Math.max(0,Math.min(bw.length-1,Math.floor(p*(bw.length-1))));
      const ih2=Math.max(0,Math.min(bh.length-1,Math.floor(p*(bh.length-1))));
      const mw2=bw[iw2],mh2=bh[ih2];
      return d3.sum(ds,d=>d.holiday?mh2:(d.weekend?mw2*S.fcWeekend:mw2))*storesAt(w)*g;};
    return {w,days:ds.length,rev:base,p10:q(.10),p50:q(.50),p90:q(.90),
      hol:ds.filter(d=>d.holiday).length,wknd:ds.filter(d=>d.weekend).length};
  });
  return {weeks,mw,mh,wRatio,wrNow,cost,stores,cal,obs:a};
}
/* 四个动作在每一周的效果，全部相对基线 */

  const B=fcBase(),arr=skuMemo();
  const tot=d3.sum(arr,d=>d.rev)||1,totW=d3.sum(arr,d=>d.wval)||1;
  const tail=arr.filter(d=>d.perStoreDay<S.fcTail);
  const tailRev=d3.sum(tail,d=>d.rev)/tot, tailW=d3.sum(tail,d=>d.wval)/Math.max(totW,1);

/* ---- 缺货截断校正：Kaplan–Meier 生存估计 ---- */
/* obs: [{v:观测销量, cens:是否被缺货截断}]，截断点视为「真实需求 ≥ v」的右截断观测 */
function kmFit(obs){
  const n=obs.length;
  if(!n)return null;
  const ts=Array.from(new Set(obs.filter(o=>!o.cens).map(o=>o.v))).sort(d3.ascending);
  let S2=1;const steps=[{t:0,S:1}];
  ts.forEach(t=>{
    const risk=obs.filter(o=>o.v>=t).length;
    const ev=obs.filter(o=>!o.cens&&o.v===t).length;
    if(risk>0){S2*=(1-ev/risk);steps.push({t,S:S2});}
  });
  const maxObs=d3.max(obs,o=>o.v);
  const tailMass=S2;                       // 最大观测之上未被识别的概率质量
  const rmean=(()=>{                       // 受限均值：只积分到最大观测值
    let m=0;for(let i=1;i<steps.length;i++)m+=steps[i].t*(steps[i-1].S-steps[i].S);
    return m+maxObs*tailMass;})();          // 尾部按最大观测值兜底，属保守下界
  const q=p=>{
    for(let i=1;i<steps.length;i++)if(1-steps[i].S>=p)return steps[i].t;
    return maxObs*(1+Math.min(tailMass,0.5)); // 分位未被识别时给出下界外推，并在界面标注
  };
  return {steps,rmean,q,tailMass,identified:p=>1-S2>=p,maxObs,n};
}
function skuObs(g){
  const per=Array.from(d3.rollup(g,gg=>({sl:sum(gg,d=>d.sl),av:sum(gg,d=>d.avail),
    w:sum(gg,d=>d.w),cl:sum(gg,d=>d.cl)}),d=>d.s+"|"+d.d).values());
  return per.map(o=>({v:o.sl,cens:o.cl<=0&&o.w===0&&o.sl>0}));
}
function censorStats(){
  const v=view().filter(d=>D.chans[d.ch]==="厨房烘焙");
  const {cr}=nvCritical(),p=Math.min(cr,0.99);
  const rows=[];let nC=0,nAll=0;
  d3.group(v,d=>d.k).forEach((g,k)=>{
    const obs=skuObs(g);
    if(obs.length<4)return;
    const c=obs.filter(o=>o.cens).length;
    nC+=c;nAll+=obs.length;
    const raw=obs.map(o=>o.v).sort(d3.ascending);
    const km=kmFit(obs);
    if(!km)return;
    const qRaw=d3.quantileSorted(raw,p), qKM=km.q(p);
    rows.push({k,n:obs.length,cens:c,share:c/obs.length,mRaw:d3.mean(raw),mKM:km.rmean,
      qRaw,qKM,lift:qRaw>0?(qKM-qRaw)/qRaw:0,ident:km.identified(p),tail:km.tailMass,
      rev:sum(g,d=>d.rev)});
  });
  rows.sort((a,b)=>b.rev-a.rev);
  const mRaw=d3.sum(rows,d=>d.mRaw*d.n),mKM=d3.sum(rows,d=>d.mKM*d.n);
  return {rows,share:nAll?nC/nAll:0,nC,nAll,p,
    uplift:mRaw?(mKM-mRaw)/mRaw:0,
    qUplift:d3.sum(rows,d=>d.qRaw)?(d3.sum(rows,d=>d.qKM)-d3.sum(rows,d=>d.qRaw))/d3.sum(rows,d=>d.qRaw):0,
    unident:rows.filter(d=>!d.ident).length};
}

      .call(s2=>drillable(s2,()=>({kick:"缺货截断下钻",title:skuName(d.k)+" · 被截断的观测点",
        keys:{skus:[d.k]},pred:o=>o.cl<=0&&o.w===0&&o.sl>0,

  });
  legend("#l-simcen",[{c:C.c2,t:"校正增量（分位可识别）"},{c:C.c3m,t:"校正增量（分位不可识别，取下界）"},
    {c:C.ink4,t:"校正前建议出炉量"},{c:C.c3,shape:"dash",t:"上调幅度中位数"}],

  d3.select("#f-simcen").html(tagLine([TAG.m,TAG.d,TAG.e,

  const spread=(d3.max(wrs)||0)-(d3.min(wrs)||0);

  const tot=d3.sum(arr,d=>d.rev)||1;
  const sorted=arr.slice().sort((x,y)=>y.rev-x.rev);let c=0,n80=0;
  for(const d of sorted){c+=d.rev;n80++;if(c/tot>=0.8)break;}
  const tail=arr.filter(d=>d.perStoreDay<1);
  const dough=Array.from(d3.group(v.filter(d=>D.chans[d.ch]==="厨房烘焙"),d=>D.sku[d.k].d),
    ([dg,g])=>({dg,sk:new Set(g.map(d=>d.k)).size,sl:sum(g,d=>d.sl)}));
  return {a,arr,A,Bc,Cc,B,base,R,gap,gapScaled:gap*scale,spread,scale,best,n80,tail,dough,
    gA:fcSum(A.out,"gp")-base,gB:fcSum(Bc.out,"gp")-base,gC:fcSum(Cc.out,"gp")-base};
}

<script>
/* ==================== 1. 百件去向：单元格图 ==================== */
function waffleCells(a,n){
  const tot=a.avail||1;
  const raw=[{k:"卖给顾客",v:a.sales/tot,c:SEM.sales,p:o=>o.sl>0},
    {k:"当天报废",v:a.waste/tot,c:SEM.waste,p:o=>o.w>0},
    {k:"留到隔天",v:a.close/tot,c:SEM.left,p:o=>o.cl>0}];
  const base=raw.map(d=>({...d,n:Math.floor(d.v*n),rem:d.v*n-Math.floor(d.v*n)}));
  let left=n-d3.sum(base,d=>d.n);
  base.slice().sort((x,y)=>y.rem-x.rem).forEach(d=>{if(left>0){d.n++;left--;}});
  const cells=[];base.forEach(d=>{for(let i=0;i<d.n;i++)cells.push(d);});
  return {cells:cells.slice(0,n),legend:base};
}

    .call(s=>hov(s,d=>tipHTML(regName(d.r)+" · "+d.k,[["占该区可动用",F.p1(d.v)]])))
    .call(s=>drillable(s,d=>({kick:"按区域 × 去向下钻",title:regName(d.r)+" · "+d.k,keys:{regions:[d.r]},pred:d.p})))
    .transition(T()).attr("x",d=>d.x).attr("y",d=>d.y).attr("width",s2).attr("height",s2).attr("opacity",.94);
  regs.forEach((R,j)=>{

/* ==================== 2. 假日弹性：斜率图 ==================== */
function drawSlope(){
  const v=view();

    d3.select("#f-slope").html(tagLine([TAG.m,"需要同时包含平日与假日记录"]));return;}
  const per=(rows,days)=>{const m=d3.rollup(rows,g=>sum(g,d=>d.rev),d=>d.s+"|"+d.d);

  pointerNearest(st,pts.slice(1),d=>x(d.x),d=>y(d.y),{maxDist:9999,

    leave:()=>ring.attr("opacity",0),

    {c:C.c2,t:"两者之间的面积 = 集中度"}],"点击曲线上任意一点下钻到该单品");

/* ==================== 4. 门店分群：相似度矩阵 ==================== */
function storeSim(){
  const v=view().filter(d=>D.chans[d.ch]==="厨房烘焙");
  const stores=Array.from(new Set(v.map(d=>d.s))).sort(d3.ascending);
  const byS=d3.rollup(v,g=>sum(g,d=>d.rev),d=>d.s,d=>d.k);
  const vecs=stores.map(s=>{const m=byS.get(s)||new Map();
    const tot=d3.sum(Array.from(m.values()))||1;
    return {s,m,tot};});
  const cos=(A,B)=>{let dot=0,na=0,nb=0;
    A.m.forEach((val,k)=>{const a=val/A.tot;na+=a*a;const b=(B.m.get(k)||0)/B.tot;dot+=a*b;});
    B.m.forEach(val=>{const b=val/B.tot;nb+=b*b;});
    return (na&&nb)?dot/Math.sqrt(na*nb):0;};
  const n=stores.length,M=[];
  for(let i=0;i<n;i++){M[i]=[];for(let j=0;j<n;j++)M[i][j]=i===j?1:(j<i?M[j][i]:cos(vecs[i],vecs[j]));}
  /* 平均连接层次聚类 */
  let clus=stores.map((s,i)=>({ids:[i],members:[s]}));
  const dist=(A,B)=>{let sm=0;A.ids.forEach(a=>B.ids.forEach(b=>sm+=1-M[a][b]));return sm/(A.ids.length*B.ids.length);};
  const merges=[];
  while(clus.length>1){
    let bi=0,bj=1,bd=Infinity;
    for(let i=0;i<clus.length;i++)for(let j=i+1;j<clus.length;j++){const d=dist(clus[i],clus[j]);
      if(d<bd){bd=d;bi=i;bj=j;}}
    merges.push({a:clus[bi],b:clus[bj],d:bd});
    const nc={ids:clus[bi].ids.concat(clus[bj].ids),members:clus[bi].members.concat(clus[bj].members)};
    clus=clus.filter((_,i)=>i!==bi&&i!==bj).concat([nc]);
  }
  /* 按 k 切分 */
  const k=Math.min(Math.max(S.simK||3,1),Math.max(n,1));
  let cut=stores.map((s,i)=>({ids:[i],members:[s]}));
  merges.slice(0,Math.max(n-k,0)).forEach(mg=>{
    const ai=cut.findIndex(c=>c.ids.includes(mg.a.ids[0])),bi2=cut.findIndex(c=>c.ids.includes(mg.b.ids[0]));
    if(ai<0||bi2<0||ai===bi2)return;
    const nc={ids:cut[ai].ids.concat(cut[bi2].ids),members:cut[ai].members.concat(cut[bi2].members)};
    cut=cut.filter((_,i)=>i!==ai&&i!==bi2).concat([nc]);});
  cut.sort((a,b)=>b.ids.length-a.ids.length);
  const order=[];cut.forEach((c,ci)=>c.ids.forEach(i=>order.push({i,ci})));
  return {stores,M,order,cut,n};
}

/* ==================== 5. 价格弹性 ==================== */

  const RF=st.layer("ref");

    .attr("x2",x(xs[1])).attr("y2",y(Math.exp(a0+b*Math.log(xs[1]))));
  const dots=st.layer("mark").selectAll("circle.e").data(arr,d=>d.k).join(

    up=>up,ex=>ex.transition(T(240)).attr("r",0).remove());
  dots.attr("fill",d=>CATCOLOR(D.cats[d.cat])).attr("opacity",.8).attr("data-hl",d=>"c"+d.cat)

    en=>en.append("circle").attr("class","focusdot").attr("fill","none").attr("stroke",C.ink).attr("stroke-width",1.5).attr("opacity",0));
  pointerNearest(st,arr,d=>x(d.price),d=>y(d.rate),{maxDist:50,
    move:(ev,d)=>{ring.attr("cx",x(d.price)).attr("cy",y(d.rate)).attr("r",rr(d.rev)+4).attr("opacity",1).raise();
