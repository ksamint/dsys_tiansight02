<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>烘焙门店进销存决策台 · 多门店经营看板</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/d3/7.8.5/d3.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/simple-statistics/7.8.3/simple-statistics.min.js"></script>
<style>
/* ============ 设计令牌：全站唯一色源 ============ */
:root{
  --paper:#EDEFEA; --panel:#FFFFFF; --panel2:#F6F7F3; --panel3:#EEF0EA;
  --ink:#141C19; --ink2:#4A554E; --ink3:#7B857E; --ink4:#A3ABA5;
  --rule:#D3D8CE; --rule2:#E6E9E1; --rule3:#F0F2EC;
  --c1:#2F6F5E; --c1d:#1E5245; --c1m:#5D9C8B; --c1l:#B7D2C9; --c1w:#E9F2EE;
  --c2:#C08A1E; --c2d:#8E6414; --c2m:#D8AF5C; --c2l:#EBD6A6; --c2w:#FAF3E3;
  --c3:#9E3324; --c3d:#742318; --c3m:#C4664F; --c3l:#E3B7AC; --c3w:#FBEEEA;
  --c4:#3B5C7A; --c4d:#2A4257; --c4m:#7191AC; --c4l:#C0CFDC; --c4w:#EDF2F6;
  --c5:#7C4A66; --c5d:#5B3349; --c5m:#A87C95; --c5l:#D9C2CE; --c5w:#F6EFF3;
  --ok:var(--c1); --warn:var(--c2); --bad:var(--c3); --info:var(--c4);
  --shadow:0 1px 2px rgba(20,28,25,.05); --shadow2:0 8px 30px rgba(20,28,25,.14);
  --serif:"Songti SC","STSong","Noto Serif SC","Source Han Serif SC","SimSun",serif;
  --sans:"PingFang SC","Hiragino Sans GB","Microsoft YaHei","Noto Sans SC",-apple-system,system-ui,sans-serif;
  --mono:ui-monospace,"SF Mono",Menlo,Consolas,monospace;
  --rail:206px;
}
*{box-sizing:border-box}
html,body{margin:0;padding:0;height:100%}
body{background:var(--paper);color:var(--ink);font-family:var(--sans);font-size:13.5px;line-height:1.6;
  -webkit-font-smoothing:antialiased;font-variant-numeric:tabular-nums;overflow:hidden}
h1,h2,h3,h4{font-family:var(--serif);font-weight:600;letter-spacing:.01em;margin:0;text-wrap:balance}
a{color:var(--c1);text-decoration:none}
a:hover{text-decoration:underline}
.wrap{display:grid;grid-template-columns:var(--rail) minmax(0,1fr);height:100vh}

/* ============ 左侧导航 ============ */
nav{background:var(--panel);border-right:1px solid var(--rule);display:flex;flex-direction:column;overflow:hidden}
nav .brand{padding:11px 16px 9px;border-bottom:1px solid var(--rule2)}
nav .brand b{font-size:10px;display:block;line-height:1.35;letter-spacing:.14em;color:var(--ink4);font-family:var(--sans);font-weight:400}
nav .brand span{color:var(--ink3);font-size:10.5px;display:block;margin-top:4px;line-height:1.5}
nav .scroller{flex:1;overflow-y:auto;padding:6px 0 24px}
nav ol{list-style:none;margin:0;padding:0}
nav .grp{padding:12px 16px 4px;font-size:10px;color:var(--ink4);letter-spacing:.1em}
nav li button{display:flex;gap:8px;align-items:baseline;width:100%;text-align:left;background:none;border:0;
  padding:5px 16px;color:var(--ink2);font-size:12.5px;font-family:var(--sans);cursor:pointer;border-left:2px solid transparent}
nav li button i{font-style:normal;color:var(--ink4);font-size:10.5px;min-width:14px}
nav li button:hover{background:var(--panel2);color:var(--ink)}
nav li button.on{border-left-color:var(--c1);color:var(--c1);background:var(--c1w);font-weight:600}
nav li button.on i{color:var(--c1m)}

/* ============ 顶栏 ============ */
.shell{display:flex;flex-direction:column;overflow:hidden;height:100vh}
.filters{background:var(--panel);border-bottom:1px solid var(--rule);padding:7px 20px;
  display:flex;gap:14px;align-items:center;flex-wrap:wrap;flex:0 0 auto;row-gap:6px}
.fgrp{display:flex;gap:4px;align-items:center}
.fgrp>label{font-size:10.5px;color:var(--ink4);margin-right:2px;letter-spacing:.04em}
.chip{border:1px solid var(--rule);background:var(--panel);color:var(--ink2);border-radius:2px;
  padding:2px 8px;font-size:11.5px;cursor:pointer;font-family:var(--sans);line-height:1.55;white-space:nowrap}
.chip:hover{border-color:var(--c1m);color:var(--ink)}
.chip.on{background:var(--c1);border-color:var(--c1);color:#fff}
.chip.tiny{padding:1px 6px;font-size:11px}
select.chip{padding:2px 5px;max-width:190px}
.fspacer{flex:1}
.fnote{font-size:11px;color:var(--ink3)}
.fnote b{color:var(--ink);font-weight:600}
#navtoggle{display:none}
.crumbs{display:flex;gap:5px;align-items:center;flex-wrap:wrap;padding:5px 20px;background:var(--panel2);
  border-bottom:1px solid var(--rule2);flex:0 0 auto;font-size:11px;color:var(--ink3);min-height:29px}
.crumbs.off{display:none}
.crumb{display:inline-flex;gap:5px;align-items:center;background:var(--panel);border:1px solid var(--c1l);
  color:var(--c1d);border-radius:2px;padding:1px 4px 1px 7px;font-size:11px}
.crumb b{font-weight:600}
.crumb x{cursor:pointer;color:var(--c1m);font-style:normal;padding:0 3px;font-size:12px;line-height:1}
.crumb x:hover{color:var(--c3)}

/* ============ 看板 ============ */
main{flex:1;overflow-y:auto;padding:0 20px 60px}
.board{display:none}
.board.on{display:block}
.bhead{position:sticky;top:0;z-index:20;background:var(--paper);display:flex;align-items:center;
  gap:10px 14px;flex-wrap:wrap;padding:9px 0 8px;margin-bottom:0;box-shadow:0 6px 8px -8px rgba(20,28,25,.18)}
.bhead .htxt{flex:1 1 420px;min-width:260px;display:flex;align-items:center;gap:8px;min-height:26px}
.bhead .kick{flex:0 0 auto;font-size:10.5px;letter-spacing:.1em;color:var(--ink4);white-space:nowrap}
.bhead h2{flex:1 1 auto;font-size:16px;line-height:1.38;position:relative;padding-left:11px;margin:0;
  max-width:none;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.bhead h2:before{content:"";position:absolute;left:0;top:3px;bottom:3px;width:3px;background:var(--c1);border-radius:2px}
.bhead .info{flex:0 0 auto;width:19px;height:19px;border-radius:50%;border:1px solid var(--rule);
  background:var(--panel);color:var(--ink3);font-size:11px;line-height:1;cursor:pointer;font-family:var(--sans)}
.bhead .info:hover{border-color:var(--c1m);color:var(--c1)}
.bhead .info.on{background:var(--c1);border-color:var(--c1);color:#fff}
.bdesc{position:fixed;z-index:660;display:none;background:var(--panel);border:1px solid var(--rule);
  border-radius:5px;box-shadow:var(--shadow2);padding:12px 14px;max-width:min(620px,90vw);
  font-size:12.5px;line-height:1.7;color:var(--ink2);animation:palIn .14s cubic-bezier(.2,.9,.3,1) both}
.bdesc.on{display:block}
.bdesc .dh{font-size:10.5px;letter-spacing:.1em;color:var(--ink4);margin-bottom:5px}
.bdesc .meta{margin-top:8px;padding-top:7px;border-top:1px dashed var(--rule);font-size:11px;color:var(--ink3)}
.tabs{border-bottom:0;gap:3px;align-items:center;background:var(--panel3);padding:3px;border-radius:5px;
  display:inline-flex;margin-top:0;border:1px solid var(--rule2);flex:0 0 auto;flex-wrap:nowrap;overflow-x:auto;max-width:100%}
.view{display:none;padding-top:12px}
.view.on{display:block}

/* ============ 面板 ============ */
.panel{background:var(--panel);border:1px solid var(--rule);border-radius:3px;padding:0;box-shadow:var(--shadow);overflow:hidden}
.panel+.panel{margin-top:12px}
.phead{display:flex;align-items:flex-start;gap:12px;padding:9px 13px 8px;border-bottom:1px solid var(--rule3)}
.phead .pt{flex:1;min-width:0}
.ptitle{font-family:var(--serif);font-size:14px;line-height:1.4}
.psub{font-size:11.5px;color:var(--ink3);margin-top:2px;line-height:1.5;
  display:-webkit-box;-webkit-line-clamp:1;-webkit-box-orient:vertical;overflow:hidden}
.pacts{display:flex;gap:4px;align-items:center;flex:0 0 auto}
.pbody{padding:10px 13px 11px}
.pbody.tight{padding:8px 10px 10px}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.grid3{display:grid;grid-template-columns:repeat(3,1fr);gap:12px}
.grid23{display:grid;grid-template-columns:1.85fr 1fr;gap:12px}
.grid32{display:grid;grid-template-columns:1fr 1.85fr;gap:12px}
@media(max-width:1180px){.grid2,.grid3,.grid23,.grid32{grid-template-columns:1fr}}

/* ============ KPI ============ */
.kpis{display:grid;grid-template-columns:repeat(6,1fr);background:var(--panel);border:1px solid var(--rule);border-radius:3px;box-shadow:var(--shadow)}
.kpi{padding:11px 13px;border-right:1px solid var(--rule3);cursor:pointer;position:relative}
.kpi:last-child{border-right:0}
.kpi:hover{background:var(--panel2)}
.kpi .k{font-size:11px;color:var(--ink3);line-height:1.4;min-height:2.7em}
.kpi .v{font-family:var(--serif);font-size:23px;line-height:1.15;margin-top:4px}
.kpi .v small{font-size:12px;color:var(--ink2);font-family:var(--sans);margin-left:2px;font-weight:400}
.kpi .d{font-size:10.5px;color:var(--ink3);margin-top:3px}
.kpi.acc-1{box-shadow:inset 3px 0 0 var(--c1)}.kpi.acc-2{box-shadow:inset 3px 0 0 var(--c2)}
.kpi.acc-3{box-shadow:inset 3px 0 0 var(--c3)}.kpi.acc-4{box-shadow:inset 3px 0 0 var(--c4)}
.kpi.acc-5{box-shadow:inset 3px 0 0 var(--c5)}
@media(max-width:1180px){.kpis{grid-template-columns:repeat(3,1fr)}.kpi{border-bottom:1px solid var(--rule3)}}

/* ============ 图注与脚注 ============ */
.lgd{display:flex;gap:12px;flex-wrap:wrap;font-size:11px;color:var(--ink2);margin:0 0 8px;align-items:center}
.lgd .li{display:inline-flex;gap:5px;align-items:center;white-space:nowrap}
.lgd i{width:10px;height:10px;display:inline-block;border-radius:2px;flex:0 0 auto}
.lgd i.line{height:0;width:14px;border-top:2px solid;border-radius:0}
.lgd i.dash{height:0;width:14px;border-top:1.5px dashed;border-radius:0}
.lgd i.dot{border-radius:50%;width:9px;height:9px}
.lgd .sep{color:var(--ink4)}
.lgd .ramp b{display:inline-block;width:56px;height:9px;border-radius:2px;font-size:0;vertical-align:-1px}
.usage{margin:8px 13px 0;padding-top:7px;border-top:1px dashed var(--rule2);
  font-size:11px;color:var(--ink2);line-height:1.75;display:flex;flex-wrap:wrap;gap:4px 8px;align-items:baseline}
.usage .ub{font-size:9.5px;letter-spacing:.06em;padding:0 5px;border-radius:2px;line-height:1.7;flex:0 0 auto}
.usage .ub.d{background:var(--c1w);color:var(--c1d);border:1px solid var(--c1l)}
.usage .ub.c{background:var(--c4w);color:var(--c4d);border:1px solid var(--c4l)}
.usage .ub.p{background:var(--c2w);color:var(--c2d);border:1px solid var(--c2l)}
body.viz .usage{display:none}
body.compact .usage{display:none}
.formula{margin:10px 14px 12px;padding-top:8px;border-top:1px dashed var(--rule);font-size:11px;color:var(--ink3);line-height:1.65}
.formula b{color:var(--ink2);font-weight:600}
.formula code{font-family:var(--mono);background:var(--panel2);padding:1px 4px;border-radius:2px;font-size:10.5px;color:var(--ink2)}
.tag{display:inline-block;font-size:10px;padding:0 5px;border-radius:2px;border:1px solid;line-height:1.6;vertical-align:1px}
.tag.meas{color:var(--c1d);border-color:var(--c1l);background:var(--c1w)}
.tag.des{color:var(--c2d);border-color:var(--c2l);background:var(--c2w)}
.tag.ext{color:var(--c4d);border-color:var(--c4l);background:var(--c4w)}
.hint{font-size:10.5px;color:var(--ink4);display:inline-flex;gap:4px;align-items:center}
.hint:before{content:"";width:5px;height:5px;border-radius:50%;background:var(--c1m)}

/* ============ 表 ============ */
table{border-collapse:collapse;width:100%;font-size:12px}
th{text-align:right;font-weight:600;color:var(--ink2);border-bottom:1px solid var(--rule);padding:5px 7px;
  white-space:nowrap;font-size:11px;position:sticky;top:0;background:var(--panel);z-index:2}
th.sortable{cursor:pointer;user-select:none}
th.sortable:hover{color:var(--c1)}
th.sortable:after{content:" ⇅";color:var(--ink4);font-size:9px}
th.sortable.asc:after{content:" ↑";color:var(--c1)}
th.sortable.desc:after{content:" ↓";color:var(--c1)}
th:first-child,td:first-child{text-align:left}
td{border-bottom:1px solid var(--rule3);padding:4px 7px;text-align:right;white-space:nowrap}
tbody tr:hover{background:var(--panel2)}
tbody tr.drillable{cursor:pointer}
tbody tr.drillable:hover{background:var(--c1w);box-shadow:inset 2px 0 0 var(--c1m)}
.scroll{max-height:430px;overflow:auto}
.scroll.tall{max-height:620px}
.bad{color:var(--bad)}.good{color:var(--ok)}.warnc{color:var(--c2d)}.muted{color:var(--ink4)}
.bar-cell{position:relative}
.bar-cell i{position:absolute;left:0;top:2px;bottom:2px;background:var(--c1w);z-index:0;display:block;border-radius:1px}
.bar-cell i.w{background:var(--c3w)}
.bar-cell span{position:relative;z-index:1}
.pill{display:inline-block;font-size:10px;padding:0 5px;border-radius:8px;line-height:1.65;border:1px solid}
.pill.a{background:var(--c1w);border-color:var(--c1l);color:var(--c1d)}
.pill.b{background:var(--c2w);border-color:var(--c2l);color:var(--c2d)}
.pill.c{background:var(--c3w);border-color:var(--c3l);color:var(--c3d)}
.pill.n{background:var(--panel2);border-color:var(--rule);color:var(--ink3)}

/* ============ 图 ============ */
svg{display:block;max-width:100%;overflow:visible}
.ax text{font-size:10.5px;fill:var(--ink3);font-family:var(--sans)}
.ax line,.ax path,.ax .domain{stroke:var(--rule)}
.gl line{stroke:var(--rule3)}
.axt{font-size:10px;fill:var(--ink4);font-family:var(--sans);letter-spacing:.03em}
.vlab{font-size:10px;fill:var(--ink2);font-family:var(--sans)}
.refl{stroke-dasharray:4 3;stroke-width:1}
.reft{font-size:9.5px;font-family:var(--sans)}
.mark{cursor:pointer}
.mark:hover{filter:brightness(1.08)}
.tip{position:fixed;pointer-events:none;background:var(--ink);color:#fff;padding:7px 9px;border-radius:3px;
  font-size:11.5px;line-height:1.6;z-index:999;opacity:0;transition:opacity .1s;max-width:300px;box-shadow:var(--shadow2)}
.tip b{color:#fff;font-weight:600}
.tip table{width:100%;font-size:11px;margin-top:4px;border:0}
.tip td{border:0;padding:1px 0;color:#E7EBE8;white-space:nowrap;text-align:right}
.tip td:first-child{color:#AEB9B2;padding-right:12px;text-align:left}
.tip .dr{margin-top:5px;padding-top:4px;border-top:1px solid rgba(255,255,255,.18);color:#9FC6B9;font-size:10px}
.blank{padding:30px 12px;text-align:center;color:var(--ink4);font-size:12px;border:1px dashed var(--rule);
  border-radius:3px;background:var(--panel2)}

/* ============ 方案卡 ============ */
.opts{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
@media(max-width:1180px){.opts{grid-template-columns:1fr}}
.opt{border:1px solid var(--rule);border-radius:3px;padding:12px 13px;background:var(--panel2)}
.opt h4{font-size:13px;margin-bottom:5px}
.opt .lab{font-size:10.5px;color:var(--ink4);margin-bottom:4px;letter-spacing:.05em}
.opt ul{margin:6px 0 0;padding-left:15px;font-size:12px;color:var(--ink2);line-height:1.75}
.opt .tradeoff{margin-top:8px;padding-top:7px;border-top:1px dashed var(--rule);font-size:11px;color:var(--ink3)}
.opt.pick{background:var(--c1w);border-color:var(--c1m)}

/* ============ 控件 ============ */
.ctrl{display:flex;gap:14px;align-items:center;flex-wrap:wrap;margin-bottom:10px;font-size:11.5px;color:var(--ink2);
  padding:7px 9px;background:var(--panel2);border:1px solid var(--rule2);border-radius:2px}
.ctrl label{display:flex;gap:6px;align-items:center}
.ctrl .cg{font-size:10.5px;color:var(--ink4);letter-spacing:.04em}
input[type=range]{width:118px;accent-color:var(--c1)}
input[type=number],input[type=text],input[type=search]{border:1px solid var(--rule);border-radius:2px;padding:3px 6px;
  font-family:var(--sans);font-size:12px;background:var(--panel);color:var(--ink)}
input[type=search]{width:230px}
.val{font-variant-numeric:tabular-nums;color:var(--ink);font-weight:600;min-width:42px;display:inline-block}
details{border-top:1px solid var(--rule3);padding-top:8px;margin-top:10px}
summary{cursor:pointer;font-size:11.5px;color:var(--c1);list-style:none}
summary::-webkit-details-marker{display:none}
summary:before{content:"▸ ";color:var(--ink4)}
details[open] summary:before{content:"▾ "}
ul.plain{margin:6px 0 0;padding-left:16px;font-size:12px;color:var(--ink2);line-height:1.8}
.warnbox{border-left:3px solid var(--c2);background:var(--c2w);padding:9px 12px;font-size:12px;color:var(--c2d);border-radius:2px;margin-top:10px}
.badbox{border-left:3px solid var(--c3);background:var(--c3w);padding:9px 12px;font-size:12px;color:var(--c3d);border-radius:2px;margin-top:10px}
.okbox{border-left:3px solid var(--c1);background:var(--c1w);padding:9px 12px;font-size:12px;color:var(--c1d);border-radius:2px;margin-top:10px}
.foot{border-top:1px solid var(--rule);padding-top:14px;margin-top:26px;font-size:11px;color:var(--ink3);line-height:1.8}


/* ============ 动效与交互 ============ */
@media (prefers-reduced-motion: reduce){*{animation-duration:.01ms !important;transition-duration:.01ms !important}}
.view.on{animation:viewIn .34s cubic-bezier(.22,.9,.3,1) both}
@keyframes viewIn{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}
.board.on .bhead h2{animation:headIn .4s cubic-bezier(.22,.9,.3,1) both}
@keyframes headIn{from{opacity:0;transform:translateY(-4px)}to{opacity:1;transform:none}}
.panel{transition:box-shadow .18s ease,border-color .18s ease}
.panel:hover{box-shadow:0 2px 10px rgba(20,28,25,.07)}
.mark{transition:opacity .18s ease}
.mark:hover{filter:none}
.dim{opacity:.16 !important}
.lgd .li{cursor:default;border-radius:3px;padding:1px 3px;transition:background .15s ease}
.lgd .li.hot{cursor:pointer}
.lgd .li.hot:hover{background:var(--panel3)}
.tip{transition:opacity .12s ease,transform .12s cubic-bezier(.2,.9,.3,1)}
.tab{transition:color .16s ease,border-color .16s ease}
.chip{transition:background .15s ease,border-color .15s ease,color .15s ease}
button:focus-visible,select:focus-visible,input:focus-visible,[tabindex]:focus-visible{outline:2px solid var(--c1m);outline-offset:1px;border-radius:2px}
.crosshair{stroke:var(--ink4);stroke-width:1;stroke-dasharray:3 3;pointer-events:none}
.focusdot{pointer-events:none}
.brushrail .selection{fill:var(--c1);fill-opacity:.14;stroke:var(--c1);stroke-width:1}
.brushrail .handle{fill:var(--c1);rx:1}
.brushrail rect.track{fill:var(--panel3)}
.brushrail text{font-size:9.5px;fill:var(--ink4)}
.railhint{font-size:9.5px;fill:var(--ink4)}
/* 抽屉：路径面包屑与迷你图 */
.dcrumb{display:flex;gap:5px;align-items:center;flex-wrap:wrap;padding:7px 18px 0;font-size:11px;color:var(--ink3)}
.dcrumb button{border:0;background:none;color:var(--c1);cursor:pointer;font-size:11px;font-family:var(--sans);padding:0}
.dcrumb button:hover{text-decoration:underline}
.dcrumb i{font-style:normal;color:var(--ink4)}
.dcrumb .cur{color:var(--ink);font-weight:600}
.dmini{padding:10px 16px 2px;border-bottom:1px solid var(--rule3)}
.dmini .t{font-size:10.5px;color:var(--ink4);margin-bottom:3px}
.dkpi .v{transition:color .2s ease}
.skel{background:linear-gradient(90deg,var(--panel2) 25%,var(--panel3) 37%,var(--panel2) 63%);
  background-size:400% 100%;animation:shimmer 1.1s linear infinite;border-radius:3px;height:12px;margin:7px 0}
@keyframes shimmer{from{background-position:100% 0}to{background-position:0 0}}
.kpi{transition:background .15s ease,box-shadow .15s ease}
.kpi:after{content:"";position:absolute;left:0;right:0;bottom:0;height:2px;background:var(--c1m);
  transform:scaleX(0);transform-origin:left;transition:transform .22s ease}
.kpi:hover:after{transform:scaleX(1)}
tbody tr.drillable{transition:background .14s ease,box-shadow .14s ease}
.drawer{will-change:transform}
.hitpad{cursor:crosshair}

/* ============ 时间轴 ============ */
.evt line{stroke:var(--ink4);stroke-dasharray:2 2}
.evt text{font-size:9.5px;fill:var(--ink3)}
.evtband{fill:var(--c2w)}
.fan0{fill:var(--c1);opacity:.10}
.fan1{fill:var(--c1);opacity:.18}
.scnA{stroke:var(--c1)}.scnB{stroke:var(--c4)}.scnC{stroke:var(--c5)}
.nowline{stroke:var(--ink);stroke-width:1.4}
.nowtag{font-size:10px;fill:var(--ink);font-weight:600}
.stepbox{border:1px solid var(--rule);border-radius:3px;padding:9px 11px;background:var(--panel2);font-size:11.5px}
.stepbox b{display:block;font-family:var(--serif);font-size:12.5px;margin-bottom:3px;color:var(--ink)}
.flowgrid{display:grid;grid-template-columns:repeat(5,1fr);gap:8px;align-items:stretch}
@media(max-width:1180px){.flowgrid{grid-template-columns:1fr}}
.assump{font-size:11.5px}
.assump td:first-child{white-space:normal}


/* ============ 顶部指挥条 ============ */
.topbar{background:var(--ink);color:#EDEFEA;display:flex;align-items:center;gap:14px;row-gap:6px;
  padding:6px 16px;min-height:50px;flex:0 0 auto;position:relative;z-index:60;flex-wrap:wrap}
.topbar .brandmark{display:flex;align-items:center;gap:9px;flex:0 0 auto;padding-right:14px;
  border-right:1px solid rgba(237,239,234,.16)}
.topbar .glyph{width:26px;height:26px;border-radius:4px;background:linear-gradient(140deg,var(--c1m),var(--c1d));
  display:flex;align-items:center;justify-content:center;font-family:var(--serif);font-size:14px;color:#fff;
  box-shadow:0 1px 0 rgba(255,255,255,.18) inset}
.topbar .bt{line-height:1.2}
.topbar .bt b{font-family:var(--serif);font-size:13.5px;color:#F4F6F1;display:block;letter-spacing:.02em}
.topbar .bt span{font-size:10px;color:#8F9A92;letter-spacing:.06em}
/* 口径胶囊 */
.scope{display:flex;align-items:center;gap:6px;flex:1 1 auto;min-width:0;flex-wrap:wrap;overflow:visible}
.scopebtn{position:relative;display:inline-flex;align-items:center;gap:6px;background:rgba(237,239,234,.07);
  border:1px solid rgba(237,239,234,.14);color:#DDE3DD;border-radius:14px;padding:3px 11px 3px 10px;
  font-size:11.5px;font-family:var(--sans);cursor:pointer;white-space:nowrap;transition:background .15s,border-color .15s}
.scopebtn:hover{background:rgba(237,239,234,.13);border-color:rgba(237,239,234,.3)}
.scopebtn.act{background:var(--c1m);border-color:var(--c1m);color:#0E1A16;font-weight:600}
.scopebtn i{font-style:normal;font-size:9.5px;opacity:.7}
.scopebtn em{font-style:normal;font-size:10px;opacity:.62}
.scopesep{color:rgba(237,239,234,.22);font-size:11px;flex:0 0 auto}
.scopeitem{position:relative;flex:0 0 auto;display:inline-flex}
/* 弹出层 */
.pop{position:fixed;background:var(--panel);border:1px solid var(--rule);
  border-radius:5px;box-shadow:var(--shadow2);padding:10px 12px;display:none;z-index:660;min-width:236px;
  max-width:min(560px,88vw);animation:palIn .14s cubic-bezier(.2,.9,.3,1) both}
.pop.on{display:block}
.pop .ph{font-size:10.5px;color:var(--ink4);letter-spacing:.08em;margin-bottom:7px;display:flex;gap:8px;align-items:baseline}
.pop .ph b{margin-left:auto;font-weight:400;color:var(--c1);cursor:pointer}
.pop .body{display:flex;flex-wrap:wrap;gap:5px;max-height:240px;overflow:auto}
.pop select.chip{max-width:100%}
/* 脉搏 */
.pulse{display:flex;align-items:center;gap:10px;flex:0 0 auto;padding-left:14px;
  border-left:1px solid rgba(237,239,234,.16)}
.pulse .pn{line-height:1.15;text-align:right}
.pulse .pn b{display:block;font-family:var(--serif);font-size:13px;color:#F4F6F1}
.pulse .pn span{font-size:9.5px;color:#8F9A92;letter-spacing:.04em}
.pulse svg{display:block}
@media(max-width:1240px){.pulse{display:none}}
/* 顶栏右侧动作 */
.tacts{display:flex;align-items:center;gap:6px;flex:0 0 auto}
.tbtn{background:rgba(237,239,234,.07);border:1px solid rgba(237,239,234,.14);color:#DDE3DD;
  border-radius:4px;padding:3px 9px;font-size:11.5px;font-family:var(--sans);cursor:pointer;white-space:nowrap}
.tbtn:hover{background:rgba(237,239,234,.14)}
.tbtn.on{background:var(--c1m);border-color:var(--c1m);color:#0E1A16}
.tbtn kbd{border-color:rgba(237,239,234,.3);background:transparent;color:#9FAAA2;border-bottom-width:1px;margin-left:5px}
.menu{position:fixed;z-index:660;background:var(--panel);border:1px solid var(--rule);
  border-radius:5px;box-shadow:var(--shadow2);padding:5px;display:none;z-index:80;min-width:186px}
.menu.on{display:block}
.menu button{display:block;width:100%;text-align:left;border:0;background:none;padding:6px 10px;
  font-size:12.5px;font-family:var(--sans);color:var(--ink2);cursor:pointer;border-radius:3px}
.menu button:hover{background:var(--panel2);color:var(--ink)}
.menu .sep{height:1px;background:var(--rule3);margin:4px 0}
/* 数据缎带：既是分隔线，也是当前口径的三段构成 */
.ribbon{height:5px;display:flex;flex:0 0 auto;cursor:default}
.ribbon i{display:block;height:100%;transition:width .5s cubic-bezier(.22,.9,.3,1)}
/* 视图标签：分段控件 */
.tab{border-radius:4px;padding:5px 12px;margin-bottom:0;border-bottom:0;color:var(--ink3);white-space:nowrap}
.tab:hover{background:rgba(255,255,255,.55);color:var(--ink)}
.tab.on{background:var(--panel);color:var(--c1d);border-bottom:0;box-shadow:0 1px 2px rgba(20,28,25,.08)}
body.compact .tabs{padding:2px}
@media(max-width:900px){
  .topbar{height:auto;flex-wrap:wrap;padding:7px 12px;gap:8px}
  .topbar .brandmark{border-right:0;padding-right:0}
  .scope{order:3;width:100%}
}

/* ============ 左栏收起 ============ */
body.railoff{--rail:0px}
body.railoff nav{display:none}
nav .brand{display:flex;align-items:center;gap:8px}
nav .brand .rc{margin-left:auto;border:1px solid var(--rule);background:var(--panel);border-radius:3px;
  cursor:pointer;font-size:11px;color:var(--ink3);padding:0 5px;line-height:1.6;font-family:var(--sans)}
nav .brand .rc:hover{border-color:var(--c1m);color:var(--c1)}
/* ============ 决策分类条 ============ */
.dcbar{display:flex;gap:6px;flex-wrap:wrap;align-items:center;width:100%;padding-top:2px}
.dcchip{border:1px solid var(--rule);background:var(--panel);color:var(--ink2);border-radius:14px;
  padding:3px 11px;font-size:11.5px;font-family:var(--sans);cursor:pointer;white-space:nowrap;
  display:inline-flex;gap:6px;align-items:baseline;transition:background .15s,border-color .15s,color .15s}
.dcchip:hover{border-color:var(--c1m);color:var(--ink)}
.dcchip.on{background:var(--c1);border-color:var(--c1);color:#fff;font-weight:600}
.dcchip em{font-style:normal;font-size:10px;opacity:.6}
.dcnote{width:100%;font-size:11.5px;color:var(--ink2);padding:4px 0 0;line-height:1.6}
.dcnote b{color:var(--ink);font-weight:600}
/* ============ 通览模式：全部图表在同一页 ============ */
body.viz .tipbar,body.viz .psub,body.viz .formula{display:none}
body.viz .bhead{padding:8px 0 7px}
body.viz .bhead h2{font-size:15px;-webkit-line-clamp:1}
body.viz .vizsec{margin-bottom:18px;scroll-margin-top:82px}
body.viz .vizlabel{position:sticky;top:78px;z-index:15;background:var(--paper);padding:7px 0 6px;
  display:flex;align-items:baseline;gap:10px;border-bottom:1px solid var(--rule2);margin-bottom:10px}
body.viz .vizlabel b{font-family:var(--serif);font-size:13.5px;color:var(--ink)}
body.viz .vizlabel span{font-size:10px;letter-spacing:.1em;color:var(--ink4)}
body.viz .vizlabel em{margin-left:auto;font-style:normal;font-size:10.5px;color:var(--c1);cursor:pointer}
body.viz .vizlabel em:hover{text-decoration:underline}
body.viz .vizgrid{display:grid;grid-template-columns:repeat(auto-fit,minmax(540px,1fr));
  gap:12px;align-items:start}
body.viz .vizgrid .panel{margin-top:0}
body.viz .kpis{grid-column:1/-1}
body.viz .panel[data-wide="1"]{grid-column:1/-1}
body.viz .pbody{padding:9px 11px 11px}
body.viz .phead{padding:7px 11px 6px}
body.viz .ptitle{font-size:12.5px}
body.viz .scroll{max-height:340px}
body.viz .lgd{margin-bottom:6px}
body.viz nav li button em{margin-left:auto}
@media(max-width:1180px){body.viz .vizgrid{grid-template-columns:1fr}}
/* ============ 紧凑模式 ============ */
body.compact{font-size:12.5px;--rail:182px}
body.compact .topbar{min-height:44px;padding:4px 14px}
body.compact .ribbon{height:4px}
body.compact .bhead{padding:6px 0 6px}
body.compact .bhead h2{font-size:15px;-webkit-line-clamp:1}


body.compact .tabs{margin-top:8px}
body.compact .tab{padding:5px 11px}
body.compact .view{padding-top:8px}
body.compact .pbody{padding:8px 10px 9px}
body.compact .phead{padding:8px 11px 7px}
body.compact .psub{display:none}
body.compact .panel+.panel{margin-top:8px}
body.compact .kpi{padding:8px 11px}
body.compact .kpi .v{font-size:19px}
body.compact .kpi .k{min-height:0}
body.compact .formula{margin:7px 11px 9px}
/* ============ 面板放大 ============ */
.panel.max{position:fixed;inset:14px;z-index:650;overflow:auto;box-shadow:var(--shadow2)}
.panel.max .pbody{padding:16px 18px}
.maxscrim{position:fixed;inset:0;background:rgba(20,28,25,.30);z-index:649;display:none}
.maxscrim.on{display:block}
/* ============ 命令面板 ============ */
.palwrap{position:fixed;inset:0;z-index:700;display:none;align-items:flex-start;justify-content:center;
  background:rgba(20,28,25,.32);padding-top:12vh}
.palwrap.on{display:flex}
.pal{width:min(680px,92vw);background:var(--panel);border:1px solid var(--rule);border-radius:6px;
  box-shadow:var(--shadow2);overflow:hidden;animation:palIn .16s cubic-bezier(.2,.9,.3,1) both}
@keyframes palIn{from{opacity:0;transform:translateY(-8px) scale(.99)}to{opacity:1;transform:none}}
.pal input{width:100%;border:0;border-bottom:1px solid var(--rule2);padding:13px 16px;font-size:15px;
  font-family:var(--sans);background:var(--panel);color:var(--ink);outline:none;border-radius:0}
.pal .list{max-height:52vh;overflow:auto;padding:5px 0}
.pal .row{display:flex;gap:10px;align-items:baseline;padding:7px 16px;cursor:pointer;font-size:13px}
.pal .row.sel{background:var(--c1w);box-shadow:inset 2px 0 0 var(--c1)}
.pal .row .ty{font-size:10px;color:var(--ink4);border:1px solid var(--rule);border-radius:2px;padding:0 5px;flex:0 0 auto}
.pal .row .nm{flex:1;color:var(--ink);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.pal .row .sub{font-size:11px;color:var(--ink3);flex:0 0 auto}
.pal .row mark{background:var(--c2l);color:var(--ink);border-radius:1px;padding:0 1px}
.pal .foot{border-top:1px solid var(--rule2);padding:7px 16px;font-size:11px;color:var(--ink4);
  display:flex;gap:14px;flex-wrap:wrap;background:var(--panel2)}
.pal .empty{padding:22px 16px;text-align:center;color:var(--ink4);font-size:12.5px}
kbd{font-family:var(--mono);font-size:10.5px;border:1px solid var(--rule);border-bottom-width:2px;
  border-radius:3px;padding:0 4px;background:var(--panel);color:var(--ink2)}
/* ============ 帮助卡 ============ */
.helpwrap{position:fixed;inset:0;z-index:700;display:none;align-items:center;justify-content:center;
  background:rgba(20,28,25,.32)}
.helpwrap.on{display:flex}
.help{width:min(720px,92vw);max-height:82vh;overflow:auto;background:var(--panel);border:1px solid var(--rule);
  border-radius:6px;box-shadow:var(--shadow2);padding:20px 22px}
.help h3{font-size:16px;margin-bottom:10px}
.help .grid{display:grid;grid-template-columns:1fr 1fr;gap:8px 22px}
@media(max-width:700px){.help .grid{grid-template-columns:1fr}}
.help .it{display:flex;gap:9px;align-items:baseline;font-size:12.5px;color:var(--ink2);
  padding:5px 0;border-bottom:1px solid var(--rule3)}
.help .it b{flex:0 0 96px;color:var(--ink);font-weight:600;font-family:var(--sans)}
/* ============ 首次提示条 ============ */
.tipbar{display:flex;gap:10px;align-items:center;padding:6px 20px;background:var(--c1w);
  border-bottom:1px solid var(--c1l);font-size:11.5px;color:var(--c1d);flex:0 0 auto}
.tipbar.off{display:none}
.tipbar b{font-weight:600}
.tipbar button{margin-left:auto}
/* ============ 打印 ============ */
@media print{
  @page{size:A4 landscape;margin:11mm}
  body{overflow:visible;background:#fff;font-size:11px}
  nav,.topbar,.ribbon,.filters,.crumbs,.tipbar,.drawer,.scrim,.tip,.palwrap,.helpwrap,.tabs,.pacts,.ctrl,.brushrail{display:none !important}
  .wrap{display:block;height:auto}
  .shell{display:block;height:auto;overflow:visible}
  main{overflow:visible;padding:0}
  .board{display:none}
  .board.on{display:block}
  .view{display:block !important;padding-top:8px;break-inside:avoid}
  .view:before{content:attr(data-vname);display:block;font-family:var(--serif);font-size:13px;
    color:#444;border-bottom:1px solid #ccc;padding-bottom:3px;margin-bottom:8px}
  .panel{break-inside:avoid;box-shadow:none;border-color:#ddd}
  .bhead{position:static;display:block}
  .bdesc{display:block !important;position:static;box-shadow:none;border:0;padding:4px 0;max-width:none}
  .scroll{max-height:none;overflow:visible}
  .printhead{display:block !important;border-bottom:2px solid #333;padding-bottom:6px;margin-bottom:10px}
}
.printhead{display:none}

/* ============ 下钻抽屉 ============ */
.scrim{position:fixed;inset:0;background:rgba(20,28,25,.28);z-index:600;opacity:0;pointer-events:none;transition:opacity .16s}
.scrim.on{opacity:1;pointer-events:auto}
.drawer{position:fixed;top:0;right:0;bottom:0;width:min(940px,86vw);background:var(--panel);z-index:601;
  box-shadow:var(--shadow2);transform:translateX(101%);transition:transform .2s cubic-bezier(.3,.8,.4,1);
  display:flex;flex-direction:column}
.drawer.on{transform:none}
.dhead{padding:13px 18px 10px;border-bottom:1px solid var(--rule);flex:0 0 auto;position:relative}
.dhead .dk{font-size:10.5px;color:var(--ink4);letter-spacing:.1em}
.dhead h3{font-size:16px;margin-top:3px;line-height:1.4;padding-right:70px}
.dhead .dn{font-size:11.5px;color:var(--ink3);margin-top:4px}
.dclose{position:absolute;top:12px;right:16px;border:1px solid var(--rule);background:var(--panel);cursor:pointer;
  border-radius:2px;padding:2px 8px;font-size:12px;color:var(--ink2);font-family:var(--sans)}
.dclose:hover{border-color:var(--c3);color:var(--c3)}
.dkpi{display:grid;grid-template-columns:repeat(6,1fr);border-bottom:1px solid var(--rule2);flex:0 0 auto;background:var(--panel2)}
.dkpi div{padding:8px 12px;border-right:1px solid var(--rule3)}
.dkpi div:last-child{border-right:0}
.dkpi .k{font-size:10px;color:var(--ink4)}
.dkpi .v{font-family:var(--serif);font-size:16px;margin-top:2px}
.dtabs{display:flex;border-bottom:1px solid var(--rule);padding:0 12px;flex:0 0 auto;overflow-x:auto}
.dtabs .tab{border-radius:0;background:none;box-shadow:none;border-bottom:2px solid transparent;margin-bottom:-1px}
.dtabs .tab.on{background:none;box-shadow:none;color:var(--c1);border-bottom-color:var(--c1)}
.dbody{flex:1;overflow:auto;padding:12px 16px 30px}
.dacts{padding:9px 16px;border-top:1px solid var(--rule);display:flex;gap:7px;align-items:center;flex:0 0 auto;background:var(--panel2)}
.dacts .fnote{margin-left:auto}
.rawtbl td{font-size:11.5px;padding:3px 6px}
.rawtbl th{font-size:10.5px;padding:4px 6px}
.rawtbl td.hl{background:var(--c1w);font-weight:600}
.rawtbl td.neg{color:var(--bad);font-weight:600}
@media(max-width:900px){
  #navtoggle{display:inline-block}
  .wrap{grid-template-columns:1fr}
  nav{position:fixed;left:0;top:0;bottom:0;width:var(--rail);z-index:500;transform:translateX(-101%);transition:transform .2s}
  nav.on{transform:none}
  main{padding:0 12px 50px}
  .kpis{grid-template-columns:repeat(2,1fr)}
  .dkpi{grid-template-columns:repeat(3,1fr)}
  .drawer{width:100vw}
}
</style>
</head>

/* ==================== 统计层：simple-statistics（缺失时降级） ==================== */
const _ss=(typeof window!=="undefined"&&window.ss)?window.ss:null;
const SS={
  lib:_ss?"simple-statistics":"内置降级实现",
  mean:a=>a.length?(_ss?_ss.mean(a):d3.mean(a)):0,
  median:a=>a.length?(_ss?_ss.median(a):d3.median(a)):0,
  sd:a=>a.length>1?(_ss?_ss.standardDeviation(a):d3.deviation(a)||0):0,
  q:(a,p)=>{if(!a.length)return 0;const b=a.slice().sort(d3.ascending);
    return _ss?_ss.quantileSorted(b,p):d3.quantileSorted(b,p);},
  corr:(a,b)=>{if(a.length<2)return 0;
    if(_ss&&_ss.sampleCorrelation)try{return _ss.sampleCorrelation(a,b);}catch(e){}
    const ma=d3.mean(a),mb=d3.mean(b);
    const nu=d3.sum(a.map((v,i)=>(v-ma)*(b[i]-mb)));
    const de=Math.sqrt(d3.sum(a.map(v=>(v-ma)**2))*d3.sum(b.map(v=>(v-mb)**2)));
    return de?nu/de:0;},
  slope:(xs,ys)=>{if(xs.length<2)return 0;
    if(_ss&&_ss.linearRegression)try{return _ss.linearRegression(xs.map((x,i)=>[x,ys[i]])).m;}catch(e){}
    const mx=d3.mean(xs),my=d3.mean(ys);
    const nu=d3.sum(xs.map((x,i)=>(x-mx)*(ys[i]-my))),de=d3.sum(xs.map(x=>(x-mx)**2));
    return de?nu/de:0;},
  /* 自助抽样：返回每次重抽的均值，用于给预测带一个可核验的不确定区间 */
  boot:(a,B,rnd)=>{const out=[],n=a.length;if(!n)return out;
    for(let b=0;b<B;b++){let s2=0;for(let i=0;i<n;i++)s2+=a[(rnd()*n)|0];out.push(s2/n);}
    return out.sort(d3.ascending);}
};
/* 可复现的伪随机数：同样的参数得到同样的区间，避免每次刷新结论都变 */
function rng(seed){let t=seed>>>0;return()=>{t+=0x6D2B79F5;let r=Math.imul(t^(t>>>15),1|t);
  r^=r+Math.imul(r^(r>>>7),61|r);return((r^(r>>>14))>>>0)/4294967296;};}
/* 未来日历：从数据窗口末日往后推，标出周末与法定假日 */
function futureCalendar(n,holidays){
  const last=DATES[DATES.length-1]||new Date();
  const out=[];
  for(let i=1;i<=n;i++){
    const dt=new Date(last.getTime());dt.setDate(dt.getDate()+i);
    const dow=dt.getDay();
    out.push({i:i-1,date:dt,dow,weekend:dow===0||dow===6,holiday:false,
      wk:Math.floor((i-1)/7)});
  }
  /* 法定假日按「每 13 周 h 天」均匀落在非周末日上，作为设计值 */
  const h=Math.max(0,Math.round(holidays*n/91));
  const cand=out.filter(d=>!d.weekend);
  for(let k=0;k<h&&cand.length;k++)cand[Math.floor((k+0.5)*cand.length/Math.max(h,1))].holiday=true;
  return out;
}

/* Delaunay 指针：整块热区找最近点，指哪中哪 */
function pointerNearest(st,data,xa,ya,h){
  if(!data.length)return;
  const del=d3.Delaunay.from(data,xa,ya),lim=h.maxDist||70;
  const near=(ev,node)=>{const p=d3.pointer(ev,node);const i=del.find(p[0],p[1]);
    if(i<0||data[i]===undefined)return null;
    const dx=xa(data[i])-p[0],dy=ya(data[i])-p[1];
    return Math.sqrt(dx*dx+dy*dy)<=lim?{d:data[i],i}:null;};
  const L=st.layer?st.layer("fg"):st.g;
  let pad=L.select("rect.hitpad");
  if(pad.empty())pad=L.append("rect").attr("class","hitpad").attr("fill","transparent");
  pad.attr("width",st.iw).attr("height",st.ih).raise()
    .on("mousemove",function(ev){const r=near(ev,this);
      if(r)h.move(ev,r.d,r.i);else{hideTip();h.leave&&h.leave();}})
    .on("mouseleave",()=>{hideTip();h.leave&&h.leave();})
    .on("click",function(ev){const r=near(ev,this);if(r&&h.click)h.click(r.d,r.i);});
  return pad;
}

/* ==================== 可读性工具：估宽、抽稀、避让 ==================== */
/* 无需 DOM 测量的文字宽度估算：中日韩全角按 1.0em，其余按 0.56em */
function estW(t,size){
  t=String(t==null?"":t);size=size||10.5;
  let w=0;for(const ch of t)w+=(/[\u2E80-\uFFEF]/.test(ch)?1:0.56);
  return w*size;
}
function clipToWidth(t,px,size){
  t=String(t==null?"":t);
  if(estW(t,size)<=px)return t;
  let out="";
  for(const ch of t){if(estW(out+ch+"…",size)>px)break;out+=ch;}
  return out+"…";
}
/* 带状轴刻度抽稀：算得下就全显，算不下就每 k 个显示一个 */
function thinBand(axis,x,fmt,size,rot){
  const dom=x.domain(),step=x.step();
  const maxW=d3.max(dom,d=>estW(fmt(d),size))||1;
  const need=rot?Math.abs(Math.cos(rot*Math.PI/180))*14+6:maxW;
  const k=Math.max(1,Math.ceil((rot?18:maxW+8)/step));
  return axis.tickValues(dom.filter((d,i)=>i%k===0)).tickFormat(fmt);
}
function rotTicks(g,deg,size){
  g.selectAll("text").attr("transform",`rotate(${deg})`).style("text-anchor",deg<0?"end":"start")
    .attr("dx",deg<0?"-4":"4").attr("dy",deg<0?"3":"3").style("font-size",(size||10)+"px");
}
/* 一维标签避让：把靠得太近的标签沿纵向推开，保持原有顺序 */
function dodgeY(items,gap,lo,hi){
  const arr=items.slice().sort((a,b)=>a.y-b.y);
  gap=gap||12;
  for(let i=1;i<arr.length;i++)if(arr[i].y-arr[i-1].y<gap)arr[i].y=arr[i-1].y+gap;
  const over=arr.length?arr[arr.length-1].y-(hi===undefined?Infinity:hi):0;
  if(over>0){for(let i=arr.length-1;i>=0;i--){arr[i].y-=over;
    if(i>0&&arr[i].y-arr[i-1].y<gap)arr[i-1].y=arr[i].y-gap;}}
  if(lo!==undefined&&arr.length&&arr[0].y<lo){
    const d=lo-arr[0].y;
    for(let i=0;i<arr.length;i++){arr[i].y+=d;
      if(i>0&&arr[i].y-arr[i-1].y<gap)arr[i].y=arr[i-1].y+gap;}}
  return items;
}
/* 二维标签摆放：按重要度依次尝试上/下/右/左，放不下就放弃这一个 */
function placeLabels(items,opt){
  opt=opt||{};
  const size=opt.size||10,pad=opt.pad||2,W=opt.w||1e9,H=opt.h||1e9;
  const boxes=[],out=[];
  const cand=d=>[[0,-(d.r+5),"middle"],[0,d.r+11,"middle"],
    [d.r+5,4,"start"],[-(d.r+5),4,"end"]];
  items.slice().sort((a,b)=>(b.pri||0)-(a.pri||0)).forEach(d=>{
    const tw=estW(d.text,size),th=size+2;
    for(const [dx,dy,anchor] of cand(d)){
      const cx=d.x+dx,cy=d.y+dy;
      const x0=anchor==="middle"?cx-tw/2:anchor==="start"?cx:cx-tw;
      const box={x0:x0-pad,x1:x0+tw+pad,y0:cy-th,y1:cy+pad};
      if(box.x0<0||box.x1>W||box.y0<0||box.y1>H)continue;
      if(boxes.some(b=>!(box.x1<b.x0||box.x0>b.x1||box.y1<b.y0||box.y0>b.y1)))continue;
      boxes.push(box);out.push({...d,lx:cx,ly:cy,anchor});return;}
  });
  return out;
}

  {id:"heat",name:"单品 × 门店热力图",rows:[{cells:[P("heat","单品 × 门店的日均动销","色深为日均销量，虚线空格为该店没有这个单品。点击格子下钻到该店该单品的逐日记录。",{foot:1,lgd:1,over:1,
    ctrl:`<label>只看品类 <select class="chip" id="as-cat"></select></label>
      <label>最少铺货店数 <input type="range" id="as-min" min="1" max="18" step="1" value="1"><span class="val" id="as-minv">1</span></label>
      <label><input type="checkbox" id="as-sort" checked> 按总销量排序</label>`})]}]},
  {id:"cover",name:"覆盖分布",rows:[{cells:[P("cover","铺货店数分布","横轴为一个单品出现在几家店，柱高为单品数。点击柱子下钻。",{foot:1,lgd:1})]}]},
  {id:"clu",name:"门店分群",rows:[{cells:[P("cluster","按货盘结构给门店分群","行列按聚类结果重排，黑框内是同一群。点击格子下钻到这两家店。",{foot:1,lgd:1,over:1,
    ctrl:`<label>群数 <input type="range" id="sim-k" min="2" max="6" step="1" value="3"><span class="val" id="sim-kv">3</span></label>
      <span class="fnote">同群门店可共用一套订货模板与货盘</span>`})]}]},
  {id:"pd",name:"跨区价差",rows:[{cells:[P("pricediff","同名商品的跨区售价差","同一商品在不同区域的中位售价之差，正差意味着高价区存在价格解释成本。",{foot:1,scroll:1})]}]}
 ]},
{g:"结构诊断",id:"b-price",nav:"价格带",title:"t-pb",
 desc:"原表在计划稿里已经写下「单价对比 GZ，过高」。这里把计划稿的设计值与明细表算出的实测值并排放，看两者是否对得上。",
 views:[
  {id:"band",name:"价格带结构",rows:[{cells:[P("band","实测价格带结构：按区域 × 品类","柱高为该价格带内的单品数，色块为价格带。点击色块下钻。",{foot:1,lgd:1})]}]},
  {id:"gap",name:"贡献缺口",rows:[{cells:[P("bandrev","价格带的销量与销售额贡献并不一致","两条线的缺口就是价格带的杠杆：销量占比低而销售额占比高，说明这一档在撑客单价。",{foot:1,lgd:1})]}]},
  {id:"des",name:"计划稿对照",rows:[{cells:[P("banddes","计划稿设计值 vs 明细表实测值","计划稿写的是「个包新增前/新增后」的单品数分布，实测值来自当期实际在售单品。",{foot:1,lgd:1})]}]},
  {id:"elas",name:"价格弹性",rows:[{cells:[P("elastic","售价与店日均销量的横截面关系","对数-对数坐标，拟合线斜率即横截面弹性。落在线上方的单品同价更好卖。",{foot:1,lgd:1,
    ctrl:`<label>只看品类 <select class="chip" id="el-cat"></select></label>
      <span class="fnote">横截面相关，不能当作提价后的实际反应</span>`})]}]},
  {id:"opt",name:"调整方案",rows:[{cells:[P("priceopt","价格带调整的三种走法","原表已提出「调 3 款产品至小于 15 元」，这里把它和另外两种路径放在一起比较。")]}]}
 ]},
{g:"结构诊断",id:"b-dough",nav:"面团条线",title:"t-dg",
 desc:"原表在四张分区表里都写了同一句话：「单个面团产品可能影响产能」。这里把每条面团线的单品数、销量与报废量算出来，判断哪几条线该合并。",
 views:[
  {id:"load",name:"条线负载",rows:[{cells:[P("dough","面团线负载：单品数与销量不成比例","横轴为该面团线的日均销量，纵轴为挂靠单品数，右下角是「低产出高复杂度」区。",{foot:1,lgd:1})]}]},
  {id:"tbl",name:"条线明细",rows:[{cells:[P("doughtbl","面团线明细","点击任意一行下钻到该条线的全部原始记录。",{scroll:1})]}]}
 ]},
{g:"行动推演",id:"b-waste",nav:"报废诊断",title:"t-wa",
 desc:"报废金额按当日售价计。若按成本口径金额会小很多，但两种口径不能混用；本页统一用售价口径，便于与销售额直接比较。",
 views:[
  {id:"wf",name:"金额分解",rows:[{cells:[P("waterfall","报废金额的来源分解","从总可售金额出发，逐层扣到实际销售额。点击任一段下钻。",{foot:1,lgd:1})]}]},
  {id:"sku",name:"单品排行",rows:[{cells:[P("wastesku","报废金额最高的 20 个单品","柱长为报废金额，右侧标注报废率；虚线为全线平均报废率。",{foot:1,lgd:1})]}]},
  {id:"heat",name:"门店 × 日期",rows:[{cells:[P("wasteheat","报废率的门店 × 日期分布","色深为当日报废率，用于识别是「某家店的问题」还是「某一天的问题」。点击格子下钻。",{foot:1,lgd:1,over:1})]}]},
  {id:"opp",name:"减损潜力",rows:[{cells:[P("opp","按门店排出的可省金额与累计曲线","拉齐到最优店报废率后每家店能省多少，虚线为累计占比。点击色条下钻。",{foot:1,lgd:1})]}]},
  {id:"opt",name:"减损方案",rows:[{cells:[P("wasteopt","三种减损路径的取舍","同一份数据可以支撑三种做法，代价各不相同。")]}]}
 ]},
{g:"行动推演",id:"b-order",nav:"订货推演",title:"t-or",
 desc:"只盯报废率会把订货压到缺货。用报童模型给每个单品算一个订货量，把「少卖一件的损失」和「多做一件的损失」放在同一个天平上。",
 views:[
  {id:"curve",name:"临界分位",rows:[{cells:[P("nvcurve","临界分位数与订货量的关系","横轴为临界分位，纵轴为对应的建议出炉总量；竖线为当前参数下的取值。",{foot:1,lgd:1,
    ctrl:`<span class="cg">成本参数（设计值）</span>
      <label>毛利率 <input type="range" id="nv-m" min="30" max="90" step="1" value="70"><span class="val" id="nv-mv">70%</span></label>
      <label>报废残值率 <input type="range" id="nv-s" min="0" max="60" step="5" value="0"><span class="val" id="nv-sv">0%</span></label>
      <label>成本率 <input type="range" id="nv-c" min="10" max="50" step="1" value="30"><span class="val" id="nv-cv">30%</span></label>
      <span class="fnote" id="nv-cr"></span>`})]}]},
  {id:"dist",name:"需求分布",rows:[{cells:[P("dbox","销量最高的 16 个单品：日需求分布与建议出炉量","箱线是店日销量的经验分布，黑线为当前出炉量，红菱形为建议值。点击任意一行下钻。",{foot:1,lgd:1})]}]},
  {id:"tbl",name:"逐单品建议",rows:[{cells:[P("nvtbl","按单品给出的建议出炉量","以「店 × 日」为观测点取经验分位数。样本仅 6 天，结果为方向性参考而非排产指令。点击行下钻。",{foot:1,scroll:1})]}]}
 ]},
{g:"行动推演",id:"b-new",nav:"新品追踪",title:"t-nw",
 desc:"计划稿要上市的三款碱水结在明细表里没有任何销售记录，属于未上市状态；下方用现有同价位单品的爬坡曲线给出上市首周的预期区间。",
 views:[
  {id:"curve",name:"新品爬坡",rows:[{cells:[P("newcurve","新品爬坡曲线：销量在涨，报废也在涨","左轴日销量，右轴日报废率；虚线为全线平均报废率。",{foot:1,lgd:1})]}]},
  {id:"plan",name:"待上市清单",rows:[{cells:[P("plantbl","计划稿中尚无销售记录的单品","来自汇总表与四张分区计划表，与明细表逐项比对得到。",{foot:1,scroll:1})]}]},
  {id:"sim",name:"上市推演",rows:[{cells:[P("newsim","碱水结上市推演：三档情景","以同价位带现有单品的实测日销为基准，给出三档假设与对应的首周备货区间。",{foot:1,lgd:1,
    ctrl:`<label>铺货门店数 <input type="range" id="nw-st" min="1" max="18" step="1" value="18"><span class="val" id="nw-stv">18</span></label>`})]}]}
 ]},
{g:"净利与成本",id:"b-profit",nav:"净利结构",title:"t-profit",
 desc:"数据里只有销售与损耗，没有人工、租金与能耗。这块看板把这三项做成可调输入，其余全部来自实测，用于看清净利的构成与保本位置。",
 views:[
  {id:"bridge",name:"利润桥",rows:[{cells:[P("pbridge","从月销售额到店均月净利，每一段扣掉什么","人工、租金、能耗与包材为可调设计值，需按客户实际填写。",{foot:1,lgd:1,
    ctrl:`<span class="cg">成本输入（设计值）</span>
      <label>人工/月/店 <input type="range" id="p-labor" min="0" max="300000" step="5000" value="80000"><span class="val" id="p-laborv">—</span></label>
      <label>租金/月/店 <input type="range" id="p-rent" min="0" max="300000" step="5000" value="60000"><span class="val" id="p-rentv">—</span></label>
      <label>能耗与包材 <input type="range" id="p-var" min="0" max="15" step="1" value="5"><span class="val" id="p-varv">5%</span></label>`})]}]},
  {id:"be",name:"保本点",rows:[{cells:[P("breakeven","每家店的保本日销售额与实际日销售额","报废越高，保本所需的销售额越高。点击色条下钻。",{foot:1,lgd:1})]}]},
  {id:"skunet",name:"单品净贡献",rows:[{cells:[P("skuprofit","哪些单品在赚钱，哪些在倒贴","净贡献 = 销售额×(1−成本率) − 报废货值×成本率。",{foot:1,lgd:1})]}]}
 ]},
{g:"运营流程",id:"b-flow",nav:"流程与货龄",title:"t-flow",
 desc:"把一天的货按流程顺序拆开：昨日结转、当天出炉、调拨盘点进来，卖掉、报废、过夜出去。每个环节都能点开看原始记录。",
 views:[
  {id:"funnel",name:"流程漏斗",rows:[{cells:[P("funnel","一天的货从哪来、到哪去","按件数看六个环节，虚线为可动用总量。点击任一环节下钻。",{foot:1,lgd:1})]}]},
  {id:"carry",name:"过夜与货龄",rows:[{cells:[P("carry","当天有过夜货与没有过夜货，报废率差多少","按品类分组对照，柱顶为两者之差。",{foot:1,lgd:1})]}]},
  {id:"transfer",name:"调拨与盘点",rows:[{cells:[P("transfer","门店靠调拨和盘点调整补了多少货","调入、调出、盘盈、盘亏四项的绝对件数堆叠。",{foot:1,lgd:1})]}]}
 ]},
{g:"客户体验",id:"b-cx",nav:"顾客侧信号",title:"t-cx",
 desc:"这份数据里没有会员、评价与分时段销售，顾客体验只能用三个代理指标推测：买不到、退回来、晚到没得选。三者都标注了口径边界。",
 views:[
  {id:"out",name:"顾客扑空",rows:[{cells:[P("stockout","打烊时零剩余零报废的比例：顾客可能扑空","左为门店，右为品类。这是缺货的上界代理指标。",{foot:1,lgd:1})]}]},
  {id:"ret",name:"退货信号",rows:[{cells:[P("returns","客退货最多的单品","客退货不进入库存平衡式，是独立的质量信号。",{foot:1,lgd:1})]}]},
  {id:"shelf",name:"打烊可选面",rows:[{cells:[P("shelf","打烊时已售罄的单品占比","这个数越高，晚到顾客可选的品项越少。与报废率是一对矛盾指标。",{foot:1,lgd:1})]}]}
 ]},
{g:"区域竞争",id:"b-region",nav:"区域位势",title:"t-region",
 desc:"数据里没有竞品与商圈信息，因此这块看板做的是区域之间的内部位势对比，并在最后列出真正的竞争分析还缺哪些数据。",
 views:[
  {id:"pos",name:"位势图",rows:[{grid:"grid2",cells:[
    P("regpos","产出强度 × 客单结构的区域位势","横轴店均日销售额，纵轴件单价，圆面积为门店数。",{foot:1,lgd:1}),
    P("regovl","区域之间的货盘重合度","Jaccard 系数，右侧为各区独有单品数。",{foot:1,lgd:1,over:1})]}]},
  {id:"gap",name:"对标缺口",rows:[{cells:[P("compgap","做真正的竞争分析还缺哪些数据",null,{foot:1,scroll:1})]}]}
 ]},
{g:"时间轴",id:"b-hist",nav:"历史时间轴",title:"t-hist",
 desc:"6 天窗口能回答「这几天发生了什么」，不能直接回答「一个月会怎样」。这块看板先把已发生的事讲清楚：哪几天是假期、新品什么时候起量、哪一天的数据不干净。",
 views:[
  {id:"daily",name:"逐日实况",rows:[{cells:[P("histline","窗口内每一天的销售额、报废率与售罄率","柱为销售额，实线为报废率，虚线为售罄率；顶部色带标注事件。点击任意一天下钻。",{foot:1,lgd:1})]},
    {cells:[P("histcum","累计销售额与累计报废额","面积为累计销售额，深色为累计报废额，两者之差是这 6 天真正落袋的货值。",{foot:1,lgd:1})]}]},
  {id:"wk",name:"平日 vs 假日",rows:[{grid:"grid2",cells:[
    P("histwk","平日与假日的店均日销售额对比","按区域拆分，误差线为自助抽样得到的 90% 区间。",{foot:1,lgd:1}),
    P("histmix","假期改变的不只是量，还有结构","假期与平日的品类销售额占比之差，正值表示假期更好卖。",{foot:1,lgd:1})]}]},
  {id:"grid",name:"店 × 日日历",rows:[{cells:[P("histgrid","每家店每一天的售罄率日历","色深为售罄率，红点标记当日出现负库存的记录。点击格子下钻到当天该店全部记录。",{foot:1,lgd:1,over:1})]}]}
 ]},
{g:"时间轴",id:"b-fcst",nav:"未来时间轴",title:"t-fcst",
 desc:"把 6 天的实测值按平日/假日分层，外推到可选的未来周数，并叠加四类可执行动作。区间来自对门店–日观测值的自助抽样，不是拍脑袋的乐观值。",
 views:[
  {id:"fan",name:"预测走廊",rows:[{cells:[P("fcfan","未来 13 周的周销售额走廊与三档情景","浅色带为基线的 P10–P90 区间，三条线为三种做法。竖线左侧是实测，右侧是推演。",{foot:1,lgd:1,
    ctrl:`<span class="cg">外推参数（设计值）</span>
      <label>周数 <select class="chip" id="fc-wk"><option>4</option><option selected>13</option><option>26</option></select></label>
      <label>周增长 <input type="range" id="fc-g" min="-10" max="20" step="1" value="1"><span class="val" id="fc-gv">0.1%</span></label>
      <label>周末系数 <input type="range" id="fc-we" min="100" max="160" step="2" value="122"><span class="val" id="fc-wev">1.22</span></label>
      <label>每 13 周法定假日 <input type="range" id="fc-hd" min="0" max="8" step="1" value="3"><span class="val" id="fc-hdv">3 天</span></label>
      <label>新增门店 <input type="range" id="fc-st" min="0" max="12" step="1" value="0"><span class="val" id="fc-stv">0 家</span></label>`})]},
    {cells:[P("fcscn","三种做法的 13 周结果对照","同一套基线下，只改动作组合；毛利按可调成本率折算。",{foot:1,
      ctrl:`<span class="cg">动作参数（设计值）</span>
      <label>报废率目标 <input type="range" id="fc-w" min="4" max="11" step="1" value="7"><span class="val" id="fc-wv">7%</span></label>
      <label>达标周数 <input type="range" id="fc-rp" min="2" max="26" step="1" value="8"><span class="val" id="fc-rpv">8 周</span></label>
      <label>下架长尾阈值 <input type="range" id="fc-tl" min="0" max="3" step="1" value="1"><span class="val" id="fc-tlv">1 件/店日</span></label>
      <label>下架后销量转移 <input type="range" id="fc-tk" min="0" max="80" step="5" value="40"><span class="val" id="fc-tkv">40%</span></label>
      <label>新品上市款数 <input type="range" id="fc-nw" min="0" max="6" step="1" value="3"><span class="val" id="fc-nwv">3 款</span></label>
      <label>件单价调整 <input type="range" id="fc-pr" min="-5" max="10" step="1" value="0"><span class="val" id="fc-prv">0%</span></label>`})]}]},
  {id:"bridge",name:"驱动桥",rows:[{cells:[P("fcbridge","从当前跑速到推演结果，每一步各贡献多少毛利","左端为按当前口径平移的 13 周毛利，右端为选定情景，中间每一段是一个可单独负责的动作。",{foot:1,lgd:1})]}]},
  {id:"driver",name:"驱动流",rows:[{cells:[P("driver","逐周看四类动作各贡献多少毛利","零线以上为增益，以下为减益，黑线是当周净贡献。",{foot:1,lgd:1})]}]},
  {id:"cum",name:"累计与回本",rows:[{cells:[P("fccum","累计增量毛利与一次性投入的回本周","横轴为周，纵轴为相对基线的累计增量毛利；与投入线相交处即回本点。",{foot:1,lgd:1,
    ctrl:`<label>一次性投入 <input type="range" id="fc-iv" min="0" max="300000" step="10000" value="0"><span class="val" id="fc-ivv">0 元</span></label>`})]}]}
 ]},
{g:"时间轴",id:"b-sim",nav:"推演逻辑",title:"t-sim",
 desc:"推演不是黑箱。这块看板把输入、公式、参数取值、敏感度和已知偏差全部摊开，任何一个数字都能追到它的来源和它对结论的影响。",
 views:[
  {id:"spec",name:"模型规格",rows:[{cells:[P("simspec","从原始记录到推演结论的五步",null,{foot:1})]},
    {cells:[P("simpar","参数清单：取值、来源与影响方向",null,{scroll:1})]}]},
  {id:"tornado",name:"敏感度",rows:[{cells:[P("simtor","哪些参数真正决定结论","每个参数在其可调范围内单独变动，对 13 周毛利的影响幅度。条越长，越需要客户先确认这个数。",{foot:1,lgd:1})]}]},
  {id:"censor",name:"缺货截断校正",rows:[{cells:[P("simcen","被缺货截断的需求：观测销量系统性低于真实需求","打烊时零剩余零报废的观测点，其真实需求高于记录值。左图为校正幅度分布，右图为校正前后的建议出炉量。",{foot:1,lgd:1,
    ctrl:`<label><input type="checkbox" id="cen-on" checked> 在订货推演中启用校正</label>

function dcInsight(){
  const v=view(),a=agg(v);
  const dc=S.dc||"all";
  try{
    if(dc==="all")return `当前口径 <b>${F.n(v.length)}</b> 条记录：每 100 件出炉 <b>${(sr(a)*100).toFixed(1)}</b> 件卖掉、<b>${(wr(a)*100).toFixed(1)}</b> 件报废、<b>${(cr_(a)*100).toFixed(1)}</b> 件过夜`;
    if(dc==="grow"){const arr=skuMemo(),tot=d3.sum(arr,d=>d.rev)||1;
      const sorted=arr.slice().sort((x,y)=>y.rev-x.rev);let c=0,n=0;
      for(const d of sorted){c+=d.rev;n++;if(c/tot>=0.8)break;}
      return `销售额 <b>${F.yuan(a.rev)}</b>，<b>${n}</b> 个单品贡献 80%；件单价 <b>${F.n1(a.sales?a.rev/a.sales:0)}</b> 元，售罄率 <b>${F.p1(sr(a))}</b>`;}
    if(dc==="profit"){const P2=profitBase();
      return `店均日销售额 <b>${F.yuan(P2.revD)}</b>，报废吃掉 <b>${F.yuan(P2.revD*P2.wRatio*P2.c)}</b>/日；按当前成本设定，保本日销售额 <b>${F.yuan(P2.beD)}</b>`;}
    if(dc==="cx"){const cens=v.filter(d=>d.cl<=0&&d.w===0&&d.sl>0).length;
      return `顾客扑空占比 <b>${F.p1(v.length?cens/v.length:0)}</b>，客退货 <b>${F.n(sum(v,d=>d.cr))}</b> 件；无分时段与会员数据，三项均为代理指标`;}
    if(dc==="comp"){const rs=new Set(v.map(d=>d.r)).size;
      return `${rs} 个区域的内部位势对比；数据里没有竞品、商圈与租金，对外竞争分析需另补三类外部数据`;}
    if(dc==="ops"){const ws=Array.from(d3.group(v,d=>d.s),([s2,g])=>wr(agg(g)));
      return `<b>${ws.length}</b> 家门店报废率从 <b>${F.p1(d3.min(ws))}</b> 到 <b>${F.p1(d3.max(ws))}</b>，与单店产出相关系数接近零，差距来自订货纪律`;}
    if(dc==="time"){const hol=v.filter(d=>HOLIDAY.includes(d.d));
      return `窗口 <b>${a.days}</b> 天，假期贡献 <b>${F.p1(a.rev?sum(hol,d=>d.rev)/a.rev:0)}</b> 的销售额；外推按平日/假日分层，直接乘 30 会高估`;}
    return `<b>${F.n(v.length)}</b> 条店–日–单品记录，平衡式零误差；每张图上的数字都能点开看到构成它的原始行`;
  }catch(e){return "";}
}

function matchKeys(o,k){
  if(!k)return true;
  if(k.regions&&k.regions.length&&!k.regions.includes(o.r))return false;
  if(k.stores&&k.stores.length&&!k.stores.includes(o.s))return false;
  if(k.cats&&k.cats.length&&!k.cats.includes(o.c))return false;
  if(k.skus&&k.skus.length&&!k.skus.includes(o.k))return false;
  if(k.days&&k.days.length&&!k.days.includes(o.d))return false;
  if(k.chans&&k.chans.length&&!k.chans.includes(o.ch))return false;
  return true;
}

  if(!spec)return;
  if(mode!=="replace"){
    if(mode==="push"&&DR.title)DR.stack.push({keys:DR.keys,pred:DR.pred,title:DR.title,note:DR.note,
      kick:DR.kick,global:DR.global,tab:DR.tab});
    else if(mode!=="back")DR.stack=[];
  }
  DR.keys=spec.keys||{};DR.pred=spec.pred||null;DR.title=spec.title||"原始记录";
  DR.note=spec.note||"";DR.kick=spec.kick||"数据穿透";DR.tab=spec.tab||"raw";DR.page=0;DR.global=spec.global!==false;
  const base=DR.global?view():ROWS;
  DR.rows=base.filter(o=>matchKeys(o,DR.keys)&&(!DR.pred||DR.pred(o)));
  d3.select("#d-kick").text(DR.kick);
  d3.select("#d-title").text(DR.title);
  d3.select("#d-note").text(DR.note+(DR.global?"　（已叠加顶栏当前筛选）":"　（不受顶栏筛选影响）"));
  d3.select("#drawer").classed("on",true);d3.select("#scrim").classed("on",true);
  d3.select("#tipbar").classed("off",true);
  const mappable=["regions","stores","cats","days"].some(x=>DR.keys[x]&&DR.keys[x].length);
  d3.select("#d-filter").style("display",mappable?null:"none");
  d3.select("#d-back").style("display",DR.stack.length?null:"none");
  const first=document.getElementById("d-close");if(first&&first.focus)try{first.focus();}catch(e){}
  drawDrill();

function exportCSV(rows,name){

function stateToHash(){
  const p=["b="+S.board,"v="+(S.view[S.board]||"")];
  if(S.regions.size)p.push("r="+Array.from(S.regions).join("."));
  if(S.store!==null)p.push("s="+S.store);
  if(S.cats.size)p.push("c="+Array.from(S.cats).join("."));
  if(S.days.size)p.push("d="+Array.from(S.days).join("."));
  if(!S.anon)p.push("a=0");
  if(S.viz)p.push("z=1");
  if(S.viz&&S.dc&&S.dc!=="all")p.push("g="+S.dc);
  if(S.rail===0)p.push("n=0");
  try{history.replaceState(null,"","#"+p.join("&"));}catch(e){}
}
function hashToState(){
  try{
    const h=(location.hash||"").replace(/^#/,"");if(!h)return false;
    const q={};h.split("&").forEach(kv=>{const i=kv.indexOf("=");if(i>0)q[kv.slice(0,i)]=kv.slice(i+1);});
    const num=v=>v.split(".").map(Number).filter(n=>isFinite(n));
    if(q.b&&BOARDS.some(b=>b.id===q.b))S.board=q.b;
    if(q.v)S.view[S.board]=q.v;
    if(q.r)S.regions=new Set(num(q.r));
    if(q.s!==undefined&&q.s!=="")S.store=+q.s;
    if(q.c)S.cats=new Set(num(q.c));
    if(q.d)S.days=new Set(num(q.d));
    if(q.a==="0")S.anon=false;
    if(q.g&&DCATS.some(c=>c.k===q.g))S.dc=q.g;
    if(q.n==="0"){S.rail=0;document.body.classList.add("railoff");
      d3.select("#flt-rail").classed("on",true).text("› 导航");}
    if(q.z==="1"&&!S.viz){S.viz=true;document.body.classList.add("viz");
      d3.select("#flt-viz").classed("on",true).text("退出通览");}
    return true;
  }catch(e){return false;}
}

/* 弹层用固定定位，按触发按钮的实际位置摆放，避免被任何滚动容器裁剪 */
function placePop(el,btn,align){
  if(!el||!btn||!btn.getBoundingClientRect)return;
  const r=btn.getBoundingClientRect();
  el.style.visibility="hidden";el.style.display="block";
  const w=el.offsetWidth||260,h=el.offsetHeight||160;
  let x=align==="right"?r.right-w:r.left;
  x=Math.max(8,Math.min(x,(window.innerWidth||1200)-w-8));
  let y=r.bottom+7;
  if(y+h>(window.innerHeight||800)-8)y=Math.max(8,r.top-h-7);
  el.style.left=x+"px";el.style.top=y+"px";
  el.style.display="";el.style.visibility="";
}

  const rank=x=>{const n=x.nm.toLowerCase();if(!q)return 0;
    return n.startsWith(q)?0:n.indexOf(q)>=0?1:2;};
  PAL.hits=PAL.items.filter(x=>!q||x.nm.toLowerCase().includes(q)||(x.sub||"").toLowerCase().includes(q))
    .sort((a,b)=>rank(a)-rank(b)).slice(0,60);
  if(PAL.sel>=PAL.hits.length)PAL.sel=0;
  const list=d3.select("#pal-list");
  if(!PAL.hits.length){list.html(`<div class="empty">没有匹配项。试试门店号、单品名或「清空」。</div>`);
    d3.select("#pal-cnt").text("");return;}
  list.html(PAL.hits.map((x,i)=>`<div class="row ${i===PAL.sel?"sel":""}" data-i="${i}">
    <span class="ty">${x.ty}</span><span class="nm">${palMark(x.nm,q)}</span><span class="sub">${x.sub||""}</span></div>`).join(""));
  d3.select("#pal-cnt").text(`${PAL.hits.length} 项`);
  list.selectAll(".row").on("mouseenter",function(){PAL.sel=+this.dataset.i;
      list.selectAll(".row").classed("sel",function(){return +this.dataset.i===PAL.sel;});})
    .on("click",function(){palGo(+this.dataset.i);});
  const cur=list.select(".row.sel").node();
  if(cur&&cur.scrollIntoView)cur.scrollIntoView({block:"nearest"});
}
function palGo(i){const x=PAL.hits[i];closePal();if(x&&x.go)x.go();}
function openPal(){
  PAL.items=palIndex();PAL.sel=0;

}

function openHelp(){
  d3.select("#help-grid").html(HELPITEMS.map(h=>`<div class="it"><b>${h[0]}</b><span>${h[1]}</span></div>`).join(""));
  d3.select("#helpwrap").classed("on",true);
}
function closeHelp(){d3.select("#helpwrap").classed("on",false);}
/* 打印：先把当前看板的所有视图都渲染出来，再交给浏览器 */
function printBoard(){
  const b=BOARDS.find(x=>x.id===S.board);if(!b)return;
  b.views.filter(viewHasChart).forEach(v=>{
    const el=document.getElementById(b.id+"__"+v.id);
    if(el)el.setAttribute("data-vname",b.nav+" · "+v.name);
    v.rows.forEach(r=>r.cells.filter(p=>panelVisible(p.k)).forEach(p=>{const f=(typeof DRAW!=="undefined")&&DRAW[p.k];
      if(f)try{f();}catch(e){console.warn("print "+p.k,e);}}));});
  const a=agg(view()),f=[];
  if(S.regions.size)f.push("区域 "+Array.from(S.regions).map(regName).join("、"));
  if(S.store!==null)f.push("门店 "+storeName(S.store));
  if(S.cats.size)f.push("品类 "+Array.from(S.cats).map(c=>D.cats[c]).join("、"));
  if(S.days.size)f.push("日期 "+Array.from(S.days).map(dlabel).join("、"));
  d3.select("#printhead").html(`<div style="font-family:var(--serif);font-size:15px">${b.g} / ${b.nav}</div>
    <div style="font-size:11px;color:#555;margin-top:3px">口径：${f.length?f.join(" · "):"全量"} ·
    ${F.n(view().length)} 条记录 · ${a.stores} 店 · ${a.skus} 个单品 · ${a.days} 天 ·
    销售额 ${F.yuan(a.rev)} · 导出于 ${new Date().toLocaleString("zh-CN")}</div>`);
  setTimeout(()=>{try{window.print();}catch(e){}},60);
}
function closeMax(){d3.selectAll(".panel.max").classed("max",false);
  d3.selectAll("[data-max]").text("放大");d3.select("#maxscrim").classed("on",false);}
function bindShell(){
  bindTopbar();
  d3.select("#maxscrim").on("click",closeMax);
  d3.select("#flt-viz").on("click",()=>setViz(!S.viz));
  const rail=on=>{document.body.classList.toggle("railoff",on);
    d3.select("#flt-rail").classed("on",on).text(on?"› 导航":"‹ 导航");
    S.rail=on?0:1;stateToHash();};
  d3.select("#flt-rail").on("click",()=>rail(!document.body.classList.contains("railoff")));
  d3.select("#rail-close").on("click",()=>rail(true));
  d3.select("#flt-dense").on("click",function(){
    const on=!document.body.classList.contains("compact");
    document.body.classList.toggle("compact",on);
    d3.select(this).classed("on",on).text(on?"切回标准间距":"切换紧凑模式");
    ANIM_NEXT=false;render();});
  d3.select("#flt-pal").on("click",openPal);
  d3.select("#flt-help").on("click",openHelp);
  d3.select("#flt-print").on("click",printBoard);
  d3.select("#help-close").on("click",closeHelp);
  d3.select("#helpwrap").on("click",function(e){if(e.target===this)closeHelp();});
  d3.select("#palwrap").on("click",function(e){if(e.target===this)closePal();});
  d3.select("#tipbar-x").on("click",()=>d3.select("#tipbar").classed("off",true));
  const q=document.getElementById("pal-q");
  if(q){q.addEventListener("input",palRender);
    q.addEventListener("keydown",e=>{
      if(e.key==="ArrowDown"){e.preventDefault();PAL.sel=Math.min(PAL.sel+1,PAL.hits.length-1);palRender();}
      else if(e.key==="ArrowUp"){e.preventDefault();PAL.sel=Math.max(PAL.sel-1,0);palRender();}
      else if(e.key==="Enter"){e.preventDefault();palGo(PAL.sel);}
      else if(e.key==="Escape"){e.preventDefault();closePal();}});}
  document.addEventListener("keydown",e=>{
    const typing=/^(INPUT|TEXTAREA|SELECT)$/.test((e.target&&e.target.tagName)||"");
    if((e.metaKey||e.ctrlKey)&&(e.key==="k"||e.key==="K")){e.preventDefault();
      d3.select("#palwrap").classed("on")?closePal():openPal();return;}
    if(typing)return;
    if(e.key==="?"||(e.shiftKey&&e.key==="/")){e.preventDefault();openHelp();}
    if(e.key==="v"||e.key==="V"){e.preventDefault();setViz(!S.viz);}
    if(e.key==="\\"){e.preventDefault();
      const on=!document.body.classList.contains("railoff");
      document.body.classList.toggle("railoff",on);
      d3.select("#flt-rail").classed("on",on).text(on?"› 导航":"‹ 导航");S.rail=on?0:1;stateToHash();}
    if(e.key==="Escape"){closePal();closeHelp();closeMax();}
    if(e.key==="/"){e.preventDefault();openPal();}
  });
}

/* ==================== 8. 筛选条与面包屑 ==================== */
function buildFilters(){
  d3.select("#flt-region").selectAll("button").data(d3.range(D.regions.length)).join("button")
    .attr("class","chip tiny").text(d=>regName(d))
    .on("click",(e,d)=>{S.regions.has(d)?S.regions.delete(d):S.regions.add(d);S.store=null;
      d3.select("#flt-store").property("value",-1);render();});
  const sel=d3.select("#flt-store");
  sel.selectAll("option").data([-1].concat(d3.range(D.stores.length))).join("option")
    .attr("value",d=>d).text(d=>d<0?"全部门店":storeName(d)+"（"+regShort(D.storeRegion[d])+"）");
  sel.property("value",S.store===null?-1:S.store);
  sel.on("change",function(){S.store=+this.value<0?null:+this.value;render();});
  d3.select("#flt-cat").selectAll("button").data(D.cats.slice(0,8).map(c=>D.cats.indexOf(c))).join("button")
    .attr("class","chip tiny").text(d=>D.cats[d])
    .on("click",(e,d)=>{S.cats.has(d)?S.cats.delete(d):S.cats.add(d);render();});
  d3.select("#flt-date").selectAll("button").data(d3.range(D.days)).join("button")
    .attr("class","chip tiny").text(d=>dlabel(d).slice(0,5)+(HOLIDAY.includes(d)?"·假":""))
    .on("click",(e,d)=>{S.days.has(d)?S.days.delete(d):S.days.add(d);render();});
  d3.select("#flt-reset").on("click",()=>{S.regions.clear();S.cats.clear();S.days.clear();S.store=null;
    d3.select("#flt-store").property("value",-1);render();});
  d3.select("#flt-anon").on("click",()=>{S.anon=!S.anon;
    d3.select("#flt-anon").classed("on",S.anon).text(S.anon?"门店名已脱敏":"显示原始门店号");
    buildFilters();render();});
  d3.select("#flt-help").on("click",openHelp);
  d3.select("#flt-link").on("click",function(){
    stateToHash();
    const url=location.href,btn=d3.select(this);
    const done=()=>{btn.text("链接已复制");setTimeout(()=>btn.text("复制当前视图链接"),1600);};
    try{if(navigator.clipboard&&navigator.clipboard.writeText)navigator.clipboard.writeText(url).then(done,done);else done();}
    catch(e){done();}});
  d3.select("#navtoggle").on("click",()=>d3.select("#nav").classed("on",!d3.select("#nav").classed("on")));
  d3.select("#flt-raw").on("click",()=>openDrill({kick:"数据穿透",title:"当前口径的全部原始记录",keys:{},
    note:"一行 = 一个门店 × 一天 × 一个单品"}));
}
function syncFilterUI(){
  d3.select("#flt-region").selectAll("button").classed("on",d=>S.regions.has(d));
  d3.select("#flt-cat").selectAll("button").classed("on",d=>S.cats.has(d));
  d3.select("#flt-date").selectAll("button").classed("on",d=>S.days.has(d));
  const v=view(),a=agg(v);
  const cr=[];
  S.regions.forEach(r=>cr.push([`区域 <b>${regName(r)}</b>`,()=>S.regions.delete(r)]));
  if(S.store!==null)cr.push([`门店 <b>${storeName(S.store)}</b>`,()=>{S.store=null;d3.select("#flt-store").property("value",-1);}]);
  S.cats.forEach(c=>cr.push([`品类 <b>${D.cats[c]}</b>`,()=>S.cats.delete(c)]));
  S.days.forEach(d=>cr.push([`日期 <b>${dlabel(d)}</b>`,()=>S.days.delete(d)]));
  const host=d3.select("#crumbs");
  host.classed("off",!cr.length);
  host.html(cr.length?"":`<span>全量口径</span>`);
  cr.forEach((c,i)=>host.append("span").attr("class","crumb").html(c[0]+`<x data-i="${i}">✕</x>`));
  host.append("span").attr("class","fnote").style("margin-left","auto")
    .html(`<b>${F.n(v.length)}</b> 条记录 · ${a.stores} 店 · ${a.skus} 个单品 · ${a.days} 天 · 销售额 <b>${F.yuan(a.rev)}</b>`);
  host.selectAll("x").on("click",function(){ANIM_NEXT=true;cr[+this.dataset.i][1]();render();});
  /* 口径胶囊：把当前筛选写成一句可读的话 */
  const lab=(sel,txt,act)=>{d3.select(sel).text(txt);
    const b=document.querySelector(sel);if(b&&b.closest(".scopebtn"))b.closest(".scopebtn").classList.toggle("act",!!act);};
  const rs=Array.from(S.regions);
  lab("#lb-region",rs.length?(regName(rs[0])+(rs.length>1?" +"+(rs.length-1):"")):"全部",rs.length);
  lab("#lb-store",S.store===null?"全部":storeName(S.store),S.store!==null);
  const cs=Array.from(S.cats);
  lab("#lb-cat",cs.length?(D.cats[cs[0]]+(cs.length>1?" +"+(cs.length-1):"")):"全部",cs.length);
  const ds=Array.from(S.days).sort(d3.ascending);
  lab("#lb-date",ds.length?(ds.length===1?dlabel(ds[0]).slice(0,5):dlabel(ds[0]).slice(0,5)+"起 "+ds.length+" 天"):"全部 "+a.days+" 天",ds.length);
  d3.select("#flt-reset").classed("act",rs.length||cs.length||ds.length||S.store!==null);
  d3.select("#brand-scope").text(`${a.stores} 店 · ${a.skus} 单品 · ${a.days} 天 · ${F.n(v.length)} 条`);
  try{drawPulse();drawRibbon();}catch(e){console.warn("pulse",e);}
  d3.select("#flt-count").html(`当前口径：${F.n(v.length)} 条记录 · ${a.stores} 店 · ${a.skus} 个单品 · ${a.days} 天 · 销售额 ${F.yuan(a.rev)}`);
  d3.select("#brand-sub").text(`${BOARDS.length} 块看板 · ${BOARDS.reduce((n,b)=>n+b.views.length,0)} 个视图`);
}
</script>

<script>
/* ============================ 2. 平衡式流向图 ============================ */
function drawSankey(){
  const a=agg(view()),W=980,H=310,LBW=104,m={t:26,r:LBW,b:22,l:LBW};
  const inN=[["早上留下的货",a.open,"o"],["当天出炉/收货",a.recv,"rc"],["门店调拨与盘点",a.xfer+a.adj,"xa"]];
  const outN=[["卖给顾客",a.sales,"sl"],["当天报废",a.waste,"w"],["留到隔天",a.close,"cl"]];
  const tot=Math.max(a.avail,1);
  const {svg,g,iw,ih}=canvas("#c-sankey",W,H,m);
  const GAP=5,y=d3.scaleLinear().domain([0,tot]).range([0,ih-24-GAP*2]);
  const xL=0,wN=132,xM=(iw-wN)/2,xR=iw-wN;
  const NC={o:SEM.open,rc:SEM.recv,xa:C.ink4,sl:SEM.sales,w:SEM.waste,cl:SEM.left};
  let yy=0;const inP=inN.map(d=>{const o={...{}, name:d[0],v:Math.max(d[1],0),key:d[2],y0:yy,h:y(Math.max(d[1],0))};yy+=o.h+GAP;return o;});
  const offI=(ih-24-(yy-GAP))/2; inP.forEach(d=>d.y0+=offI);
  yy=0;const outP=outN.map(d=>{const o={name:d[0],v:d[1],key:d[2],y0:yy,h:y(d[1])};yy+=o.h+GAP;return o;});
  const offO=(ih-24-(yy-GAP))/2; outP.forEach(d=>d.y0+=offO);
  const midH=y(tot),midY=(ih-24-midH)/2;
  // links
  const link=(x0,y0,x1,y1,h,c)=>{const cx=(x0+x1)/2;
    return `M${x0},${y0} C${cx},${y0} ${cx},${y1} ${x1},${y1} L${x1},${y1+h} C${cx},${y1+h} ${cx},${y0+h} ${x0},${y0+h} Z`;};
  let acc=midY;
  inP.forEach(d=>{g.append("path").attr("d",link(xL+wN,d.y0,xM,acc,d.h,NC[d.key]))
    .attr("fill",NC[d.key]).attr("opacity",.34).call(s=>hov(s,()=>tipHTML(d.name,[["件数",F.n(d.v)],["占可动用",F.p1(d.v/tot)]],false)));acc+=d.h;});
  acc=midY;
  outP.forEach(d=>{const p=g.append("path").attr("d",link(xM+wN,acc,xR,d.y0,d.h,NC[d.key]))
    .attr("fill",NC[d.key]).attr("opacity",.42).call(s=>hov(s,()=>tipHTML(d.name,[["件数",F.n(d.v)],["占可动用",F.p1(d.v/tot)],
      ["按售价折算",F.yuan(d.key==="sl"?a.rev:d.key==="w"?a.wval:a.clval)]])));
    drillable(p,()=>({kick:"按去向下钻",title:d.name,keys:{},
      pred:d.key==="sl"?(o=>o.sl>0):d.key==="w"?(o=>o.w>0):(o=>o.cl>0),
      note:"「"+d.name+"」件数大于零的原始记录"}));acc+=d.h;});
  const node=(x,d,align)=>{const gg=g.append("g");
    gg.append("rect").attr("x",x).attr("y",d.y0).attr("width",wN).attr("height",Math.max(d.h,2)).attr("fill",NC[d.key]).attr("rx",2);
    gg.append("text").attr("x",x+wN/2).attr("y",d.y0+d.h/2-2).attr("text-anchor","middle").attr("fill","#fff")
      .style("font-size","12px").style("font-weight",600).text(d.h>26?d.name:"");
    gg.append("text").attr("x",x+wN/2).attr("y",d.y0+d.h/2+13).attr("text-anchor","middle").attr("fill","#fff")
      .style("font-size","11px").text(d.h>26?F.n(d.v)+" 件":"");
    if(d.h<=26){gg.append("text").attr("x",align==="l"?x+wN+7:x-7).attr("y",d.y0+d.h/2+4)
      .attr("text-anchor",align==="l"?"start":"end").attr("fill",C.ink2).style("font-size","11px")
      .text(clipToWidth(d.name+" "+F.n(d.v),LBW-12,11))
      .append("title").text(d.name+" "+F.n(d.v)+" 件");}
  };
  inP.forEach(d=>node(xL,d,"r")); outP.forEach(d=>node(xR,d,"l"));
  g.append("rect").attr("x",xM).attr("y",midY).attr("width",wN).attr("height",midH).attr("fill",C.ink).attr("rx",2);
  g.append("text").attr("x",xM+wN/2).attr("y",midY+midH/2-4).attr("text-anchor","middle").attr("fill","#fff")
    .style("font-size","12.5px").style("font-weight",600).text("当天可动用的货");
  g.append("text").attr("x",xM+wN/2).attr("y",midY+midH/2+14).attr("text-anchor","middle").attr("fill","#fff")
    .style("font-size","12px").text(F.n(a.avail)+" 件");
  [[xL+wN/2,"进：当天可以卖的货从哪来"],[xM+wN/2,"合"],[xR+wN/2,"出：这些货最后去了哪"]].forEach(d=>{
    g.append("text").attr("x",d[0]).attr("y",-11).attr("text-anchor","middle").attr("fill",C.ink3).style("font-size","11px").text(d[1]);});
  outP.forEach(d=>{if(d.h>26)g.append("text").attr("x",xR+wN/2).attr("y",d.y0+d.h/2+26).attr("text-anchor","middle")
    .attr("fill","#fff").style("font-size","10.5px").text(F.p1(d.v/tot));});
  legend("#l-sankey",[{c:SEM.open,t:"早上留下的货"},{c:SEM.recv,t:"当天出炉／收货"},{c:C.ink4,t:"调拨与盘点"},
    {c:SEM.sales,t:"卖给顾客"},{c:SEM.waste,t:"当天报废"},{c:SEM.left,t:"留到隔天"}],"点击右侧任一去向下钻到对应记录");
  d3.select("#f-sankey").html(tagLine([TAG.m,
    `平衡式 <code>早上库存 + 收货 + 调拨 + 盘点调整 − 报废 − 销售 = 打烊剩余</code>`,
    `售罄率 = 销售 ÷ 可动用 = ${F.n(a.sales)} ÷ ${F.n(a.avail)} = <b>${F.p1(sr(a))}</b>`,
    `报废件率 = ${F.n(a.waste)} ÷ ${F.n(a.avail)} = <b>${F.p1(wr(a))}</b>`,
    `顾客退货 ${F.n(a.cr)} 件不进入本式（原表口径：退货已在销售数内轧差）`]));
}

function drawBalance(){
  const v=view(),diff=d3.rollup(v,g=>g.length,d=>d.o+d.rc+d.x+d.a-d.w-d.sl-d.cl);
  const arr=Array.from(diff,([k,n])=>({k,n})).sort((a,b)=>a.k-b.k);
  const W=470,H=180,{g,iw,ih}=canvas("#c-balance",W,H,{t:12,r:14,b:34,l:52});
  const x=d3.scaleBand().domain(arr.map(d=>d.k)).range([0,iw]).padding(.3);
  const y=d3.scaleLinear().domain([0,d3.max(arr,d=>d.n)]).nice().range([ih,0]);
  axes(g,x,y,iw,ih,{xAxis:d3.axisBottom(x).tickSize(4),yf:F.n});
  g.selectAll("rect.b").data(arr).join("rect").attr("class","b").attr("x",d=>x(d.k)).attr("y",d=>y(d.n))
    .attr("width",x.bandwidth()).attr("height",d=>ih-y(d.n)).attr("fill",d=>d.k===0?SEM.ok:SEM.bad)
    .call(s=>hov(s,d=>tipHTML("平衡式差值 "+d.k,[["记录数",F.n(d.n)+" 条"],["占比",F.p1(d.n/v.length)]])))
    .call(s=>drillable(s,d=>({kick:"按校验结果下钻",title:"平衡式差值 = "+d.k+" 的记录",keys:{},
      pred:o=>(o.o+o.rc+o.x+o.a-o.w-o.sl-o.cl)===d.k})));
  g.selectAll("text.v").data(arr).join("text").attr("class","v").attr("x",d=>x(d.k)+x.bandwidth()/2)
    .attr("y",d=>y(d.n)-5).attr("text-anchor","middle").style("font-size","11px").attr("fill",C.ink2).text(d=>F.n(d.n));
  g.append("text").attr("class","axt").attr("x",iw).attr("y",ih+30).attr("text-anchor","end").text("左右两侧差值（件）");
  legend("#l-balance",[{c:SEM.ok,t:"差值为 0：账实相符"},{c:SEM.bad,t:"差值非 0：需要查账"}],"点击柱子下钻");
  d3.select("#f-balance").html(tagLine([TAG.m,
    `逐行计算 <code>左侧 − 右侧</code>，${F.n(v.length)} 条全部为 0`,
    `若换一套数据后出现非 0，说明该行存在未记账的损耗或串码`]));
}

function drawFlowMoney(){flowMoney("#c-flowmoney","#f-flowmoney","#l-flowmoney");}
function drawFlowMoney2(){flowMoney("#c-flowmoney2","#f-flowmoney2","#l-flowmoney2");}
function flowMoney(sel,fsel,lsel){
  const a=agg(view()),W=470,H=190,{g,iw,ih}=canvas(sel,W,H,{t:14,r:76,b:38,l:74});
  const dat=[{k:"卖给顾客",v:a.rev,c:SEM.sales,p:o=>o.sl>0},{k:"当天报废",v:a.wval,c:SEM.waste,p:o=>o.w>0},{k:"留到隔天",v:a.clval,c:SEM.left,p:o=>o.cl>0}];
  const tot=d3.sum(dat,d=>d.v);
  const y=d3.scaleBand().domain(dat.map(d=>d.k)).range([0,ih]).padding(.32);
  const x=d3.scaleLinear().domain([0,d3.max(dat,d=>d.v)]).range([0,iw]);
  g.append("g").attr("class","ax").call(d3.axisLeft(y).tickSize(0));
  g.append("g").attr("class","ax").attr("transform",`translate(0,${ih})`).call(d3.axisBottom(x).ticks(4).tickFormat(F.money));
  const bars=g.selectAll("rect.b").data(dat).join("rect").attr("class","b").attr("y",d=>y(d.k)).attr("height",y.bandwidth())
    .attr("width",d=>x(d.v)).attr("fill",d=>d.c).attr("rx",2)
    .call(s=>hov(s,d=>tipHTML(d.k,[["金额",F.yuan(d.v)],["占按售价计的货值",F.p1(d.v/tot)]])));
  drillable(bars,d=>({kick:"按去向下钻",title:d.k,keys:{},pred:d.p}));
  const vtxt=d=>F.yuan(d.v)+"（"+F.p1(d.v/tot)+"）";
  const inside=d=>x(d.v)+7+estW(vtxt(d),11.5)>iw+60;   // 放不下就压进柱内，避免伸出画布
  g.selectAll("text.v").data(dat).join("text").attr("class","v")
    .attr("x",d=>inside(d)?x(d.v)-7:x(d.v)+7).attr("y",d=>y(d.k)+y.bandwidth()/2+4)
    .attr("text-anchor",d=>inside(d)?"end":"start")
    .style("font-size","11.5px").attr("fill",d=>inside(d)?"#fff":C.ink2).text(vtxt);
  g.append("text").attr("class","axt").attr("x",iw).attr("y",ih+32).attr("text-anchor","end").text("金额 = 件数 × 当日售价（元）");
  legend(lsel,[{c:SEM.sales,t:"卖给顾客"},{c:SEM.waste,t:"当天报废"},{c:SEM.left,t:"留到隔天"}],"点击柱子下钻");
  d3.select(fsel).html(tagLine([TAG.m,
    `金额 = 件数 × 当日售价（原表 <code>销售额 = 销售 × 销售价</code> 已 100% 复核）`,
    `报废额占销售额 <b>${F.p1(a.rev?a.wval/a.rev:0)}</b>`,
    `留到隔天的货按售价计 ${F.yuan(a.clval)}，其中家庭装等长保商品可正常次日销售，短保部分会转为次日报废`]));
}
