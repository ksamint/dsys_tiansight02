<!doctype html><html lang="zh"><head><meta charset="utf-8"><link rel="stylesheet" href="../../dist/components/2026.10.21-e0a760/styles.css">
<style>html,body{margin:0}body{background:var(--surface-page);padding:20px;font-family:var(--font-body)}.lbl{font-size:11px;letter-spacing:.16em;text-transform:uppercase;color:var(--text-muted);margin-bottom:10px}</style><script src="../../dist/components/2026.10.21-e0a760/vendor/react.min.js"></script>

</head><body><div id="root"></div>
<script type="text/babel">
const NS = window.TIANSIGHTDesignSystem_e0a760;
const { FacetBars } = NS;
const rnd = (seed => () => { seed = (seed * 9301 + 49297) % 233280; return seed / 233280; })(3);
const shifts = ["午市","晚市","夜宵"], regions = ["城北","河西","旗舰","开发区","老城"];
const base = { 午市: .08, 晚市: .46, 夜宵: .21 }, lift = { 城北: 1.4, 河西: 1.0, 旗舰: 1.2, 开发区: .7, 老城: .9 };
const facts = [];
shifts.forEach(s => regions.forEach(r => { const n = 60 + Math.floor(rnd() * 80); for (let i = 0; i < n; i++) facts.push({ 市别: s, 区域: r, 带率: rnd() < base[s] * lift[r] ? 1 : 0 }); }));
function Demo(){
  return <FacetBars caption="配菜带率 · 市别 × 区域" rows={facts} dims={["市别","区域"]} measure="带率" agg="mean" percent columns={3} panelHeight={130}
    highlight="城北" scope="堂食账单；带配菜账单数 ÷ 全部账单数" note="晚市带率约为午市的 5.8 倍" />;
}
ReactDOM.createRoot(document.getElementById('root')).render(<Demo/>);
</script></body></html>
