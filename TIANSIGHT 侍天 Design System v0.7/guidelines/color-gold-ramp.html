<!doctype html><html lang="zh-Hans"><head><meta charset="utf-8"><link rel="stylesheet" href="../styles.css">
<style>body{margin:0;padding:20px 24px;background:var(--surface)} .row{display:flex;gap:12px;flex-wrap:wrap;align-items:flex-start} .sw{display:flex;flex-direction:column;gap:6px;flex:1;min-width:90px} .sw i{display:block;height:44px;border-radius:var(--radius);border:1px solid var(--line)} .sw b{font-family:var(--font-mono);font-size:11px;font-weight:400;color:var(--text-muted)} .sw span{font-size:13px}</style></head><body><div class="row"><div class="sw"><i style="background:#F3E7CF"></i><span>100</span><b>--gold-100 #F3E7CF</b></div><div class="sw"><i style="background:#D4A862"></i><span>300 = 明金</span><b>--gold-300 #D4A862</b></div><div class="sw"><i style="background:#A8842F"></i><span>400</span><b>--gold-400 #A8842F</b></div><div class="sw"><i style="background:#76551F"></i><span>500 = 土金</span><b>--gold-500 #76551F</b></div><div class="sw"><i style="background:#5C4218"></i><span>600 hover</span><b>--gold-600 #5C4218</b></div><div class="sw"><i style="background:#3F2D0F"></i><span>700 press</span><b>--gold-700 #3F2D0F</b></div></div></body></html>
