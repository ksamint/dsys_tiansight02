<!doctype html><html lang="zh"><head><meta charset="utf-8"><title>侍天 经营诊断报告 V4.2</title>
<link rel="stylesheet" href="../../styles.css">
<script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
<script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
<script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>
<script src="https://unpkg.com/d3@7.9.0/dist/d3.min.js"></script>
<script src="../../_ds_bundle.js"></script>
</head><body>
<div id="root"></div>
<script type="text/babel" src="ReportShell.jsx"></script>
<script type="text/babel" src="DecisionPage.jsx"></script>
<script type="text/babel" src="AnalysisPage.jsx"></script>
<script type="text/babel" src="TrendPage.jsx"></script>
<script type="text/babel" src="MethodMapPage.jsx"></script>
<script type="text/babel" data-presets="react">
function Reader(){
  const [page,setPage]=React.useState("decision");
  const [only,setOnly]=React.useState(false);
  return <ReportShell page={page} onPage={setPage} onlyAnomalies={only} onToggle={setOnly}>
    {page==="decision"?<DecisionPage onlyAnomalies={only}/>:page==="analysis"?<AnalysisPage/>:page==="trend"?<TrendPage/>:<MethodMapPage/>}
  </ReportShell>;
}
function mount(){
  if(!window.ReportShell||!window.MethodMapPage||!window.TrendPage){return setTimeout(mount,60);}
  ReactDOM.createRoot(document.getElementById("root")).render(<Reader/>);
}
mount();
</script>
</body></html>
