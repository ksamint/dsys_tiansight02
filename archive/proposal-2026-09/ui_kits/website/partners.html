<!doctype html><html lang="zh"><head><meta charset="utf-8"><title>侍天 · 伙伴与专家</title>

<script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
<script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>

</head><body><div id="root"></div>
<script type="text/babel" src="SiteHeader.jsx"></script>
<script type="text/babel" src="PartnersPage.jsx"></script>
<script type="text/babel" src="ClosingCTA.jsx"></script>
<script type="text/babel" data-presets="react">
function Page(){
  const onNav = id => { const el=document.getElementById(id); if(el) window.scrollTo({top:el.offsetTop-64,behavior:"smooth"}); };
  return <React.Fragment>
    <SiteHeader onNav={onNav} active="partners"/>
    <PartnersPage onNav={onNav}/>
    <ClosingCTA/>
  </React.Fragment>;
}
function mount(){
  if(!window.SiteHeader||!window.PartnersPage||!window.ClosingCTA){return setTimeout(mount,60);}
  ReactDOM.createRoot(document.getElementById("root")).render(<Page/>);
}
mount();
</script></body></html>
