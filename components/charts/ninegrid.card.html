</head><body><div id="root"></div>
<script type="text/babel">
const NS = window.TIANSIGHTDesignSystem_e0a760;
const { NineGrid, STRUCTURE_PRESETS, DIMENSION_LABELS } = NS;
const rnd = (seed => () => { seed = (seed * 9301 + 49297) % 233280; return seed / 233280; })(9);
const pick = (a) => a[Math.floor(rnd() * a.length)];
const FLAVOR = ["咸鲜","江南咸甜","酱香浓郁","清鲜本味","糟醉酒香","酸甜","微辣融合"], CRAFT = ["清炒","红烧","清蒸","白灼","糟卤","油爆","炖煮","凉拌","炸","烤"];

function Demo(){
  const [p, setP] = React.useState(-1);
  const [row, col] = STRUCTURE_PRESETS[p] || ["flavor","craft"];
  return <div style={{display:'flex',flexDirection:'column',gap:14}}>
    <div style={{display:'flex',gap:6,flexWrap:'wrap',alignItems:'center'}}>
