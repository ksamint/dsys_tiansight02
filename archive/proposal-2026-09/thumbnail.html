<!doctype html><html lang="zh"><head><meta charset="utf-8"><link rel="stylesheet" href="styles.css"><style>html,body{margin:0}.tile{width:1280px;height:854px;display:grid;grid-template-columns:1fr 320px}.main{background:var(--parchment-200);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:40px}.main img{width:300px;height:300px}.name{font-family:var(--font-display);font-weight:500;font-size:150px;line-height:1;letter-spacing:.08em;color:var(--bronze-600);margin-right:-.08em}.strip{display:grid;grid-template-rows:repeat(4,1fr)}.strip div{width:100%;height:100%}</style></head><body><div class="tile"><div class="main"><img src="assets/logo-seal.png" alt="侍天"><div class="name">侍天</div></div><div class="strip"><div style="background:var(--caution-500)"></div><div style="background:var(--bronze-500)"></div><div style="background:var(--growth-500)"></div><div style="background:var(--ink-900)"></div></div></div></body></html>
