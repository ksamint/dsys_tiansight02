<!-- @dsCard group="Brand" viewport="700x150" name="Motion" subtitle="Fade + ≤12px rise. No bounce, no parallax" -->
<!doctype html><html><head><meta charset="utf-8"><link rel="stylesheet" href="../styles.css"><style>html,body{margin:0}body{background:var(--surface-page);padding:18px 20px;font-family:var(--font-body)}.g{display:flex;gap:10px}.sw{flex:1;display:flex;flex-direction:column;justify-content:flex-end;height:96px;border-radius:var(--radius-sm);padding:8px 10px;border:1px solid var(--line-hairline)}.sw b{font-family:var(--font-mono);font-size:10px;font-weight:500;letter-spacing:0}.sw i{font-family:var(--font-mono);font-size:9px;font-style:normal;opacity:.65}.k{font-family:var(--font-mono);font-size:10px;color:var(--text-muted)}@keyframes rise{from{opacity:0;transform:translateY(12px)}to{opacity:1;transform:none}}@keyframes grow{from{width:0}to{width:100%}}.t{font-family:var(--font-mono);font-size:10px;color:var(--text-muted)}</style></head><body>
<div style="display:flex;gap:40px;align-items:center">
<div><div style="font-family:var(--font-display);font-size:24px;color:var(--text-display);animation:rise var(--dur-reveal) var(--ease-out) infinite alternate">增长在何处</div><div class="t">reveal 700ms ease-out · fade + 12px</div></div>
<div style="width:200px"><div style="height:1.5px;background:var(--bronze-500);animation:grow 1.4s var(--ease-standard) infinite alternate"></div><div class="t" style="margin-top:8px">rule grow 220ms ease-standard</div></div>
</div></body></html>
