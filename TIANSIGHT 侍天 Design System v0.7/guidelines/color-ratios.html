<!doctype html><html lang="zh-Hans"><head><meta charset="utf-8"><link rel="stylesheet" href="../styles.css">
<style>body{margin:0;padding:20px 24px;background:var(--surface)} .row{display:flex;gap:12px;flex-wrap:wrap;align-items:flex-start} .sw{display:flex;flex-direction:column;gap:6px;flex:1;min-width:90px} .sw i{display:block;height:44px;border-radius:var(--radius);border:1px solid var(--line)} .sw b{font-family:var(--font-mono);font-size:11px;font-weight:400;color:var(--text-muted)} .sw span{font-size:13px}</style></head><body><div style="display:flex;height:40px;border:1px solid var(--line);border-radius:var(--radius);overflow:hidden"><span style="flex:78;background:var(--surface)"></span><span style="flex:12;background:var(--charcoal)"></span><span style="flex:7;background:var(--ink-primary)"></span><span style="flex:3;background:var(--gold)"></span><span style="flex:2;background:var(--seal)"></span></div><div style="display:flex;justify-content:space-between;margin-top:10px;font-size:13px;color:var(--text-muted)"><span>pale ≈78%</span><span>charcoal ≈12%</span><span>ink ≈7%</span><span>gold ≈3%</span><span>seal ≤5%</span></div></body></html>
