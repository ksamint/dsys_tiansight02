      showTip(ev,tipHTML(d.name,[["品类",D.cats[d.cat]],["售价",F.n1(d.price)+" 元"],
        ["店日均销量",F.n1(d.rate)+" 件"],["同价位拟合值",F.n1(pred)+" 件"],
        ["相对拟合",(d.rate/pred-1>=0?"+":"")+F.p1(d.rate/pred-1)],["报废率",F.p1(d.wrr)]]));},
    leave:()=>ring.attr("opacity",0),
    click:d=>openDrill({kick:"按单品下钻",title:d.name,keys:{skus:[d.k]}})});
  legend("#l-elastic",Array.from(new Set(arr.map(d=>d.cat))).slice(0,8).map(c=>({c:CATCOLOR(D.cats[c]),t:D.cats[c],hl:"c"+c}))
    .concat([{c:C.c1,shape:"line",t:"对数-对数拟合线"}]),
    `圆面积 ∝ 销售额 · 落在线上方的单品「同价更好卖」`);
  d3.select("#f-elastic").html(tagLine([TAG.m,TAG.d,
    `拟合式：<code>ln(店日均销量) = ${a0.toFixed(2)} + ${b.toFixed(2)} × ln(售价)</code>，样本 ${arr.length} 个单品`,
    `斜率 <b>${b.toFixed(2)}</b> 可读作横截面价格弹性：售价高 1%，店日均销量低约 ${Math.abs(b).toFixed(2)}%；相关系数 ${r.toFixed(2)}`,
    `<b>这不是因果</b>：贵的单品往往也是份量大、品类不同、陈列位置不同的单品，斜率里混着这些差异`,
    `正确用法是找离群点——线上方的单品在同价位里更好卖，可作为提价或扩铺候选；线下方的单品要先查陈列与出炉时段`]));
}
/* ==================== 6. 需求分布箱线 ==================== */
function drawDemandBox(){
  const {cr}=nvCritical(),p=Math.min(cr,0.99);
  const v=view().filter(d=>D.chans[d.ch]==="厨房烘焙");
  const rows=[];
  d3.group(v,d=>d.k).forEach((g,k)=>{
    const per=Array.from(d3.rollup(g,gg=>({sl:sum(gg,d=>d.sl),av:sum(gg,d=>d.avail),
      w:sum(gg,d=>d.w),cl:sum(gg,d=>d.cl)}),d=>d.s+"|"+d.d).values());
    if(per.length<6)return;
    const dem=per.map(o=>o.sl).sort(d3.ascending);
    const km=(typeof kmFit==="function")?kmFit(per.map(o=>({v:o.sl,cens:o.cl<=0&&o.w===0&&o.sl>0}))):null;
    const rec=(S.censorOn&&km)?Math.max(km.q(p),SS.q(dem,p)):SS.q(dem,p);
    rows.push({k,name:D.sku[k].n,cat:D.sku[k].c,n:per.length,
      p10:SS.q(dem,.1),p25:SS.q(dem,.25),med:SS.q(dem,.5),p75:SS.q(dem,.75),p90:SS.q(dem,.9),
      cur:d3.mean(per,o=>o.av),rec,rev:sum(g,d=>d.rev),
      cens:per.filter(o=>o.cl<=0&&o.w===0).length/per.length});});
  if(!rows.length){blank("#c-dbox");return;}
  const arr=rows.sort((a,b)=>b.rev-a.rev).slice(0,16);
  const nmW=Math.min(190,Math.max(120,(d3.max(arr,d=>estW(clipToWidth(d.name,150,10.5),10.5))||120)+12));
  const W=980,H=Math.max(320,arr.length*27+70),st=stage("#c-dbox",W,H,{t:22,r:110,b:46,l:nmW}),{iw,ih}=st;
  const y=d3.scaleBand().domain(arr.map(d=>d.k)).range([0,ih]).padding(.35);
  const x=d3.scaleLinear().domain([0,d3.max(arr,d=>Math.max(d.p90,d.cur,d.rec))*1.08]).nice().range([0,iw]);
  gridG(st,d3.scaleLinear().domain([0,1]).range([ih,0]),1);
  axisG(st,"yax",null,d3.axisLeft(y).tickSize(0).tickFormat(k=>clipToWidth(skuName(k),nmW-12,10.5)));
  axisG(st,"xax",`translate(0,${ih})`,d3.axisBottom(x).ticks(6).tickFormat(F.n0));
  st.wipe("ref");
  st.layer("ref").append("text").attr("class","axt").attr("x",iw).attr("y",ih+34).attr("text-anchor","end")
    .text("单店单日销量（件）");
  const g=st.layer("mark").selectAll("g.bx").data(arr,d=>d.k).join(
    en=>{const n=en.append("g").attr("class","bx m mark");
      n.append("line").attr("class","wk").attr("stroke",C.ink4);
      n.append("rect").attr("class","bd").attr("rx",2);
      n.append("line").attr("class","md").attr("stroke","#fff").attr("stroke-width",2);
      n.append("line").attr("class","cu").attr("stroke",C.ink).attr("stroke-width",2);
      n.append("path").attr("class","rc");
      return n;},up=>up,ex=>ex.remove());
  g.attr("transform",d=>`translate(0,${y(d.k)})`);
  g.select("line.wk").transition(T()).attr("x1",d=>x(d.p10)).attr("x2",d=>x(d.p90))
    .attr("y1",y.bandwidth()/2).attr("y2",y.bandwidth()/2);
  g.select("rect.bd").attr("fill",d=>CATCOLOR(D.cats[d.cat])).attr("opacity",.55)
    .transition(T()).attr("x",d=>x(d.p25)).attr("width",d=>Math.max(x(d.p75)-x(d.p25),1))
    .attr("y",0).attr("height",y.bandwidth());
  g.select("line.md").transition(T()).attr("x1",d=>x(d.med)).attr("x2",d=>x(d.med)).attr("y1",0).attr("y2",y.bandwidth());
  g.select("line.cu").transition(T()).attr("x1",d=>x(d.cur)).attr("x2",d=>x(d.cur))
    .attr("y1",-2).attr("y2",y.bandwidth()+2);
  g.select("path.rc").attr("fill",C.c3)
    .transition(T()).attr("d",d=>{const cx=x(d.rec),cy=y.bandwidth()/2;
      return `M${cx},${cy-6} L${cx+5},${cy} L${cx},${cy+6} L${cx-5},${cy} Z`;});
  g.call(s=>hov(s,d=>tipHTML(d.name,[["店日观测点",d.n+" 个"],
    ["销量分位 P10 / 中位 / P90",F.n1(d.p10)+" / "+F.n1(d.med)+" / "+F.n1(d.p90)],
    ["当前出炉量（均值）",F.n1(d.cur)+" 件"],["建议出炉量",F.n1(d.rec)+" 件"],
    ["调整",(d.rec-d.cur>=0?"+":"")+F.n1(d.rec-d.cur)+" 件"],["可能缺货占比",F.p0(d.cens)]])));
  drillable(g,d=>({kick:"按单品下钻",title:d.name,keys:{skus:[d.k]}}));
  st.layer("lab").selectAll("text.v").data(arr,d=>d.k).join(
    en=>en.append("text").attr("class","v").style("font-size","10.5px"),up=>up,ex=>ex.remove())
    .attr("fill",d=>d.rec>d.cur?C.c1d:C.c3d)
    .text(d=>(d.rec-d.cur>=0?"+":"")+F.n1(d.rec-d.cur)+" 件")
    .transition(T()).attr("x",d=>x(Math.max(d.p90,d.rec,d.cur))+8).attr("y",d=>y(d.k)+y.bandwidth()/2+4);
  legend("#l-dbox",[{c:C.c1m,t:"四分位箱（P25–P75）"},{c:C.ink4,shape:"line",t:"P10–P90 须"},
    {c:"#fff",t:"白线：中位数"},{c:C.ink,shape:"line",t:"当前出炉量"},{c:C.c3,shape:"dot",t:"建议出炉量"}],
    `建议值取第 ${(p*100).toFixed(0)} 百分位 · 点击任意一行下钻`);
  d3.select("#f-dbox").html(tagLine([TAG.m,TAG.d,
    `箱线来自「店 × 日」观测点的经验分布，不假设正态；建议出炉量 = 第 ${(p*100).toFixed(0)} 百分位（报童模型临界分位）`,
    S.censorOn?`已启用缺货截断校正，售罄日的销量按 Kaplan–Meier 还原后再取分位`:`未启用缺货截断校正，售罄日的销量被当作真实需求`,
    `箱子越宽说明该单品日间波动越大，越不适合固定出炉量，应优先做分波次出炉`]));
}
/* ==================== 7. 减损潜力 ==================== */
function drawOpp(){
  const v=view();
  const arr=Array.from(d3.group(v,d=>d.s),([s,g])=>{const a=agg(g);
    return {s,wrr:wr(a),wval:a.wval,rev:a.rev,avail:a.avail};}).filter(d=>d.wrr>0);
  if(arr.length<2){blank("#c-opp");return;}
  const best=d3.min(arr,d=>d.wrr);
  arr.forEach(d=>d.opp=d.wval*(1-best/d.wrr));
  arr.sort((a,b)=>b.opp-a.opp);
  const tot=d3.sum(arr,d=>d.opp)||1;
  let c=0;arr.forEach(d=>{c+=d.opp;d.cum=c/tot;});
  const oW=Math.min(150,Math.max(80,(d3.max(arr,d=>estW(storeName(d.s),10.5))||80)+16));
  const W=980,H=Math.max(300,arr.length*23+70),st=stage("#c-opp",W,H,{t:22,r:104,b:46,l:oW}),{iw,ih}=st;
  const y=d3.scaleBand().domain(arr.map(d=>d.s)).range([0,ih]).padding(.3);
  const x=d3.scaleLinear().domain([0,d3.max(arr,d=>d.opp)*1.05]).nice().range([0,iw]);
  const x2=d3.scaleLinear().domain([0,1]).range([0,iw]);
  gridG(st,d3.scaleLinear().domain([0,1]).range([ih,0]),1);
  axisG(st,"yax",null,d3.axisLeft(y).tickSize(0).tickFormat(s=>storeName(s)));
  axisG(st,"xax",`translate(0,${ih})`,d3.axisBottom(x).ticks(5).tickFormat(F.money));
  st.wipe("ref");
  const RF=st.layer("ref");
  RF.append("text").attr("class","axt").attr("x",iw).attr("y",ih+34).attr("text-anchor","end")
    .text("窗口内可省金额（元）");
  const bars=st.layer("mark").selectAll("rect.b").data(arr,d=>d.s).join(
    en=>en.append("rect").attr("class","b m mark").attr("width",0).attr("rx",2),up=>up,ex=>ex.remove());
  bars.attr("fill",d=>d.cum<=0.8?C.c3:C.c3l).attr("y",d=>y(d.s)).attr("height",y.bandwidth()).attr("data-hl",d=>"s"+d.s)
    .call(s=>hov(s,d=>tipHTML(storeName(d.s)+" · "+regShort(D.storeRegion[d.s]),
      [["本店报废率",F.p1(d.wrr)],["最优店报废率",F.p1(best)],["窗口报废金额",F.yuan(d.wval)],
       ["可省金额",F.yuan(d.opp)],["累计占比",F.p1(d.cum)]])));
  drillable(bars,d=>({kick:"按门店下钻",title:storeName(d.s),keys:{stores:[d.s]},pred:o=>o.w>0,
    note:"该店有报废的记录"}));
  bars.transition(T()).delay((d,i)=>stagger(i,20)).attr("width",d=>x(d.opp));
  const line=d3.line().x(d=>x2(d.cum)).y(d=>y(d.s)+y.bandwidth()/2);
  st.layer("mark").selectAll("path.cum").data([arr]).join(
    en=>en.append("path").attr("class","cum").attr("fill","none").attr("stroke",C.ink).attr("stroke-width",1.6)
      .attr("stroke-dasharray","4 3")).attr("d",line);
  const n80=arr.findIndex(d=>d.cum>=0.8)+1;
  if(n80>0){const yy=y(arr[n80-1].s)+y.bandwidth();
    RF.append("line").attr("class","refl").attr("x1",0).attr("x2",iw).attr("y1",yy).attr("y2",yy).attr("stroke",C.c1d);
    RF.append("text").attr("class","reft").attr("x",4).attr("y",yy-4).attr("fill",C.c1d)
      .text(`先改这 ${n80} 家店，拿到 80% 的可省金额`);}
  st.layer("lab").selectAll("text.v").data(arr,d=>d.s).join(
    en=>en.append("text").attr("class","v").style("font-size","10.5px").attr("fill",C.ink2),up=>up,ex=>ex.remove())
    .text(d=>F.money(d.opp)+" · 累计 "+F.p0(d.cum))
    .transition(T()).attr("x",d=>x(d.opp)+7).attr("y",d=>y(d.s)+y.bandwidth()/2+4);
  legend("#l-opp",[{c:C.c3,t:"累计前 80% 的门店"},{c:C.c3l,t:"其余门店"},
    {c:C.ink,shape:"dash",t:"累计占比曲线"}],"点击色条下钻到该店有报废的记录");
  const cost=(typeof blendedCost==="function")?blendedCost():S.costBake;
  const sc=91/Math.max(agg(v).days,1);
  d3.select("#f-opp").html(tagLine([TAG.m,TAG.d,
    `可省金额 = 本店报废金额 × (1 − 最优店报废率 ÷ 本店报废率)，最优店报废率 ${F.p1(best)}`,
    `窗口内合计 <b>${F.yuan(tot)}</b>（按售价计），折合 13 周约 ${F.yuan(tot*sc)}；换成毛利口径需再乘综合成本率 ${F.p1(cost)}，约 <b>${F.yuan(tot*sc*cost)}</b>`,
    `与决策摘要的金额可比的是毛利口径那个数，售价口径只用于和销售额直接对照`,
    `这是拉齐到现有最优店的上限，不是压到零；最优店本身仍有 ${F.p1(best)} 的报废`,
    n80>0?`前 ${n80} 家店占 80% 的机会，整改资源应优先投在这几家`:null].filter(Boolean)));
}
/* ==================== 8. 驱动流：逐周贡献 ==================== */
function drawDriver(){
  const kind=S.fcScn||"C";
  const Sc=fcScenario(kind),B=Sc.B;
  const gp=x=>x*(1-B.cost);
  const arr=Sc.out.map(d=>({w:d.w,
    tail:gp(d.seg.tail),neu:gp(d.seg.neu),price:gp(d.seg.price),waste:d.seg.waste*B.cost}));
  const KEYS=[["waste","报废率改善",C.c1],["neu","新品上市",C.c4],["price","件单价调整",C.c5],["tail","下架长尾",C.c3]];
  const W=980,H=330,st=stage("#c-driver",W,H,{t:24,r:120,b:48,l:80}),{iw,ih}=st;
  const x=d3.scaleBand().domain(arr.map(d=>d.w)).range([0,iw]).padding(.26);
  const pos=d=>d3.sum(KEYS,k=>Math.max(d[k[0]],0)),neg=d=>d3.sum(KEYS,k=>Math.min(d[k[0]],0));
  const y=d3.scaleLinear().domain([d3.min(arr,neg)*1.15-1,d3.max(arr,pos)*1.15+1]).nice().range([ih,0]);
  gridG(st,y);
  axisG(st,"xax",`translate(0,${y(0)})`,d3.axisBottom(x).tickFormat(d=>"第"+(d+1)+"周").tickSize(3));
  axisG(st,"yax",null,d3.axisLeft(y).ticks(5).tickSize(4).tickFormat(F.money));
  st.wipe("ref","lab");
  const RF=st.layer("ref");
  RF.append("text").attr("class","axt").attr("x",0).attr("y",-8).text("每周相对基线的毛利贡献（元）");
  RF.append("line").attr("x1",0).attr("x2",iw).attr("y1",y(0)).attr("y2",y(0)).attr("stroke",C.rule);
  const segs=[];
  arr.forEach(d=>{let up=0,dn=0;
    KEYS.forEach(k=>{const val=d[k[0]];if(!val)return;
      if(val>0){segs.push({key:d.w+"_"+k[0],w:d.w,k:k[0],nm:k[1],c:k[2],v:val,y0:up,y1:up+val});up+=val;}
      else{segs.push({key:d.w+"_"+k[0],w:d.w,k:k[0],nm:k[1],c:k[2],v:val,y0:dn+val,y1:dn});dn+=val;}});});
  st.layer("mark").selectAll("rect.s").data(segs,d=>d.key).join(
    en=>en.append("rect").attr("class","s m mark").attr("y",y(0)).attr("height",0).attr("rx",1),up=>up,ex=>ex.remove())
    .attr("fill",d=>d.c).attr("opacity",.9).attr("data-hl",d=>d.k)
    .call(s=>hov(s,d=>tipHTML(`第 ${d.w+1} 周 · ${d.nm}`,[["毛利贡献",(d.v>=0?"+":"")+F.yuan(d.v)],
      ["占当周合计",F.p1(Math.abs(d.v)/Math.max(d3.sum(KEYS,k=>Math.abs(arr[d.w][k[0]])),1))]],false)))
    .transition(T()).delay((d,i)=>stagger(i,4))
    .attr("x",d=>x(d.w)).attr("width",x.bandwidth())
    .attr("y",d=>y(Math.max(d.y0,d.y1))).attr("height",d=>Math.abs(y(d.y0)-y(d.y1)));
  const net=arr.map(d=>({w:d.w,v:d3.sum(KEYS,k=>d[k[0]])}));
  const line=d3.line().x(d=>x(d.w)+x.bandwidth()/2).y(d=>y(d.v));
  st.layer("fg").selectAll("path.net").data([net]).join(
    en=>en.append("path").attr("class","net").attr("fill","none").attr("stroke",C.ink).attr("stroke-width",2)).attr("d",line);
  st.layer("lab").append("text").attr("x",x(net[net.length-1].w)+x.bandwidth()+8).attr("y",y(net[net.length-1].v)+4)
    .style("font-size","11px").attr("fill",C.ink).text("合计 "+F.yuan(net[net.length-1].v)+"/周");
  legend("#l-driver",KEYS.map(k=>({c:k[2],t:k[1],hl:k[0]})).concat([{c:C.ink,shape:"line",t:"当周净贡献"}]),
    `当前情景：${kind==="A"?"A 只动订货":kind==="B"?"B 只动货盘":"C 组合拳"} · 参数在未来时间轴页调整`);
  const tot=d3.sum(net,d=>d.v);
  const share=KEYS.map(k=>({nm:k[1],v:d3.sum(arr,d=>d[k[0]])}));
  const top=share.slice().sort((a,b)=>Math.abs(b.v)-Math.abs(a.v))[0];
  d3.select("#f-driver").html(tagLine([TAG.m+TAG.d,
    `${S.fcWeeks} 周合计 <b>${F.yuan(tot)}</b>，其中贡献最大的是「${top.nm}」${F.yuan(top.v)}`,
    `报废改善随达标周数线性爬坡，新品按 4 周爬坡，下架长尾从第一周就是负贡献——这解释了为什么组合拳前几周看不出效果`,
    `每根柱子的构成可以直接对应到责任人：报废归店长、货盘归商品、价格归定价会`]));
}

<script>

      <li>日均不足每店 1 件的有 ${tail.length} 个，合计只占 ${F.p1(d3.sum(tail,d=>d.rev)/tot)}</li></ul></div>
  <div class="opts" style="grid-template-columns:1fr">

<script>
/* ==================== 净利润 ==================== */
function profitBase(){
  const v=view(),a=agg(v);
  const c=blendedCost();
  const days=a.days||1,st=a.stores||1;
  const revD=a.rev/days/st;                     // 店均日销售额
  const wRatio=a.rev?a.wval/a.rev:0;            // 报废货值 ÷ 销售额
  const varR=S.varRate||0.05;                   // 能耗与包材，占销售额，设计值
  const fixM=(S.laborM||0)+(S.rentM||0);        // 每店每月固定成本，设计值
  const monthD=30.4;
  const grossD=revD*(1-c)-revD*wRatio*c;        // 毛利（已扣报废成本）
  const netD=grossD-revD*varR-fixM/monthD;
  const denom=1-c-varR-wRatio*c;
  const beD=denom>0?(fixM/monthD)/denom:Infinity;  // 保本日销售额
  return {v,a,c,days,st,revD,wRatio,varR,fixM,monthD,grossD,netD,beD,denom};
}
function drawProfitBridge(){
  const P=profitBase();
  if(!P.a.stores){blank("#c-pbridge");return;}
  const M=P.revD*P.monthD;
  const steps=[
    {k:"月销售额",v:M,t:"base"},
    {k:"售出成本",v:-M*P.c,t:"neg"},
    {k:"报废成本",v:-M*P.wRatio*P.c,t:"neg"},
    {k:"能耗与包材",v:-M*P.varR,t:"neg"},
    {k:"人工",v:-(S.laborM||80000),t:"neg"},
    {k:"租金",v:-(S.rentM||60000),t:"neg"},
    {k:"店均月净利",v:P.netD*P.monthD,t:"end"}];
  const W=980,H=310,st=stage("#c-pbridge",W,H,{t:26,r:16,b:52,l:82}),{iw,ih}=st;
  const x=d3.scaleBand().domain(steps.map(d=>d.k)).range([0,iw]).padding(.32);
  let run=0;const bars=[];
  steps.forEach(s2=>{
    if(s2.t==="base"){bars.push({...s2,y0:0,y1:s2.v});run=s2.v;}
    else if(s2.t==="end"){bars.push({...s2,y0:Math.min(0,s2.v),y1:Math.max(0,s2.v)});}
    else{const y0=run;run+=s2.v;bars.push({...s2,y0:Math.min(y0,run),y1:Math.max(y0,run)});}});
  const y=d3.scaleLinear().domain([Math.min(0,d3.min(bars,d=>d.y0)),d3.max(bars,d=>d.y1)*1.08]).nice().range([ih,0]);
  gridG(st,y);
  axisG(st,"xax",`translate(0,${y(0)})`,d3.axisBottom(x).tickSize(3),{after:t=>t.style("font-size","10.5px")});
  axisG(st,"yax",null,d3.axisLeft(y).ticks(5).tickSize(4).tickFormat(F.money));
  st.wipe("ref");
  st.layer("ref").append("text").attr("class","axt").attr("x",0).attr("y",-8).text("单店月度（元）");
  st.layer("ref").append("line").attr("x1",0).attr("x2",iw).attr("y1",y(0)).attr("y2",y(0)).attr("stroke",C.rule);
  const rects=st.layer("mark").selectAll("rect.b").data(bars,d=>d.k).join(
    en=>en.append("rect").attr("class","b m mark").attr("rx",2).attr("y",y(0)).attr("height",0),up=>up,ex=>ex.remove());
  rects.attr("fill",d=>d.t==="base"?SEM.avail:d.t==="end"?(d.v>=0?SEM.sales:SEM.waste):
      (d.k.includes("报废")?SEM.waste:d.k==="售出成本"?C.c2m:C.ink4))
    .call(s2=>hov(s2,d=>tipHTML(d.k,[["金额",(d.v>=0?"":"−")+F.yuan(Math.abs(d.v))],
      ["占月销售额",F.p1(Math.abs(d.v)/Math.max(M,1))],
      ["性质",["人工","租金"].includes(d.k)?"固定成本（设计值）":d.t==="base"||d.t==="end"?"结果":"变动成本"]],false)));
  drillable(rects,d=>d.k.includes("报废")?({kick:"按去向下钻",title:"当天报废的记录",keys:{},pred:o=>o.w>0}):null);
  rects.transition(T()).delay((d,i)=>stagger(i,55))
    .attr("x",d=>x(d.k)).attr("width",x.bandwidth()).attr("y",d=>y(d.y1)).attr("height",d=>Math.max(y(d.y0)-y(d.y1),1));
  st.layer("lab").selectAll("text.v").data(bars,d=>d.k).join(
    en=>en.append("text").attr("class","v").attr("text-anchor","middle").style("font-size","11px"),up=>up,ex=>ex.remove())
    .attr("fill",d=>d.t==="end"?(d.v>=0?C.c1d:C.c3d):C.ink2)
    .text(d=>(d.t==="neg"?"−":"")+F.yuan(Math.abs(d.v)))
    .transition(T()).attr("x",d=>x(d.k)+x.bandwidth()/2).attr("y",d=>y(d.y1)-7);
  legend("#l-pbridge",[{c:SEM.avail,t:"月销售额"},{c:C.c2m,t:"售出成本"},{c:SEM.waste,t:"报废成本"},
    {c:C.ink4,t:"其他成本"},{c:SEM.sales,t:"净利为正"},{c:SEM.waste,t:"净利为负"}],
    "人工、租金、能耗与包材为可调设计值，需按客户实际填写");
  const marg=P.revD?P.netD/P.revD:0;
  const lr=(S.laborM||0)/Math.max(M,1),rr=(S.rentM||0)/Math.max(M,1);
  d3.select("#f-pbridge").html(tagLine([TAG.m,TAG.d,
    `店均日销售额 <b>${F.yuan(P.revD)}</b>（实测），折月 ${F.yuan(M)}`,
    `净利 = 销售额 × (1 − 综合成本率 ${F.p1(P.c)} − 能耗包材 ${F.p1(P.varR)}) − 报废货值 × 成本率 − 人工 − 租金`,
    `店均月净利 <b>${F.yuan(P.netD*P.monthD)}</b>，净利率 <b>${F.p1(marg)}</b>；报废这一段单独吃掉 ${F.yuan(M*P.wRatio*P.c)}，占月销售额 ${F.p1(P.wRatio*P.c)}`,
    `当前人工占月销售额 <b>${F.p1(lr)}</b>、租金 <b>${F.p1(rr)}</b>。这两项是<b>设计值</b>，默认按占比标定而非行业基准；<b>净利率若明显高于常识，通常是这两项填低了</b>，请对照客户损益表调整`,
    `外部可核的只有食材成本率（25–35%，见方法论页）；人工与租金没有可引用的公开基准，必须由客户提供`]));
}
function drawBreakeven(){
  const P=profitBase();
  const arr=Array.from(d3.group(P.v,d=>d.s),([s,g])=>{
    const a2=agg(g),dy=new Set(g.map(d=>d.d)).size||1;
    const wR=a2.rev?a2.wval/a2.rev:0;
    const den=1-P.c-P.varR-wR*P.c;
    const be=den>0?(P.fixM/P.monthD)/den:Infinity;
    return {s,rev:a2.rev/dy,be,wR,gap:a2.rev/dy-be};}).sort((a,b)=>b.gap-a.gap);
  if(!arr.length){blank("#c-breakeven");return;}
  const nmW=Math.min(140,Math.max(80,(d3.max(arr,d=>estW(storeName(d.s),10.5))||80)+16));
  const W=980,H=Math.max(300,arr.length*23+72),st=stage("#c-breakeven",W,H,{t:22,r:120,b:48,l:nmW}),{iw,ih}=st;
  const y=d3.scaleBand().domain(arr.map(d=>d.s)).range([0,ih]).padding(.3);
  const x=d3.scaleLinear().domain([0,d3.max(arr,d=>Math.max(d.rev,isFinite(d.be)?d.be:0))*1.08]).nice().range([0,iw]);
  gridG(st,d3.scaleLinear().domain([0,1]).range([ih,0]),1);
  axisG(st,"yax",null,d3.axisLeft(y).tickSize(0).tickFormat(s=>storeName(s)));
  axisG(st,"xax",`translate(0,${ih})`,d3.axisBottom(x).ticks(5).tickFormat(F.money));
  st.wipe("ref");
  st.layer("ref").append("text").attr("class","axt").attr("x",iw).attr("y",ih+34).attr("text-anchor","end")
    .text("店均日销售额（元）");
  const bars=st.layer("mark").selectAll("rect.b").data(arr,d=>d.s).join(
    en=>en.append("rect").attr("class","b m mark").attr("width",0).attr("rx",2),up=>up,ex=>ex.remove());
  bars.attr("fill",d=>d.gap>=0?C.c1:C.c3).attr("y",d=>y(d.s)).attr("height",y.bandwidth()).attr("data-hl",d=>"s"+d.s)
    .call(s2=>hov(s2,d=>tipHTML(storeName(d.s)+" · "+regShort(D.storeRegion[d.s]),
      [["实际店均日销售额",F.yuan(d.rev)],["保本日销售额",isFinite(d.be)?F.yuan(d.be):"参数下无解"],
       ["盈亏差额",(d.gap>=0?"+":"")+F.yuan(d.gap)],["本店报废货值占比",F.p1(d.wR)]])));
  drillable(bars,d=>({kick:"按门店下钻",title:storeName(d.s),keys:{stores:[d.s]}}));
  bars.transition(T()).delay((d,i)=>stagger(i,18)).attr("width",d=>x(d.rev));
  const be0=arr.length?d3.mean(arr,d=>isFinite(d.be)?d.be:0):0;
  st.layer("ref").append("line").attr("class","refl").attr("x1",x(be0)).attr("x2",x(be0)).attr("y1",-4).attr("y2",ih)
    .attr("stroke",C.ink).attr("stroke-width",1.4);
  st.layer("ref").append("text").attr("class","reft").attr("x",x(be0)+5).attr("y",-6).attr("fill",C.ink)
    .text("保本线 "+F.money(be0));
  st.layer("lab").selectAll("text.v").data(arr,d=>d.s).join(
    en=>en.append("text").attr("class","v").style("font-size","10.5px"),up=>up,ex=>ex.remove())
    .attr("fill",d=>d.gap>=0?C.c1d:C.c3d).text(d=>(d.gap>=0?"+":"")+F.money(d.gap))
    .transition(T()).attr("x",d=>x(d.rev)+7).attr("y",d=>y(d.s)+y.bandwidth()/2+4);
  legend("#l-breakeven",[{c:C.c1,t:"高于保本线"},{c:C.c3,t:"低于保本线"},
    {c:C.ink,shape:"dash",t:"保本日销售额"}],"点击色条下钻到该店的原始记录");
  const under=arr.filter(d=>d.gap<0);
  d3.select("#f-breakeven").html(tagLine([TAG.m,TAG.d,
    `保本日销售额 = (人工 + 租金) ÷ 30.4 ÷ (1 − 成本率 − 能耗包材率 − 报废货值率 × 成本率)`,
    `按当前设计值，<b>${under.length}</b> 家店的实际日销售额低于保本线，缺口合计 ${F.yuan(Math.abs(d3.sum(under,d=>d.gap)))}/日`,
    `各店保本线不同，因为报废货值占比不同：报废越高，保本所需的销售额越高`,
    `固定成本按全网统一值代入；真实租金差异很大，逐店填入后这张图才可作为关店/整改依据`]));
}
function drawSkuProfit(){

    const c=costRate(d.k);
    return {...d,net:d.rev*(1-c)-d.wval*c,c};}).sort((a,b)=>b.net-a.net);
  if(!arr.length){blank("#c-skuprofit");return;}
  const tot=d3.sum(arr,d=>d.net)||1;
  let cum=0;const cur=arr.map(d=>{cum+=d.net;return {k:d.k,cum:cum/tot};});
  const top=arr.slice(0,14),bot=arr.filter(d=>d.net<0).slice(-8);
  const show=top.concat(bot);
  const nmW=Math.min(190,Math.max(120,(d3.max(show,d=>estW(clipToWidth(d.name,150,10.5),10.5))||120)+14));

  gridG(st,d3.scaleLinear().domain([0,1]).range([ih,0]),1);
  axisG(st,"yax",`translate(${x(0)},0)`,d3.axisLeft(y).tickSize(0).tickFormat(()=>""));
  axisG(st,"xax",`translate(0,${ih})`,d3.axisBottom(x).ticks(5).tickFormat(F.money));
  st.wipe("ref");
  st.layer("ref").append("line").attr("x1",x(0)).attr("x2",x(0)).attr("y1",0).attr("y2",ih).attr("stroke",C.rule);
  st.layer("ref").append("text").attr("class","axt").attr("x",iw).attr("y",ih+34).attr("text-anchor","end")
    .text("窗口内净贡献 = 销售额 ×(1−成本率) − 报废货值 × 成本率（元）");
  const bars=st.layer("mark").selectAll("rect.b").data(show,d=>d.k).join(
    en=>en.append("rect").attr("class","b m mark").attr("width",0).attr("rx",2),up=>up,ex=>ex.remove());
  bars.attr("fill",d=>d.net>=0?C.c1:C.c3).attr("y",d=>y(d.k)).attr("height",y.bandwidth()).attr("data-hl",d=>"c"+d.cat)
    .call(s2=>hov(s2,d=>tipHTML(d.name,[["品类",D.cats[d.cat]],["销售额",F.yuan(d.rev)],
      ["报废货值",F.yuan(d.wval)],["成本率",F.p1(d.c)],["净贡献",(d.net>=0?"":"−")+F.yuan(Math.abs(d.net))],
      ["报废率",F.p1(d.wrr)]])));
  drillable(bars,d=>({kick:"按单品下钻",title:d.name,keys:{skus:[d.k]}}));
  bars.transition(T()).delay((d,i)=>stagger(i,14))
    .attr("x",d=>x(Math.min(0,d.net))).attr("width",d=>Math.abs(x(d.net)-x(0)));
  st.layer("lab").selectAll("text.n").data(show,d=>d.k).join(
    en=>en.append("text").attr("class","n").style("font-size","10.5px").attr("fill",C.ink2),up=>up,ex=>ex.remove())
    .attr("text-anchor",d=>d.net>=0?"end":"start").text(d=>clipToWidth(d.name,nmW-14,10.5))
    .transition(T()).attr("x",d=>d.net>=0?x(0)-7:x(0)+7).attr("y",d=>y(d.k)+y.bandwidth()/2+4);
  legend("#l-skuprofit",[{c:C.c1,t:"净贡献为正"},{c:C.c3,t:"净贡献为负（报废吃掉了毛利）"}],
    "上半部分为贡献最高的 14 个，下半部分为净贡献为负的单品 · 点击下钻");
  const neg=arr.filter(d=>d.net<0);
  const n80=cur.findIndex(d=>d.cum>=0.8)+1;
  d3.select("#f-skuprofit").html(tagLine([TAG.m,TAG.d,
    `净贡献 = 销售额 × (1 − 成本率) − 报废货值 × 成本率；成本率按渠道区分（现烤 ${F.p0(S.costBake)}、工厂外购 ${F.p0(S.costBuy)}），均为设计值`,
    `前 <b>${n80}</b> 个单品贡献 80% 的净贡献；有 <b>${neg.length}</b> 个单品净贡献为负，合计 ${F.yuan(Math.abs(d3.sum(neg,d=>d.net)))}`,

/* ==================== 运营流程 ==================== */
function drawFlowFunnel(){
  const v=view(),a=agg(v);
  if(!v.length){blank("#c-funnel");return;}
  const steps=[
    {k:"昨日结转",v:a.open,note:"早上库存"},
    {k:"当天出炉/收货",v:a.recv,note:"收货"},
    {k:"调拨与盘点",v:a.xfer+a.adj,note:"交流 + 调整"},
    {k:"可动用",v:a.avail,note:"四项之和",bar:true},
    {k:"卖给顾客",v:a.sales,note:"销售"},
    {k:"当天报废",v:a.waste,note:"退厂"},
    {k:"留到隔天",v:a.close,note:"日结库存"}];
  const W=980,H=300,st=stage("#c-funnel",W,H,{t:26,r:20,b:56,l:96}),{iw,ih}=st;
  const x=d3.scaleBand().domain(steps.map(d=>d.k)).range([0,iw]).padding(.3);
  const y=d3.scaleLinear().domain([0,a.avail*1.08]).nice().range([ih,0]);
  gridG(st,y);
  axisG(st,"xax",`translate(0,${ih})`,d3.axisBottom(x).tickSize(3),{after:t=>t.style("font-size","10.5px")});
  axisG(st,"yax",null,d3.axisLeft(y).ticks(5).tickSize(4).tickFormat(F.n0));
  st.wipe("ref");
  st.layer("ref").append("text").attr("class","axt").attr("x",0).attr("y",-8).text("件数");
  st.layer("ref").append("line").attr("class","refl").attr("x1",0).attr("x2",iw).attr("y1",y(a.avail)).attr("y2",y(a.avail))
    .attr("stroke",C.ink3);
  st.layer("ref").append("text").attr("class","reft").attr("x",iw).attr("y",y(a.avail)-4).attr("text-anchor","end")
    .attr("fill",C.ink3).text("可动用 "+F.n(a.avail)+" 件");
  const col=k=>k==="卖给顾客"?SEM.sales:k==="当天报废"?SEM.waste:k==="留到隔天"?SEM.left:
    k==="可动用"?SEM.avail:k==="当天出炉/收货"?SEM.recv:k==="昨日结转"?SEM.open:C.ink4;
  const bars=st.layer("mark").selectAll("rect.b").data(steps,d=>d.k).join(
    en=>en.append("rect").attr("class","b m mark").attr("rx",2).attr("y",ih).attr("height",0),up=>up,ex=>ex.remove());
  bars.attr("fill",d=>col(d.k))
    .call(s2=>hov(s2,d=>tipHTML(d.k,[["件数",F.n(d.v)],["占可动用",F.p1(d.v/Math.max(a.avail,1))],
      ["原始字段",d.note]])));
  drillable(bars,d=>({kick:"按流程环节下钻",title:d.k,keys:{},
    pred:d.k==="卖给顾客"?(o=>o.sl>0):d.k==="当天报废"?(o=>o.w>0):d.k==="留到隔天"?(o=>o.cl>0):
      d.k==="昨日结转"?(o=>o.o>0):d.k==="当天出炉/收货"?(o=>o.rc>0):
      d.k==="调拨与盘点"?(o=>o.x!==0||o.a!==0):null}));
  bars.transition(T()).delay((d,i)=>stagger(i,40))
    .attr("x",d=>x(d.k)).attr("width",x.bandwidth()).attr("y",d=>y(d.v)).attr("height",d=>ih-y(d.v));
  st.layer("lab").selectAll("text.v").data(steps,d=>d.k).join(
    en=>en.append("text").attr("class","v").attr("text-anchor","middle").style("font-size","11px").attr("fill",C.ink2),
    up=>up,ex=>ex.remove())
    .text(d=>F.n(d.v)+"（"+F.p0(d.v/Math.max(a.avail,1))+"）")
    .transition(T()).attr("x",d=>x(d.k)+x.bandwidth()/2).attr("y",d=>y(d.v)-7);
  legend("#l-funnel",[{c:SEM.open,t:"昨日结转"},{c:SEM.recv,t:"当天出炉/收货"},{c:C.ink4,t:"调拨与盘点"},
    {c:SEM.avail,t:"可动用"},{c:SEM.sales,t:"卖给顾客"},{c:SEM.waste,t:"当天报废"},{c:SEM.left,t:"留到隔天"}],
    "点击任一环节下钻到该环节非零的原始记录");
  d3.select("#f-funnel").html(tagLine([TAG.m,
    `流程口径：昨日结转 + 当天出炉/收货 + 调拨 + 盘点调整 = 可动用；可动用 = 卖给顾客 + 当天报废 + 留到隔天`,
    `当天出炉占可动用 <b>${F.p1(a.recv/Math.max(a.avail,1))}</b>，昨日结转占 <b>${F.p1(a.open/Math.max(a.avail,1))}</b>`,
    `结转比例越高，货龄越老，第二天的报废与顾客体验风险都更高`]));
}
function drawCarryOver(){
  /* 只看现烤：工厂配送与外购商品天然有期初库存且损耗极低，混在一起比会得出反向结论 */
  const v=view().filter(d=>D.chans[d.ch]==="厨房烘焙");
  const withO=v.filter(d=>d.o>0),noO=v.filter(d=>d.o<=0);
  if(!withO.length||!noO.length){blank("#c-carry","当前口径下缺少对照组（全部有过夜货或全部无过夜货）。");
    legend("#l-carry",[{c:C.c2,t:"有过夜货"},{c:C.c1m,t:"无过夜货"}]);
    d3.select("#f-carry").html(tagLine([TAG.m,"需要同时存在两种状态的记录"]));return;}
  const byCat=Array.from(d3.group(v,d=>d.c),([c,g])=>{
    const w1=g.filter(d=>d.o>0),w0=g.filter(d=>d.o<=0);
    const a1=agg(w1),a0=agg(w0);

function drawTransfer(){

  drillable(bars,d=>({kick:"按门店下钻",title:storeName(d.s)+" · "+d.nm,keys:{stores:[d.s]},
    pred:d.nm==="调入"?(o=>o.x>0):d.nm==="调出"?(o=>o.x<0):d.nm==="盘盈"?(o=>o.a>0):(o=>o.a<0)}));
  bars.transition(T()).delay((d,i)=>stagger(i,8)).attr("x",d=>x(d.x0)).attr("width",d=>Math.max(x(d.x1)-x(d.x0),0));
  st.layer("lab").selectAll("text.v").data(arr,d=>d.s).join(

}

function drawRegionOverlap(){
  const v=view().filter(d=>D.chans[d.ch]==="厨房烘焙");
  const regs=Array.from(new Set(v.map(d=>d.r))).sort(d3.ascending);

    d3.select("#f-regovl").html(tagLine([TAG.m,"需要至少两个区域"]));return;}
  const sets=new Map(regs.map(r=>[r,new Set(v.filter(d=>d.r===r&&d.sl>0).map(d=>d.k))]));
  const jac=(a,b)=>{let inter=0;a.forEach(k=>{if(b.has(k))inter++;});
    const uni=a.size+b.size-inter;return uni?inter/uni:0;};
  const cell=Math.max(56,Math.min(96,420/regs.length));
  const nameW=Math.min(140,Math.max(80,(d3.max(regs,r=>estW(regName(r),10.5))||80)+14));
  const W=nameW+regs.length*cell+240,H=64+regs.length*cell+16;
  const st=stage("#c-regovl",W,H,{t:56,r:240,b:12,l:nameW},{fixed:true});
  const col=d3.scaleSequential(t=>d3.interpolateRgb(C.panel2,C.c1d)(t)).domain([0,1]);
  st.wipe("bg","mark","lab","fg");
  regs.forEach((r,i)=>{
    st.layer("bg").append("text").attr("x",-8).attr("y",i*cell+cell/2+4).attr("text-anchor","end")
      .style("font-size","10.5px").attr("fill",regColor(r)).text(regName(r));
    st.layer("bg").append("text").attr("x",i*cell+cell/2).attr("y",-8).attr("text-anchor","middle")
      .style("font-size","10.5px").attr("fill",regColor(r)).text(regShort(r));});
  regs.forEach((a,i)=>regs.forEach((b,j)=>{
    const val=i===j?1:jac(sets.get(a),sets.get(b));
    const rc=st.layer("mark").append("rect").attr("x",j*cell+1).attr("y",i*cell+1)
      .attr("width",cell-2).attr("height",cell-2).attr("rx",2)
      .attr("fill",i===j?C.rule2:col(val)).attr("class","m mark");
    if(i!==j)rc.on("mousemove",e=>showTip(e,tipHTML(regName(a)+" ↔ "+regName(b),
        [["货盘重合度",F.p1(val)],[regName(a)+" 在售单品",sets.get(a).size+" 个"],
         [regName(b)+" 在售单品",sets.get(b).size+" 个"],
         ["仅一方有的单品",(sets.get(a).size+sets.get(b).size-2*Math.round(val*(sets.get(a).size+sets.get(b).size)/(1+val)))+" 个（近似）"]])))
      .on("mouseleave",hideTip)
      .call(s2=>drillable(s2,()=>({kick:"按区域对下钻",title:regName(a)+" 与 "+regName(b),keys:{regions:[a,b]},
        note:"两区的全部记录，可切到「按单品」看货盘差异"})));
    st.layer("lab").append("text").attr("x",j*cell+cell/2).attr("y",i*cell+cell/2+4).attr("text-anchor","middle")
      .style("font-size","11px").attr("pointer-events","none")
      .attr("fill",i===j?C.ink4:(val>0.55?"#fff":C.ink2)).text(i===j?"—":F.p0(val));}));
  /* 右侧：各区独有单品数 */
  regs.forEach((r,i)=>{
    const own=Array.from(sets.get(r)).filter(k=>regs.every(r2=>r2===r||!sets.get(r2).has(k)));
    const gg=st.layer("fg").append("g").attr("transform",`translate(${regs.length*cell+20},${i*cell+cell/2-14})`);
    gg.append("rect").attr("width",9).attr("height",9).attr("y",-8).attr("rx",2).attr("fill",regColor(r));
    gg.append("text").attr("x",15).attr("y",0).style("font-size","11px").attr("fill",C.ink)
      .text(`${regName(r)}：独有 ${own.length} 个`);
    gg.append("text").attr("x",15).attr("y",15).style("font-size","10.5px").attr("fill",C.ink3)
      .style("cursor",own.length?"pointer":"default")
      .text(own.length?`共 ${sets.get(r).size} 个在售 · 查看独有单品 →`:`共 ${sets.get(r).size} 个在售`)
      .on("click",()=>{if(own.length)openDrill({kick:"按区域独有单品下钻",title:regName(r)+" 独有单品",
        keys:{regions:[r],skus:own},note:"只在这个区域有销售记录的现烤单品"});});});
  legend("#l-regovl",[{ramp:[C.panel2,C.c1d],t:"货盘重合度（Jaccard）",lo:"0%",hi:"100%"}],
    "点击格子下钻到这两个区域的全部记录");
  const pairs=[];regs.forEach((a,i)=>regs.forEach((b,j)=>{if(i<j)pairs.push({a,b,v:jac(sets.get(a),sets.get(b))});}));
  pairs.sort((p,q)=>q.v-p.v);
  d3.select("#f-regovl").html(tagLine([TAG.m,
    `重合度 = 两区在售现烤单品集合的交集 ÷ 并集（Jaccard 系数）`,
    pairs.length?`最接近的一对是 ${regName(pairs[0].a)} 与 ${regName(pairs[0].b)}（${F.p1(pairs[0].v)}），差异最大的是 ${regName(pairs[pairs.length-1].a)} 与 ${regName(pairs[pairs.length-1].b)}（${F.p1(pairs[pairs.length-1].v)}）`:null,
    `重合度高说明区域间可以共用同一套货盘与订货模板；重合度低要先确认是本地口味差异，还是单纯的铺货执行不到位`].filter(Boolean)));
}

<script>

const SCHEMA=[["区域","文本","是","门店所属大区，可用「华东」「加盟一区」等任意分组"],

  ["早上库存","整数","是","开店时账面数量"],["收货","整数","是","当日生产或到货数量"],
  ["交流","整数","否","门店间调拨，可正可负，缺失填 0"],["调整","整数","否","盘点修正，缺失填 0"],
  ["客退货","整数","否","顾客退货，缺失填 0"],["退厂","整数","是","当日报废/退回数量"],
  ["日结库存","整数","是","打烊时账面数量"],["销售","整数","是","当日卖出数量"],
  ["销售价","小数","是","当日单价，缺失填 0 则不参与金额分析"],["销售额","小数","否","缺失时自动按 销售 × 销售价 计算"]];
function drawSchema(){

    SCHEMA.map(r=>`<tr><td>${r[0]}</td><td>${r[1]}</td><td class="${r[2]==="是"?"good":""}">${r[2]}</td><td style="text-align:left;white-space:normal;color:var(--ink2)">${r[3]}</td></tr>`).join("")+`</tbody></table>`);
  d3.select("#f-schema").html(tagLine([TAG.m,
    "校验规则：平衡式必须成立 <code>早上+收货+调拨+调整−报废−销售 = 日结</code>；不成立的行会在「数据质量」页被点名",
    "至少需要 2 个门店 × 4 天才能得到有意义的分位数；正式排产建议 8 周以上"]));
  d3.select("#dl").on("click",()=>{

      catch(err){d3.select("#up-msg").style("color","var(--c3)").text("解析失败："+err.message+"。请确认表头与上表一致、编码为 UTF-8。");}};

function loadCSV(txt){
  const rows=d3.csvParse(txt);
  if(!rows.length)throw new Error("文件为空");
  const need=["区域","门店","日期（日）","类别","产品名称","早上库存","收货","退厂","日结库存","销售","销售价"];
  need.forEach(c=>{if(!(c in rows[0]))throw new Error("缺少列 "+c);});
  const regions=Array.from(new Set(rows.map(r=>r["区域"])));
  const stores=Array.from(new Set(rows.map(r=>r["门店"])));
  const cats=Array.from(new Set(rows.map(r=>r["类别"])));
  const chans=Array.from(new Set(rows.map(r=>r["分类"]||"未分类")));
  const names=Array.from(new Set(rows.map(r=>r["产品名称"])));
  const dates=Array.from(new Set(rows.map(r=>r["日期（日）"]))).sort();
  const num=(r,c)=>+(r[c]||0)||0;
  D.regions=regions;D.regionLabel=Object.fromEntries(regions.map(r=>[r,r]));
  D.stores=stores;D.storeRegion=stores.map(s=>regions.indexOf(rows.find(r=>r["门店"]===s)["区域"]));
  const cnt={};D.storeAlias=stores.map((s,i)=>{const rr=regions[D.storeRegion[i]];cnt[rr]=(cnt[rr]||0)+1;return rr+"-"+String(cnt[rr]).padStart(2,"0");});
  D.cats=cats;D.chans=chans;
  D.sku=names.map(n=>{const r=rows.find(x=>x["产品名称"]===n);
    return {n,c:cats.indexOf(r["类别"]),ch:chans.indexOf(r["分类"]||"未分类"),d:r["面团"]||"未归入面团条线",
      p:+(r["销售价"]||0),code:r["产品编号"]||n};});
  D.dateStart=dates[0];D.days=dates.length;D.plan=[];
  DATES=dates.map(d=>new Date(d+"T00:00:00"));
  ROWS=rows.map(r=>{const o=num(r,"早上库存"),rc=num(r,"收货"),x=num(r,"交流"),a=num(r,"调整"),

  d3.select("#t-or").text(`${F.p1(v.length?cens/v.length:0)} 的店–日–单品在打烊时零剩余零报废，缺货损失和报废损失同样值钱`);
  const bad=[v.filter(d=>d.cl<0),v.filter(d=>d.o<0),v.filter(d=>d.pr===0),v.filter(d=>d.pr===0&&d.w>0),
    v.filter(d=>d.sl<0)].filter(z=>z.length).length+(D.plan&&D.plan.filter(p=>!p.live).length?1:0);
  d3.select("#t-dq").text(`${bad} 类口径问题会直接影响结论，其中 ${F.n(ROWS.filter(d=>d.cl<0).length)} 条记录出现了负库存`);
  d3.select("#t-raw").text(`每一个图上的数字都能落到这 ${F.n(v.length)} 行记录的具体行上`);
  // 单品矩阵：高人气低毛利格数量
  const mxArr=arr.filter(d=>d.qty>0),byCat=d3.group(mxArr,d=>d.cat);let pw=0;
  mxArr.forEach(d=>{const gg=byCat.get(d.cat);const share=d.qty/Math.max(d3.sum(gg,x=>x.qty),1);
    const cmAvg=d3.sum(gg,x=>x.cmTot)/Math.max(d3.sum(gg,x=>x.qty),1);
    if(share>=S.popT/gg.length&&d.cm<cmAvg)pw++;});
  d3.select("#t-mx").text(`用毛利额与人气双轴排序，${pw} 个单品落在「高人气低毛利」格，是提价与降本的第一批候选`);
  // 价格带：20 元以上单品占比的区域极差
  const pv=v.filter(d=>d.pr>0&&["个包","法包","家庭装面包","三文治"].includes(D.cats[d.c]));
  const byR=d3.rollup(pv,gg=>{const u=new Map();gg.forEach(d=>{if(!u.has(d.k))u.set(d.k,d.pr);});
    const a2=Array.from(u.values());return a2.length?a2.filter(p=>p>20).length/a2.length:0;},d=>d.r);
  const rs=Array.from(byR,([r,x])=>({r,x})).sort((a2,b2)=>b2.x-a2.x);
  if(rs.length>1)d3.select("#t-pb").text(`${regName(rs[0].r)}的 20 元以上单品占 ${F.p1(rs[0].x)}，比${regName(rs[rs.length-1].r)}高 ${((rs[0].x-rs[rs.length-1].x)*100).toFixed(0)} 个百分点`);
  else if(rs.length)d3.select("#t-pb").text(`当前口径下 20 元以上单品占 ${F.p1(rs[0].x)}，跨区比较需放开区域筛选`);
  // 面团条线
  const dv=v.filter(d=>D.chans[d.ch]==="厨房烘焙"),dys=new Set(dv.map(d=>d.d)).size||1;
  const dg=Array.from(d3.group(dv,d=>D.sku[d.k].d),([g2,rows2])=>({g2,sl:sum(rows2,d=>d.sl),
    sk:new Set(rows2.map(d=>d.k)).size})).sort((a2,b2)=>b2.sl-a2.sl);
  const dtot=d3.sum(dg,d=>d.sl)||1;let cc=0,nl=0;
  for(const d of dg){cc+=d.sl;nl++;if(cc/dtot>=0.78)break;}
  if(dg.length)d3.select("#t-dg").text(`${nl} 条面团线支撑了 ${F.p1(cc/dtot)} 的销量，另有 ${dg.filter(d=>d.sk===1).length} 条线各自只挂着 1 个单品`);
  // 报废诊断
  const ws=arr.slice().sort((a2,b2)=>b2.wval-a2.wval),tw=d3.sum(arr,d=>d.wval)||1;
  d3.select("#t-wa").text(`前 10 个单品吃掉 ${F.p1(d3.sum(ws.slice(0,10),d=>d.wval)/tw)} 的报废金额，其中 ${ws.slice(0,20).filter(d=>d.wrr>0.2).length} 个的报废率超过 20%`);
  // 新品
  const nk=D.sku.map((x,i)=>(typeof NEWSKU!=="undefined"&&NEWSKU[0]===x.n)?i:-1).filter(i=>i>=0);
  if(nk.length){const am=agg(ROWS.filter(d=>nk.includes(d.k)));
    d3.select("#t-nw").text(`新黑牛角 6 天卖出 ${F.n(am.sales)} 件、${F.money(am.rev)}元，报废率 ${F.p1(wr(am))} 高于全线 ${((wr(am)-wr(agg(ROWS)))*100).toFixed(1)} 个百分点`);}
  else d3.select("#t-nw").text(`当前数据中没有可识别的新品，下方按计划稿与同价位带给出上市推演`);
  d3.select("#t-sc").text(`${SCHEMA.length} 个字段就能驱动整套分析，换一家店、换一个业态只需替换数据`);
  d3.select("#t-mt").text(`每个指标的公式、参数取值与外部基准的出处清单`);
  timelineHeadlines();
  try{
    const P2=profitBase();
    d3.select("#t-profit").text(`按当前成本设定，店均月净利 ${F.money(P2.netD*P2.monthD)}元，保本日销售额 ${F.money(P2.beD)}元`);
    const a2=agg(v);
    d3.select("#t-flow").text(`可动用的货里 ${F.p1(a2.recv/Math.max(a2.avail,1))} 是当天出炉，${F.p1(a2.open/Math.max(a2.avail,1))} 是昨日结转`);
    const cens=v.filter(d=>d.cl<=0&&d.w===0&&d.sl>0).length;
    d3.select("#t-cx").text(`${F.p1(v.length?cens/v.length:0)} 的店–日–单品可能让顾客扑空，客退货 ${F.n(sum(v,d=>d.cr))} 件`);
    const rs=Array.from(d3.group(v,d=>d.r),([r,g])=>{const aa=agg(g),dy=new Set(g.map(d=>d.d)).size||1,
      st2=new Set(g.map(d=>d.s)).size||1;return {r,per:aa.rev/dy/st2};}).sort((x,y)=>y.per-x.per);
    if(rs.length>1)d3.select("#t-region").text(`${regName(rs[0].r)}店均日销售额是${regName(rs[rs.length-1].r)}的 ${(rs[0].per/rs[rs.length-1].per).toFixed(2)} 倍，缺竞品与商圈数据无法归因`);
    else d3.select("#t-region").text(`当前口径只剩一个区域，位势对比需放开区域筛选`);
  }catch(e){console.warn("dimHeadlines",e);}
}
/* ==================== 渲染编排 ==================== */
const DRAW={kpi:drawKPI,trend:drawTrend,region:drawRegion,mekko:drawMekko,flowmoney:drawFlowMoney,
  flowmoney2:drawFlowMoney2,sankey:drawSankey,balance:drawBalance,scatter:drawScatter,storetbl:drawStoreTbl,
  spark:drawSpark,treemap:drawTreemap,channel:drawChannel,pareto:drawPareto,abc:drawABC,skuopt:drawSkuOpt,
  matrix:drawMatrix,mxtbl:drawMatrix,heat:drawHeat,cover:drawCover,pricediff:drawPriceDiff,
  band:drawBand,bandrev:drawBandRev,banddes:drawBandDesign,priceopt:drawPriceOpt,
  dough:drawDough,doughtbl:drawDoughTbl,waterfall:drawWaterfall,wastesku:drawWasteSku,wasteheat:drawWasteHeat,
  wasteopt:drawWasteOpt,nvcurve:drawNvCurve,nvtbl:drawNvTbl,newcurve:drawNewCurve,plantbl:drawPlanTbl,
  newsim:drawNewSim,quality:drawQuality,raw:drawRaw,map:drawMap,dict:drawDict,schema:drawSchema,
  analog:drawAnalog,formulas:drawFormulas,refs:drawRefs,
  histline:drawHistLine,histcum:drawHistCum,histwk:drawHistWk,histmix:drawHistMix,histgrid:drawHistGrid,
  fcfan:drawFcFan,fcscn:drawFcScn,fcbridge:drawFcBridge,fccum:drawFcCum,
  simspec:drawSimSpec,simpar:drawSimPar,simtor:drawSimTor,simcen:drawSimCen,
  brief:drawBrief,chain:drawChain,cadence:drawCadence,
  pbridge:drawProfitBridge,breakeven:drawBreakeven,skuprofit:drawSkuProfit,
  funnel:drawFlowFunnel,carry:drawCarryOver,transfer:drawTransfer,
  stockout:drawStockout,returns:drawReturns,shelf:drawShelfDepth,
  regpos:drawRegionPos,regovl:drawRegionOverlap,compgap:drawCompGap,
  waffle:drawWaffle,slope:drawSlope,lorenz:drawLorenz,skuopt2:drawSkuOpt2,cluster:drawCluster,
  elastic:drawElastic,dbox:drawDemandBox,opp:drawOpp,driver:drawDriver};
let rafId=null,_drawn=new Set();
function render(all){
  if(rafId)cancelAnimationFrame(rafId);
  rafId=requestAnimationFrame(()=>{
    _sku=null;skuCacheClear();
    syncFilterUI();
    try{headlines();}catch(e){console.warn("headlines",e);}
    const keys=all?Object.keys(DRAW):Array.from(activeK());
    const anim=ANIM_NEXT;ANIM_NEXT=false;
    const one=k=>{const f=DRAW[k];if(!f)return;
      try{f();_drawn.add(k);if(anim)enterAnim("#c-"+k);}catch(e){console.warn(k,e);}
      try{markWide(k);}catch(e){}};
    if(S.viz&&keys.length>6){
      /* 通览页有几十张图，按文档顺序分片绘制，先出上屏，避免一次性卡住 */
      let i=0;
      const prog=d3.select("#viz-prog");
      const step=()=>{const t0=Date.now();
        while(i<keys.length&&Date.now()-t0<26)one(keys[i++]);
        if(i<keys.length){prog.style("display",null).text(`正在重算 ${i} / ${keys.length}`);
          requestAnimationFrame(step);}
        else{prog.style("display","none");applyHL();}};
      step();
    }else{keys.forEach(one);applyHL();}
    const nS=document.querySelectorAll("main svg").length,nT=document.querySelectorAll("main table").length;
    if(S.viz)try{d3.select("#dc-note").html(dcInsight());}catch(e){}
    stateToHash();
    d3.select("#t-map").text(`${D.uploaded?"你的":"8 张"}工作表、${SCHEMA.length} 个字段，映射到 ${FORMULAS.length} 组决策指标、${_drawn.size} 个联动面板`);
  });
}
/* 宽图在看板模式下独占一行：按 viewBox 实际宽度自动判定 */
function markWide(k){
  const c=document.getElementById("c-"+k);if(!c)return;
  const pn=c.closest(".panel");if(!pn)return;
  const svg=c.querySelector("svg");
  let wide=0;
  if(svg){
    /* 按设计宽度判定：980 宽的图缩到半幅会把 10px 的标签压到 7px，必须整行 */
    const vb=svg.getAttribute("viewBox");
    const w=vb?parseFloat(vb.split(/[\s,]+/)[2]):0;
    const fixed=(svg.style&&svg.style.width||"").indexOf("px")>0;
    wide=(fixed||w>=860)?1:0;}
  else{const th=c.querySelectorAll("thead th").length;wide=th>=10?1:0;}
  pn.setAttribute("data-wide",wide?"1":"0");
}
/* ==================== 控件绑定 ==================== */
function bind(){
  const B=[["cost-bake","costBake",100,"cost-bakev",F.p0],["cost-buy","costBuy",100,"cost-buyv",F.p0],
    ["popT","popT",100,"popTv",F.p0],["abcA","abcA",100,"abcAv",F.p0],["abcB","abcB",100,"abcBv",F.p0],
    ["nv-m","nvMargin",100,"nv-mv",F.p0],["nv-s","nvSalv",100,"nv-sv",F.p0],["nv-c","nvCost",100,"nv-cv",F.p0],
    ["as-min","asMin",1,"as-minv",d=>d],["nw-st","newStores",1,"nw-stv",d=>d]];
  B.forEach(([id,key,div,lab,fmt])=>{
    const el=document.getElementById(id);if(!el)return;
    const upd=()=>{S[key]=+el.value/div;d3.select("#"+lab).text(fmt(S[key]));};
    upd();el.addEventListener("input",()=>{upd();render();});});
  const ac=d3.select("#as-cat");
  ac.selectAll("option").data(["全部"].concat(D.cats)).join("option").attr("value",d=>d).text(d=>d);
  ac.on("change",function(){S.asCat=this.value;drawHeat();});
  d3.select("#as-sort").on("change",function(){S.asSort=this.checked;drawHeat();});
  const FC=[["fc-g","fcGrowth",1000,"fc-gv",v=>F.p1(v)],["fc-we","fcWeekend",100,"fc-wev",v=>v.toFixed(2)],
    ["fc-hd","fcHolidays",1,"fc-hdv",v=>v+" 天"],["fc-st","fcStores",1,"fc-stv",v=>v+" 家"],
    ["fc-w","fcWaste",100,"fc-wv",F.p0],["fc-rp","fcRamp",1,"fc-rpv",v=>v+" 周"],
    ["fc-tl","fcTail",1,"fc-tlv",v=>v+" 件/店日"],["fc-tk","fcTailKeep",100,"fc-tkv",F.p0],
    ["fc-nw","fcNew",1,"fc-nwv",v=>v+" 款"],["fc-pr","fcPrice",100,"fc-prv",F.p1],
    ["fc-iv","fcInvest",1,"fc-ivv",v=>F.yuan(v)]];
  FC.forEach(([id,key,div,lab,fmt])=>{
    const el=document.getElementById(id);if(!el)return;
    const upd=()=>{S[key]=+el.value/div;d3.select("#"+lab).text(fmt(S[key]));};
    upd();el.addEventListener("input",()=>{upd();render();});});
  d3.select("#fc-wk").on("change",function(){S.fcWeeks=+this.value;ANIM_NEXT=true;render();});
  d3.select("#cen-on").on("change",function(){S.censorOn=this.checked;render();});
  const rq=document.getElementById("raw-q");
  if(rq)rq.addEventListener("input",()=>{S.rawQ=rq.value;S.rawPage=0;drawRaw();});
  d3.select("#raw-size").on("change",function(){S.rawSize=+this.value;S.rawPage=0;drawRaw();});
  /* 默认人工/租金按实测店均月销售额的 22% / 12% 标定，避免出现失真的高净利率 */
  (function seedCost(){
    try{const a=agg(view()),M=a.rev/Math.max(a.days,1)/Math.max(a.stores,1)*30.4;
      if(!S.laborM)S.laborM=Math.round(M*0.22/5000)*5000;
      if(!S.rentM)S.rentM=Math.round(M*0.12/5000)*5000;
      const l=document.getElementById("p-labor"),r=document.getElementById("p-rent");
      if(l){l.max=Math.max(300000,Math.ceil(M*0.6/10000)*10000);l.value=S.laborM;}
      if(r){r.max=Math.max(300000,Math.ceil(M*0.4/10000)*10000);r.value=S.rentM;}
    }catch(e){}
  })();
  const PC=[["p-labor","laborM",1,"p-laborv",v=>(v/10000).toFixed(1)+"万"],
    ["p-rent","rentM",1,"p-rentv",v=>(v/10000).toFixed(1)+"万"],
    ["p-var","varRate",100,"p-varv",F.p0]];
  PC.forEach(([id,key,div,lab,fmt])=>{
    const el=document.getElementById(id);if(!el)return;
    const upd=()=>{S[key]=+el.value/div;d3.select("#"+lab).text(fmt(S[key]));};
    upd();el.addEventListener("input",()=>{upd();render();});});
  const sk=document.getElementById("sim-k");
  if(sk){const up=()=>{S.simK=+sk.value;d3.select("#sim-kv").text(S.simK);};up();
    sk.addEventListener("input",()=>{up();drawCluster();});}
  const ec=d3.select("#el-cat");
  ec.selectAll("option").data(["全部"].concat(D.cats)).join("option").attr("value",d=>d).text(d=>d);
  ec.on("change",function(){S.elCat=this.value;drawElastic();});
}
bindDrill();bindShell();hashToState();buildBoards();buildFilters();bind();syncBoards();render();
window.addEventListener("hashchange",()=>{if(hashToState()){buildBoards();buildFilters();bind();syncBoards();ANIM_NEXT=true;render();}});
</script>
