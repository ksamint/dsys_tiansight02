<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<!-- @template name="侍天 销售提案 (16:9)" description="Fourteen-slide sales deck pitching 侍天 to a restaurant owner — 封面, 主张, 服务内容 (四个阶段), 服务模式, 方法论 (第二大脑 · 样张 · 图谱), 价值, 案例, 伙伴, 创始团队, 联系." -->
<helmet><script src="./ds-base.js"></script><style>html,body{margin:0;background:#241F19}</style></helmet>
<x-import component-from-global-scope="deck-stage" from="./deck-stage.js" width="1280" height="720" hint-size="100%,100%">
<section data-label="封面" data-screen-label="01" style="width:1280px;height:720px;overflow:hidden"><x-import component-from-global-scope="TIANSIGHTDesignSystem_703ad4.TitleSlide" client="潜在客户" date="2026-09-19" page="{{ 1 }}" hint-size="1280px,720px"></x-import></section>
<section data-label="主张" data-screen-label="02" style="width:1280px;height:720px;overflow:hidden"><x-import component-from-global-scope="TIANSIGHTDesignSystem_703ad4.PromiseSlide" page="{{ 2 }}" hint-size="1280px,720px"></x-import></section>
<section data-label="节首 · 服务内容" data-screen-label="03" style="width:1280px;height:720px;overflow:hidden"><x-import component-from-global-scope="TIANSIGHTDesignSystem_703ad4.SectionSlide" index="{{ 1 }}" title="从概念到连锁" subtitle="开店之前 · 经营之中 · 每月复盘 · 复制扩张" page="{{ 3 }}" hint-size="1280px,720px"></x-import></section>
<section data-label="四个阶段" data-screen-label="04" style="width:1280px;height:720px;overflow:hidden"><x-import component-from-global-scope="TIANSIGHTDesignSystem_703ad4.FiveQuestionsSlide" active="{{ activeStage }}" page="{{ 4 }}" hint-size="1280px,720px"></x-import></section>
<section data-label="服务模式" data-screen-label="05" style="width:1280px;height:720px;overflow:hidden"><x-import component-from-global-scope="TIANSIGHTDesignSystem_703ad4.ServiceModelSlide" highlight="{{ proposedTier }}" page="{{ 5 }}" hint-size="1280px,720px"></x-import></section>
<section data-label="节首 · 方法论" data-screen-label="06" style="width:1280px;height:720px;overflow:hidden"><x-import component-from-global-scope="TIANSIGHTDesignSystem_703ad4.SectionSlide" index="{{ 2 }}" title="餐饮第二大脑" subtitle="菜单推演 · 经营看板 · 教练式督导 · 持续复盘" page="{{ 6 }}" hint-size="1280px,720px"></x-import></section>
<section data-label="餐饮第二大脑" data-screen-label="07" style="width:1280px;height:720px;overflow:hidden"><x-import component-from-global-scope="TIANSIGHTDesignSystem_703ad4.LadderSlide" page="{{ 7 }}" hint-size="1280px,720px"></x-import></section>
<section data-label="样张为证" data-screen-label="08" style="width:1280px;height:720px;overflow:hidden"><x-import component-from-global-scope="TIANSIGHTDesignSystem_703ad4.ProofSlide" page="{{ 8 }}" hint-size="1280px,720px"></x-import></section>
<section data-label="图谱" data-screen-label="09" style="width:1280px;height:720px;overflow:hidden"><x-import component-from-global-scope="TIANSIGHTDesignSystem_703ad4.ChartSlide" figure="{{ chartFigure }}" page="{{ 9 }}" hint-size="1280px,720px"></x-import></section>
<section data-label="老板看到的价值" data-screen-label="10" style="width:1280px;height:720px;overflow:hidden"><x-import component-from-global-scope="TIANSIGHTDesignSystem_703ad4.ValueSlide" page="{{ 10 }}" hint-size="1280px,720px"></x-import></section>
<section data-label="伙伴案例" data-screen-label="11" style="width:1280px;height:720px;overflow:hidden"><x-import component-from-global-scope="TIANSIGHTDesignSystem_703ad4.CaseSlide" sample="{{ caseIsSample }}" page="{{ 11 }}" hint-size="1280px,720px"></x-import></section>
<section data-label="伙伴背书" data-screen-label="12" style="width:1280px;height:720px;overflow:hidden"><x-import component-from-global-scope="TIANSIGHTDesignSystem_703ad4.PartnerWallSlide" page="{{ 12 }}" hint-size="1280px,720px"></x-import></section>
<section data-label="创始团队" data-screen-label="13" style="width:1280px;height:720px;overflow:hidden"><x-import component-from-global-scope="TIANSIGHTDesignSystem_703ad4.ExpertTeamSlide" eyebrow="创始团队" title="产品决定顾客的选择，组织决定承诺能否兑现。" subtitle="侍天把这两件事放在同一张经营蓝图里。" experts="{{ founders }}" page="{{ 13 }}" hint-size="1280px,720px"></x-import></section>
<section data-label="联系" data-screen-label="14" style="width:1280px;height:720px;overflow:hidden"><x-import component-from-global-scope="TIANSIGHTDesignSystem_703ad4.ContactSlide" page="{{ 14 }}" hint-size="1280px,720px"></x-import></section>
</x-import>
</x-dc>
<script type="text/x-dc" data-dc-script data-props="{&quot;activeStage&quot;:{&quot;editor&quot;:&quot;int&quot;,&quot;default&quot;:1,&quot;min&quot;:0,&quot;max&quot;:3,&quot;tsType&quot;:&quot;number&quot;,&quot;section&quot;:&quot;四个阶段&quot;},&quot;proposedTier&quot;:{&quot;editor&quot;:&quot;int&quot;,&quot;default&quot;:1,&quot;min&quot;:-1,&quot;max&quot;:2,&quot;tsType&quot;:&quot;number&quot;,&quot;section&quot;:&quot;服务模式&quot;},&quot;chartFigure&quot;:{&quot;editor&quot;:&quot;enum&quot;,&quot;default&quot;:&quot;scatter&quot;,&quot;options&quot;:[&quot;scatter&quot;,&quot;waterfall&quot;,&quot;corridor&quot;],&quot;tsType&quot;:&quot;\&quot;scatter\&quot; | \&quot;waterfall\&quot; | \&quot;corridor\&quot;&quot;,&quot;section&quot;:&quot;图谱 · scatter 渗透率矩阵 · waterfall 利润归因 · corridor 菜单推演&quot;},&quot;caseIsSample&quot;:{&quot;editor&quot;:&quot;boolean&quot;,&quot;default&quot;:true,&quot;tsType&quot;:&quot;boolean&quot;,&quot;section&quot;:&quot;伙伴案例&quot;}}">
class Component extends DCLogic {
  renderVals() {
    // Slide 9 图谱: ChartSlide's built-in d3 figures (scatter 渗透率矩阵 · waterfall 利润归因 ·
    // corridor 菜单推演) — picked by the chartFigure tweak; d3 v7 is loaded by ds-base.js.
    const founders = [
      { name: "边江", title: "创始人 · 北京大学经济学背景，近三十年餐饮实战经验；曾任海底捞品牌负责人，创办尖味菜单工作室，服务中国 100 多个餐饮品牌", field: "餐饮定位 · 产品结构 · 菜单体系 · 利润模型" },
      { name: "郭峰", title: "瑞士洛桑酒店管理学院（EHL）中国区创始团队成员，参与 EHL 集团在华业务体系搭建", field: "服务体验 · 组织能力构建 · 经营系统建设" }
    ];
    const p = this.props;
    return {
      founders,
      activeStage: p.activeStage ?? 1,
      proposedTier: p.proposedTier ?? 1,
      chartFigure: p.chartFigure ?? "scatter",
      caseIsSample: p.caseIsSample ?? true
    };
  }
}
</script>
</body>
</html>
