<!doctype html><html><head><meta charset="utf-8"><link rel="stylesheet" href="../styles.css"><style>html,body{margin:0}body{background:var(--surface-page);padding:18px 20px;font-family:var(--font-body)}.g{display:flex;gap:10px}.sw{flex:1;display:flex;flex-direction:column;justify-content:flex-end;height:96px;border-radius:var(--radius-sm);padding:8px 10px;border:1px solid var(--line-hairline)}.sw b{font-family:var(--font-mono);font-size:10px;font-weight:500;letter-spacing:0}.sw i{font-family:var(--font-mono);font-size:9px;font-style:normal;opacity:.65}.k{font-family:var(--font-mono);font-size:10px;color:var(--text-muted)}.al{display:grid;grid-template-columns:repeat(3,1fr);gap:6px 18px}.al div{display:flex;align-items:center;gap:8px;font-family:var(--font-mono);font-size:10.5px;color:var(--ink-700)}.al span{width:16px;height:16px;border-radius:2px;border:1px solid var(--line-hairline);flex-shrink:0}</style></head><body><div class="al">

</div></body></html>
