<!doctype html>
<html lang="zh">
<head><meta charset="utf-8"><title>Wordmark — preview</title><style>body{padding:20px;margin:0}.row{display:flex;gap:0;flex-wrap:wrap}.cell{flex:1;min-width:260px;padding:28px 24px;display:flex;flex-direction:column;gap:14px}.lbl{font-family:var(--font-en);font-size:11px;letter-spacing:.16em;text-transform:uppercase}</style></head>
<body>
<div id="root"></div>
<script>
var NS = window.TIANSIGHT, h = React.createElement;
function cell(bg, inverse, label, labelColor) {
  return h("div", { className: "cell", style: { background: bg } },
    h("span", { className: "lbl", style: { color: labelColor } }, label),
    h(NS.Wordmark, { fontSize: "40px", inverse: inverse }),
    h(NS.Wordmark, { fontSize: "16px", inverse: inverse }));
}
ReactDOM.createRoot(document.getElementById("root")).render(
  h("div", { className: "row" },
    cell("var(--surface)", false, "On surface · T A ink 700 · INSIGHT gold-400", "var(--text-muted)"),
    cell("var(--charcoal)", true, "On charcoal · inverse", "rgba(244,240,231,.72)")));
</script>
</body>
</html>
