      footnote: { label: "目标值", text: "基线形成后共同确认。" } }));

    people.forEach((x) => add(S(x.group + " · " + x.name, "ProfileSlide", { eyebrow: "团队 · " + x.group, name: x.name, latin: x.latin, photo: x.photo, roles: x.roles, bio: x.bio, highlights: x.highlights, highlightsLabel: x.highlightsLabel }), on.team));

    add(S("展陈诊断", "ModuleDetailSlide", { eyebrow: "合作入口 · 展陈诊断", title: "合作从一次展陈诊断开始", subtitle: "看现场、看菜单、看点单，先找出最值得改的三处。", stats: [],

    add(S("联系", "ContactSlide", Object.assign({}, window.TIANSIGHT_CONTACT)));

    return { slides: L.map((s, i) => ({ label: s.label, comp: s.comp, props: Object.assign(deep(s.props), { page: i + 1 }) })) };
  }
